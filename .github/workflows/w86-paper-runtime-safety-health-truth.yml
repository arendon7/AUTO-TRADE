name: W86 PAPER Runtime Safety Health Truth

on:
  pull_request:
    paths:
      - "src/autotrade/paper_runtime_safety_health_truth.py"
      - "src/autotrade/paper_runtime_candidate_identity.py"
      - "src/autotrade/state.py"
      - "src/autotrade/safety.py"
      - "src/autotrade/risk_state.py"
      - "src/autotrade/persistence.py"
      - "src/autotrade/health_bridge.py"
      - "src/autotrade/research/health.py"
      - "scripts/mac_crypto_health_commissioning.py"
      - "scripts/mac_crypto_execution_health_readiness.py"
      - "tests/test_w86_paper_runtime_safety_health_truth.py"
      - "scripts/check_w86_paper_runtime_safety_health_truth_boundary.py"
      - "scripts/check_mac_crypto_health_commissioning.py"
      - "scripts/check_r6_core_provenance_boundary.py"
      - "scripts/check_r6_readiness_boundary.py"
      - ".github/workflows/w86-paper-runtime-safety-health-truth.yml"
      - ".github/workflows/core-tests.yml"

permissions:
  contents: read

jobs:
  paper-runtime-safety-health-truth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile W86 Safety Health truth surface
        run: >-
          python -m compileall -q
          src/autotrade/paper_runtime_safety_health_truth.py
          tests/test_w86_paper_runtime_safety_health_truth.py
          scripts/check_w86_paper_runtime_safety_health_truth_boundary.py
      - name: W86 Safety Health truth authority boundary
        run: python scripts/check_w86_paper_runtime_safety_health_truth_boundary.py
      - name: W86 Safety Health truth adversarial tests
        run: pytest -q tests/test_w86_paper_runtime_safety_health_truth.py
      - name: Re-prove W86 exact candidate identity
        run: python scripts/check_w86_paper_runtime_candidate_identity_boundary.py
      - name: Re-prove R6 read-only core provenance
        run: python scripts/check_r6_core_provenance_boundary.py
      - name: Re-prove R6 read-only readiness
        run: python scripts/check_r6_readiness_boundary.py
      - name: Re-prove R6 crypto Health commissioning boundary
        run: python scripts/check_mac_crypto_health_commissioning.py
      - name: Re-prove R6 PAPER-only authority boundary
        run: python scripts/check_r6_authority.py
      - name: Re-prove R6 permanent LIVE deny
        run: python scripts/check_r6_live_deny_boundary.py
      - name: Re-prove W85 candidate admission
        run: python scripts/check_w85_paper_candidate_admission_boundary.py
      - name: Re-prove W86 durable source
        run: python scripts/check_w86_paper_runtime_readiness_boundary.py
      - name: Re-prove W86 atomic source snapshot
        run: python scripts/check_w86_paper_runtime_readiness_snapshot_boundary.py
      - name: Re-prove research authority
        run: python scripts/check_research_authority.py
