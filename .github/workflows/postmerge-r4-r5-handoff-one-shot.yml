name: R4 Post-Merge Certification and R5 Handoff

on:
  push:
    branches:
      - reconstruction/r4-portfolio-health
    paths:
      - .github/workflows/postmerge-r4-r5-handoff-one-shot.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  certify-main-and-open-r5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Capture and validate integrated R4 main
        run: |
          set -euo pipefail
          MAIN_SHA="$(git rev-parse HEAD)"
          echo "MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          python - <<'PY'
          import json
          from pathlib import Path

          cert_path = Path('knowledge/60_EVIDENCE/R4_CERTIFICATION.json')
          assert cert_path.exists(), 'R4 certificate is not integrated into main'
          cert = json.loads(cert_path.read_text())
          assert cert['track'] == 'R4'
          assert cert['certification_basis_head'] == '350efd43ac133c95a1997b4a821a2e0bab4afaf2'
          assert cert['open_r4_blocking_debt_ids'] == []
          assert cert['capital_authority'] == 'NONE'
          assert cert['live_trading'] == 'BLOCKED'

          debt = json.loads(Path('knowledge/00_CANON/debt_register.json').read_text())
          assert 'R4' in debt['certified_tracks'], debt['certified_tracks']
          blockers = [
              item['id'] for item in debt['items']
              if item.get('track') == 'R4'
              and item.get('status') == 'OPEN'
              and item.get('severity') in {'P0','P1','P2'}
          ]
          assert blockers == [], blockers

          matrix = Path('knowledge/00_CANON/RECONSTRUCTION_V028R_MATRIX.md').read_text()
          r4_rows = []
          for line in matrix.splitlines():
              if line.startswith('| R4 |'):
                  cells = [cell.strip() for cell in line.strip('|').split('|')]
                  r4_rows.append((cells[1], cells[3]))
          assert len(r4_rows) == 8, r4_rows
          assert all(status == 'PASS' for _, status in r4_rows), r4_rows
          PY
      - name: Install dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile and full post-merge certification suite
        run: |
          set -euo pipefail
          python -m compileall -q src tests scripts
          pytest -q \
            --cov=autotrade \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:/tmp/r4-postmerge-coverage.xml \
            --junitxml=/tmp/r4-postmerge-junit.xml \
            --cov-fail-under=85
          python scripts/check_contract_registry.py
          python scripts/check_research_authority.py
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
          pytest -q tests/test_r4_certification_contract.py
      - name: Verify main did not move while certifying
        run: |
          set -euo pipefail
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$REMOTE_MAIN" = "$MAIN_SHA" || {
            echo "main moved during certification: tested=$MAIN_SHA current=$REMOTE_MAIN" >&2
            exit 1
          }
      - name: Parse exact post-merge evidence
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          junit = ET.parse('/tmp/r4-postmerge-junit.xml').getroot()
          # pytest may emit <testsuites><testsuite .../></testsuites>.
          suites = [junit] if junit.tag == 'testsuite' else list(junit.findall('testsuite'))
          tests = sum(int(s.attrib.get('tests', '0')) for s in suites)
          failures = sum(int(s.attrib.get('failures', '0')) for s in suites)
          errors = sum(int(s.attrib.get('errors', '0')) for s in suites)
          skipped = sum(int(s.attrib.get('skipped', '0')) for s in suites)
          assert failures == 0 and errors == 0

          coverage = ET.parse('/tmp/r4-postmerge-coverage.xml').getroot()
          line_rate = float(coverage.attrib['line-rate']) * 100.0
          branch_rate = float(coverage.attrib.get('branch-rate', '0')) * 100.0
          assert line_rate >= 85.0
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write(f'POSTMERGE_TESTS={tests}\n')
              handle.write(f'POSTMERGE_SKIPPED={skipped}\n')
              handle.write(f'POSTMERGE_LINE_COVERAGE={line_rate:.2f}\n')
              handle.write(f'POSTMERGE_BRANCH_COVERAGE={branch_rate:.2f}\n')
          print(f'post-merge tests={tests} skipped={skipped} line={line_rate:.2f}% branch={branch_rate:.2f}%')
          PY
      - name: Create R5 branch exactly from tested main
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin reconstruction/r5-stream-shadow >/tmp/r5-existing 2>/dev/null; then
            EXISTING="$(awk '{print $1}' /tmp/r5-existing)"
            test "$EXISTING" = "$MAIN_SHA" || {
              echo "R5 branch already exists at unexpected SHA $EXISTING; expected tested main $MAIN_SHA" >&2
              exit 1
            }
            git switch -C reconstruction/r5-stream-shadow "$MAIN_SHA"
          else
            git switch -c reconstruction/r5-stream-shadow "$MAIN_SHA"
          fi
      - name: Register R5 debt before any implementation
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path

          root = Path('.')
          debt_path = root / 'knowledge/00_CANON/debt_register.json'
          debt = json.loads(debt_path.read_text())
          if debt.get('certified_tracks') != ['R0','R1','R2','R3','R4']:
              raise SystemExit(f"unexpected certified tracks: {debt.get('certified_tracks')}")

          new_items = [
              {
                  'id':'TD-R5-001','severity':'P1','track':'R5','area':'Closed-kline read-only stream boundary','status':'OPEN','resolution':'','evidence':[],
                  'next_action':'Implement an explicit opt-in public read-only closed-kline stream with fixed approved host/path, no credentials/private endpoints/trading methods, bounded messages/timeouts and canonical closed-bar conversion; malformed/future/open candles fail closed.'
              },
              {
                  'id':'TD-R5-002','severity':'P1','track':'R5','area':'Stream continuity and idempotency','status':'OPEN','resolution':'','evidence':[],
                  'next_action':'Implement deterministic duplicate idempotency and strict continuity: gap, out-of-order, conflicting duplicate or interval mismatch transitions stream evidence to a fail-closed state; never silently impute/resample missing klines.'
              },
              {
                  'id':'TD-R5-003','severity':'P1','track':'R5','area':'Stream lifecycle / DEGRADED semantics','status':'OPEN','resolution':'','evidence':[],
                  'next_action':'Unexpected socket termination/timeouts/protocol ambiguity must persist DEGRADED evidence. Automatic reconnect must not erase continuity history or conceal gaps; recovery requires explicit continuity proof/policy.'
              },
              {
                  'id':'TD-R5-004','severity':'P1','track':'R5','area':'Synchronized portfolio shadow','status':'OPEN','resolution':'','evidence':[],
                  'next_action':'Implement shadow portfolio evidence with frozen strategy weights/config fingerprints and exact common closed-kline timestamps; missing strategy/timestamp, silent resampling/imputation, weight drift or identity mismatch fails closed.'
              },
              {
                  'id':'TD-R5-005','severity':'P1','track':'R5','area':'Forward evidence separation','status':'OPEN','resolution':'','evidence':[],
                  'next_action':'Implement immutable post-activation forward evidence separated from TRAIN/DEVELOPMENT/FINAL_HOLDOUT. Activation timestamp/config/weights must be frozen before evidence begins; no HOLDOUT access or retroactive backfill.'
              },
              {
                  'id':'TD-R5-006','severity':'P1','track':'R5','area':'R5 authority boundary','status':'OPEN','resolution':'','evidence':[],
                  'next_action':'Extend permanent CI authority checks so streaming/shadow/forward-evidence code cannot import OMS/broker execution authority, create OrderIntent/RiskDecision or call submit/cancel/replace. R5 adds no external PAPER/LIVE authority.'
              }
          ]
          existing = {item['id'] for item in debt['items']}
          collision = existing.intersection(item['id'] for item in new_items)
          if collision:
              raise SystemExit(f'R5 debt ids already exist unexpectedly: {sorted(collision)}')
          debt['items'].extend(new_items)
          debt_path.write_text(json.dumps(debt, indent=2, ensure_ascii=False) + '\n')

          main_sha = os.environ['MAIN_SHA']
          tests = int(os.environ['POSTMERGE_TESTS'])
          line_cov = float(os.environ['POSTMERGE_LINE_COVERAGE'])
          branch_cov = float(os.environ['POSTMERGE_BRANCH_COVERAGE'])
          evidence = {
              'schema_version': 1,
              'track': 'R4',
              'status': 'INTEGRATED_POST_MERGE_CERTIFIED',
              'main_sha': main_sha,
              'branch_certification_basis': '350efd43ac133c95a1997b4a821a2e0bab4afaf2',
              'post_merge': {
                  'full_suite': 'PASS',
                  'tests': tests,
                  'line_coverage_percent': round(line_cov, 2),
                  'branch_coverage_percent': round(branch_cov, 2),
                  'coverage_minimum_percent': 85.0,
                  'contract_registry': 'PASS',
                  'research_advisory_authority_boundary': 'PASS',
                  'debt_register_contract': 'PASS',
                  'knowledge_contract': 'PASS',
                  'r4_certification_contract': 'PASS'
              },
              'source_of_r5_branch': main_sha,
              'capital_authority': 'NONE',
              'external_paper_authority': 'NONE_ADDED_BY_R4',
              'live_trading': 'BLOCKED'
          }
          (root / 'knowledge/60_EVIDENCE/R4_POST_MERGE_CERTIFICATION.json').write_text(
              json.dumps(evidence, indent=2) + '\n'
          )

          (root / 'knowledge/00_CANON/DEBT_REGISTER.md').write_text(f'''# DEBT REGISTER — v0.28R

Fecha: 2026-08-10
Estado: ACTIVE — **R0–R4 CERTIFIED; R5 ACTIVE**

## Authority
La autoridad machine-readable es `knowledge/00_CANON/debt_register.json`.

## Certified tracks
- R0 — PASS
- R1 — PASS
- R2 — PASS
- R3 — PASS
- R4 — **PASS e integrado/post-merge certificado en `main` `{main_sha}`**

## Open debt
| ID | Sev | Track | Área |
|---|---|---|---|
| `TD-R5-001` | P1 | R5 | Closed-kline read-only stream boundary |
| `TD-R5-002` | P1 | R5 | Stream continuity and idempotency |
| `TD-R5-003` | P1 | R5 | Stream lifecycle / DEGRADED semantics |
| `TD-R5-004` | P1 | R5 | Synchronized portfolio shadow |
| `TD-R5-005` | P1 | R5 | Forward evidence separation |
| `TD-R5-006` | P1 | R5 | R5 authority boundary |
| `TD-OPS-001` | P3 | OPS | Graphify semantic/deep graph pending in supported runtime |

R5 no puede certificarse mientras cualquiera de `TD-R5-001..006` esté OPEN.

## Capital
**LIVE TRADING: BLOQUEADO.** External PAPER sigue fuera de R5 y pertenece a R6.
''')

          (root / 'knowledge/00_CANON/ESTADO_ACTUAL.md').write_text(f'''# ESTADO ACTUAL — AUTO-TRADE

Fecha: 2026-08-10
Estado canónico: **v0.28R — R0–R4 CERTIFIED; R5 ACTIVE**

R4 está integrado y recertificado post-merge sobre `main` `{main_sha}`. Evidencia: `knowledge/60_EVIDENCE/R4_POST_MERGE_CERTIFICATION.json`.

## R5 activo
Objetivo: read-only closed-kline streaming + continuity/DEGRADED semantics + synchronized shadow + forward evidence separated from HOLDOUT.

Antes de implementar se registraron `TD-R5-001..006` P1. Ninguna capacidad R5 concede broker/PAPER/LIVE authority.

## Deuda no bloqueante de tooling
`TD-OPS-001` Graphify P3 permanece OPEN; no fabricar `graphify-out`.

## Capital
**LIVE TRADING: BLOQUEADO.**
''')

          (root / 'knowledge/00_CANON/TAREA_ACTIVA.md').write_text('''# TAREA ACTIVA — AUTO-TRADE

## Track
**R5 — read-only stream, synchronized shadow and forward evidence.**

## Orden obligatorio
1. `TD-R5-001`: closed-kline public read-only stream boundary, disabled by default.
2. `TD-R5-002`: duplicate idempotency + gap/out-of-order fail-closed; no imputation.
3. `TD-R5-003`: unexpected termination -> durable DEGRADED; reconnect cannot hide continuity gaps.
4. `TD-R5-004`: synchronized portfolio shadow with frozen weights/config and exact timestamps.
5. `TD-R5-005`: post-activation forward evidence separated from FINAL_HOLDOUT.
6. `TD-R5-006`: permanent R5 authority boundary in CI.
7. adversarial audit + debt closure + certification.

## Negative tests mínimos
- open/incomplete candle rejected;
- duplicate same payload idempotent, conflicting duplicate rejected;
- missing/out-of-order interval -> fail closed;
- no silent imputation/resampling;
- socket termination -> DEGRADED;
- reconnect cannot erase recorded gap;
- shadow timestamp/weight/config mismatch rejected;
- forward evidence cannot read FINAL_HOLDOUT or backfill before activation;
- streaming/shadow modules have no OMS/broker execution authority.

## Capital
**LIVE TRADING: BLOQUEADO.** External PAPER is R6, not R5.
''')

          (root / 'knowledge/40_HANDOFF/HANDOFF_ACTUAL.md').write_text(f'''# HANDOFF ACTUAL — AUTO-TRADE

Fecha: 2026-08-10
Estado: **R4 integrated/post-merge certified; R5 governance opened**

## Certified main base
`{main_sha}`

Post-merge R4 evidence: `knowledge/60_EVIDENCE/R4_POST_MERGE_CERTIFICATION.json`.
Full post-merge suite: {tests} tests PASS; line coverage {line_cov:.2f}% (>=85%); contracts/authority/debt/knowledge/R4-certification contract PASS.

## R5 branch
`reconstruction/r5-stream-shadow` was created from the exact tested main SHA above, then only governance/debt registration was added before implementation.

## R5 debt
`TD-R5-001..006` are OPEN P1 and block R5 certification.

## Capital
No external PAPER/LIVE authority. **LIVE TRADING: BLOQUEADO.**
''')

          (root / 'knowledge/00_CANON/CONTEXTO_RAPIDO.md').write_text(f'''# CONTEXTO RÁPIDO — AUTO-TRADE

Estado: **R0–R4 certified; R5 active**.

Main certified base: `{main_sha}`.
Read first: SOURCE_OF_TRUTH -> ESTADO_ACTUAL -> TAREA_ACTIVA -> RECONSTRUCTION_V028R_MATRIX -> debt_register.json -> HANDOFF_ACTUAL -> R4_POST_MERGE_CERTIFICATION.json.

R5 debt registered before code: `TD-R5-001..006`.
R5 = read-only closed-kline stream -> continuity/DEGRADED -> synchronized shadow -> forward evidence without HOLDOUT.

AI/research/shadow have no execution authority. External PAPER/LIVE remains blocked.
''')
          PY
      - name: Validate R5 governance before commit
        run: |
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
          python - <<'PY'
          import json
          from pathlib import Path
          debt = json.loads(Path('knowledge/00_CANON/debt_register.json').read_text())
          r5 = [i for i in debt['items'] if i.get('track') == 'R5']
          assert {i['id'] for i in r5} == {f'TD-R5-{n:03d}' for n in range(1,7)}
          assert all(i['status'] == 'OPEN' and i['severity'] == 'P1' for i in r5)
          assert 'R5' not in debt['certified_tracks']
          print('R5 pre-implementation governance: PASS')
          PY
      - name: Commit governance to R5 and push
        run: |
          set -euo pipefail
          git config user.name "arendon7"
          git config user.email "102555888+arendon7@users.noreply.github.com"
          git add \
            knowledge/00_CANON/debt_register.json \
            knowledge/00_CANON/DEBT_REGISTER.md \
            knowledge/00_CANON/ESTADO_ACTUAL.md \
            knowledge/00_CANON/TAREA_ACTIVA.md \
            knowledge/00_CANON/CONTEXTO_RAPIDO.md \
            knowledge/40_HANDOFF/HANDOFF_ACTUAL.md \
            knowledge/60_EVIDENCE/R4_POST_MERGE_CERTIFICATION.json
          git commit -m "chore(r5): register streaming shadow reconstruction debt"
          git push origin HEAD:reconstruction/r5-stream-shadow
      - name: Open R5 draft PR only after post-merge certification and debt registration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXISTING="$(gh pr list --repo arendon7/AUTO-TRADE --head reconstruction/r5-stream-shadow --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$EXISTING" ]; then
            gh pr create \
              --repo arendon7/AUTO-TRADE \
              --base main \
              --head reconstruction/r5-stream-shadow \
              --draft \
              --title "R5 v0.28R: read-only stream, synchronized shadow and forward evidence" \
              --body "R5 starts only after R4 post-merge recertification. TD-R5-001..006 are registered P1 before implementation. Scope: closed-kline read-only streaming, continuity/idempotency and DEGRADED semantics, synchronized portfolio shadow, forward evidence separated from HOLDOUT, and a permanent no-execution authority boundary. No external PAPER/LIVE authority. LIVE remains blocked."
          else
            echo "R5 draft PR already exists: #$EXISTING"
          fi
