name: OSS-3D2E DEVELOPMENT Model Tournament

on:
  pull_request:
    branches:
      - research/oss3d2d-development-evaluation
    paths:
      - 'src/autotrade/research/oss3_development_model_tournament.py'
      - 'tests/test_research_oss3_development_model_tournament.py'
      - 'scripts/check_oss3d2e_development_model_tournament_boundary.py'
      - 'knowledge/20_RESEARCH/OSS3D2E_MODEL_TOURNAMENT.md'
      - '.github/workflows/oss3d2e-development-model-tournament.yml'
      - 'src/autotrade/research/oss3_development_evaluation.py'
      - 'src/autotrade/research/oss3_development_inference.py'
      - 'src/autotrade/research/tournament.py'
      - 'src/autotrade/research/trials.py'
      - 'src/autotrade/research/multiple_testing.py'

permissions:
  contents: read

jobs:
  oss3d2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install AUTO-TRADE core
        run: python -m pip install -e '.[dev]'
      - name: Compile D2E
        run: |
          python -m py_compile \
            src/autotrade/research/oss3_development_model_tournament.py \
            tests/test_research_oss3_development_model_tournament.py \
            scripts/check_oss3d2e_development_model_tournament_boundary.py
      - name: OSS-3D2E deterministic and adversarial tests
        run: python -m pytest -q tests/test_research_oss3_development_model_tournament.py
      - name: OSS-3D2E research-only boundary
        run: python scripts/check_oss3d2e_development_model_tournament_boundary.py
      - name: R3 ledger tournament and multiple-testing regression
        run: |
          python -m pytest -q \
            tests/test_r3_trial_ledger.py \
            tests/test_r3_strategy_tournament.py \
            tests/test_r3_multiple_testing.py
      - name: OSS-3D2D regression
        run: |
          python -m pytest -q tests/test_research_oss3_development_evaluation.py
          python scripts/check_oss3d2d_development_evaluation_boundary.py
      - name: OSS-3D2A regression
        run: |
          python -m pytest -q tests/test_research_oss3_development_inference.py
          python scripts/check_oss3d2a_development_inference_boundary.py
      - name: Research authority regression
        run: python scripts/check_research_authority.py
      - name: W83 canonical strategy runtime re-proof
        run: python scripts/check_w83_strategy_version_binding_boundary.py
      - name: OSS-2H one-shot FINAL_HOLDOUT regression
        run: |
          python -m pytest -q \
            tests/test_research_oss2_final_holdout_evaluation.py \
            tests/test_research_oss2_final_holdout_evaluation_adversarial.py \
            tests/test_research_oss2_final_holdout_evaluation_edges.py
          python scripts/check_oss2h_final_holdout_evaluation_boundary.py
