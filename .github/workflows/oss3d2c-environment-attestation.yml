name: OSS-3D2C Qlib Environment Attestation

on:
  pull_request:
    branches:
      - research/oss3d2b-isolated-qlib-runner
    paths:
      - 'labs/oss3_qlib/environment_attestation.py'
      - 'labs/oss3_qlib/tests/test_environment_attestation.py'
      - 'scripts/check_oss3d2c_environment_boundary.py'
      - 'knowledge/20_RESEARCH/OSS3D2C_ENVIRONMENT_ATTESTATION.md'
      - '.github/workflows/oss3d2c-environment-attestation.yml'
      - 'labs/oss3_qlib/model_contract.py'
      - 'labs/oss3_qlib/dataset_adapter.py'
      - 'labs/oss3_qlib/network_guard.py'
      - 'labs/oss3_qlib/runner.py'
      - 'labs/oss3_qlib/requirements.txt'
      - 'src/autotrade/research/oss3_development_inference.py'
      - 'src/autotrade/research/oss3_training_bundle.py'
      - 'src/autotrade/research/oss3_factor_matrix_artifact.py'
      - 'src/autotrade/research/oss3_supervised_label_artifact.py'
      - 'src/autotrade/research/oss3_qlib_artifact.py'

permissions:
  contents: read

jobs:
  oss3d2c:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install AUTO-TRADE core only
        run: python -m pip install -e '.[dev]'
      - name: Prove certified D2B semantic files are untouched
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --exit-code "$BASE_SHA" -- \
            labs/oss3_qlib/model_contract.py \
            labs/oss3_qlib/dataset_adapter.py \
            labs/oss3_qlib/network_guard.py \
            labs/oss3_qlib/runner.py \
            labs/oss3_qlib/requirements.txt
      - name: Compile D2C evidence and boundary
        run: |
          python -m py_compile \
            labs/oss3_qlib/environment_attestation.py \
            labs/oss3_qlib/tests/test_environment_attestation.py \
            scripts/check_oss3d2c_environment_boundary.py
      - name: Static D2C authority and privacy boundary before Qlib install
        run: python scripts/check_oss3d2c_environment_boundary.py
      - name: Install certified D2B Qlib runtime
        run: python -m pip install -r labs/oss3_qlib/requirements.txt
      - name: Verify exact primary Qlib runtime
        run: |
          python - <<'PY'
          from importlib.metadata import version
          assert version('pyqlib') == '0.9.7', version('pyqlib')
          print('OSS-3D2C primary runtime: pyqlib 0.9.7 PASS')
          PY
      - name: D2C environment attestation tests
        run: python -m pytest -q labs/oss3_qlib/tests/test_environment_attestation.py
      - name: Capture effective environment twice
        run: |
          mkdir -p .oss3d2c
          python -m labs.oss3_qlib.environment_attestation --output .oss3d2c/environment-a.json
          python -m labs.oss3_qlib.environment_attestation --output .oss3d2c/environment-b.json
          cmp .oss3d2c/environment-a.json .oss3d2c/environment-b.json
      - name: Verify and summarize captured environment
        run: |
          python - <<'PY'
          from labs.oss3_qlib.environment_attestation import QlibEnvironmentAttestation
          a = QlibEnvironmentAttestation.read('.oss3d2c/environment-a.json')
          b = QlibEnvironmentAttestation.read('.oss3d2c/environment-b.json')
          assert a.same_effective_environment(b)
          print('OSS-3D2C environment hash:', a.attestation_hash)
          print('OSS-3D2C distribution count:', a.installed_distribution_count)
          for name in a.required_runtime_distributions:
              print(f'OSS-3D2C required {name}={a.package_version(name)}')
          print('OSS-3D2C installed-but-runtime-forbidden:', ','.join(a.runtime_forbidden_installed) or 'NONE')
          PY
      - name: Re-prove D2C boundary after external runtime install
        run: python scripts/check_oss3d2c_environment_boundary.py
      - name: Real D2B Qlib runner regression
        run: |
          python -m pytest -q labs/oss3_qlib/tests/test_runner.py
          python scripts/check_oss3d2b_qlib_lab_boundary.py
      - name: OSS-3D2A regression
        run: |
          pytest -q tests/test_research_oss3_development_inference.py
          python scripts/check_oss3d2a_development_inference_boundary.py
      - name: OSS-3D1 regression
        run: |
          pytest -q \
            tests/test_research_oss3_training_bundle.py \
            tests/test_research_oss3_training_bundle_edges.py
          python scripts/check_oss3d1_training_bundle_boundary.py
      - name: OSS-3C regression
        run: |
          pytest -q tests/test_research_oss3_supervised_label_artifact.py
          python scripts/check_oss3c_supervised_label_boundary.py
      - name: OSS-3B regression
        run: |
          pytest -q tests/test_research_oss3_factor_matrix_artifact.py
          python scripts/check_oss3b_factor_matrix_boundary.py
      - name: OSS-3A regression
        run: |
          pytest -q tests/test_research_oss3_qlib_artifact.py
          python scripts/check_oss3a_qlib_artifact_boundary.py
      - name: Research authority regression
        run: python scripts/check_research_authority.py
      - name: W83 canonical strategy runtime re-proof
        run: python scripts/check_w83_strategy_version_binding_boundary.py
      - name: OSS-2H single-use holdout regression
        run: |
          pytest -q \
            tests/test_research_oss2_final_holdout_evaluation.py \
            tests/test_research_oss2_final_holdout_evaluation_adversarial.py \
            tests/test_research_oss2_final_holdout_evaluation_edges.py
          python scripts/check_oss2h_final_holdout_evaluation_boundary.py
      - name: Upload canonical environment evidence
        uses: actions/upload-artifact@v4
        with:
          name: oss3d2c-environment-attestation
          path: .oss3d2c/environment-a.json
          if-no-files-found: error
          retention-days: 30
