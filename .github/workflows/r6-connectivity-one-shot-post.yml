name: R6 Connectivity One-Shot POST Boundary

on:
  push:
    branches: ["reconstruction/**", "work/**", "feature/**"]
    paths:
      - "src/autotrade/connectivity_workspace_post.py"
      - "src/autotrade/connectivity_workspace_stage.py"
      - "scripts/check_r6_connectivity_workspace_post_boundary.py"
      - "scripts/check_r6_connectivity_workspace_stage_boundary.py"
      - "tests/test_r6_connectivity_workspace_post.py"
      - "tests/test_r6_connectivity_workspace_stage.py"
      - ".github/workflows/r6-connectivity-one-shot-post.yml"
  pull_request:
    paths:
      - "src/autotrade/connectivity_workspace_post.py"
      - "src/autotrade/connectivity_workspace_stage.py"
      - "scripts/check_r6_connectivity_workspace_post_boundary.py"
      - "scripts/check_r6_connectivity_workspace_stage_boundary.py"
      - "tests/test_r6_connectivity_workspace_post.py"
      - "tests/test_r6_connectivity_workspace_stage.py"
      - ".github/workflows/r6-connectivity-one-shot-post.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectivity-one-shot-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Same-process one-shot POST authority boundary
        run: python scripts/check_r6_connectivity_workspace_post_boundary.py
      - name: Pre-POST staging remains network-free
        run: python scripts/check_r6_connectivity_workspace_stage_boundary.py
      - name: Functional and adversarial one-shot/reconciliation tests
        run: pytest -q tests/test_r6_connectivity_workspace_post.py tests/test_r6_connectivity_workspace_stage.py
