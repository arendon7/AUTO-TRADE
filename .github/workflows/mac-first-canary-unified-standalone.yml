name: Mac First Canary Unified One-App Artifact

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up build Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Certify R7 operations and inherited R6 authority
        run: |
          python scripts/check_r6_first_canary_unified_dashboard.py
          python scripts/check_r6_first_canary_restart_safe_dashboard.py
          python scripts/check_r6_first_canary_real_paper_delegate.py
          python scripts/check_r6_first_canary_real_paper_dashboard.py
          python scripts/check_r6_first_canary_execution_gate.py
          python scripts/check_r6_live_deny_boundary.py
          python scripts/check_r7_paper_operations_read_model_boundary.py
          python scripts/check_r7_paper_operations_mac_boundary.py
          python -m pytest -q tests/test_mac_r7_paper_operations_dashboard.py
      - name: Build universal offline wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="$RUNNER_TEMP/autotrade-unified-assets"
          WHEELHOUSE="$ASSETS/wheels"
          mkdir -p "$WHEELHOUSE"
          python -m pip install --upgrade pip 'setuptools>=75' wheel
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir "$WHEELHOUSE"
          python -m pip download --dest "$WHEELHOUSE" --only-binary=:all: --platform macosx_11_0_arm64 --python-version 312 --implementation cp --abi cp312 'websockets==16.1.1' 'pytest>=8.3,<9' 'pytest-cov>=5,<7'
          python -m pip download --dest "$WHEELHOUSE" --only-binary=:all: --platform macosx_10_13_x86_64 --python-version 312 --implementation cp --abi cp312 'websockets==16.1.1' 'pytest>=8.3,<9' 'pytest-cov>=5,<7'
          (cd "$WHEELHOUSE" && find . -maxdepth 1 -type f -name '*.whl' -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS)
          test -s "$WHEELHOUSE/SHA256SUMS"
      - name: Download pinned dual-arch CPython
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_DIR="$RUNNER_TEMP/autotrade-unified-assets/runtime"
          mkdir -p "$RUNTIME_DIR"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 'https://github.com/astral-sh/python-build-standalone/releases/download/20260718/cpython-3.12.13%2B20260718-aarch64-apple-darwin-install_only.tar.gz' --output "$RUNTIME_DIR/cpython-3.12.13-20260718-arm64.tar.gz"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 'https://github.com/astral-sh/python-build-standalone/releases/download/20260718/cpython-3.12.13%2B20260718-x86_64-apple-darwin-install_only.tar.gz' --output "$RUNTIME_DIR/cpython-3.12.13-20260718-x86_64.tar.gz"
          echo '62aeee6161d57303a71a138b75fd5cc6fb8c89c4b1d9c7f0a052d89fa0b6652b  cpython-3.12.13-20260718-arm64.tar.gz' > "$RUNTIME_DIR/SHA256SUMS"
          echo '10b47148de86f9d87ba6e96a3db606ced90a206a3454d7d6d8fa68536a05d81f  cpython-3.12.13-20260718-x86_64.tar.gz' >> "$RUNTIME_DIR/SHA256SUMS"
          (cd "$RUNTIME_DIR" && shasum -a 256 -c SHA256SUMS)
      - name: Build R7 one-app operator package
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          ASSETS="$RUNNER_TEMP/autotrade-unified-assets"
          PKG="dist/AUTO-TRADE-R6-MAC-FIRST-CANARY-ONE-APP"
          ZIP="dist/AUTO-TRADE-R6-MAC-FIRST-CANARY-ONE-APP.zip"
          rm -rf dist
          mkdir -p "$PKG/vendor/runtime" "$PKG/vendor/wheels"
          rsync -a ./ "$PKG/" --exclude '.git' --exclude '.venv' --exclude '.runtime' --exclude '.env' --exclude 'dist' --exclude '.pytest_cache' --exclude '.coverage' --exclude 'coverage.json' --exclude '__pycache__' --exclude '*.pyc' --exclude '*.sqlite3' --exclude '*.sqlite3-*'

          # Preserve the inherited R6 entry authority while eliminating stale
          # USD2/USD5 operator metadata in the packaged historical base layer.
          python - "$PKG/scripts/mac_first_canary_unified_dashboard.py" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          source = source.replace('"target_notional_usd": "2"', '"target_notional_usd": "10.50"')
          source = source.replace('"hard_max_notional_usd": "5"', '"hard_max_notional_usd": "12"')
          source = source.replace(
              'PAPER ONLY · BTC/USD BUY LIMIT IOC · USD 1-5 · LIVE BLOCKED · RETRY POST FALSE',
              'PAPER ONLY · BTC/USD BUY LIMIT IOC · USD 10-12 · TARGET ~USD 10.50 · LIVE BLOCKED · RETRY POST FALSE',
          )
          if '"target_notional_usd": "2"' in source or '"hard_max_notional_usd": "5"' in source:
              raise SystemExit('stale first-canary operator metadata survived package normalization')
          path.write_text(source, encoding="utf-8")
          PY

          cp "$ASSETS/runtime/"*.tar.gz "$PKG/vendor/runtime/"
          cp "$ASSETS/runtime/SHA256SUMS" "$PKG/vendor/runtime/SHA256SUMS"
          cp "$ASSETS/wheels/"*.whl "$PKG/vendor/wheels/"
          cp "$ASSETS/wheels/SHA256SUMS" "$PKG/vendor/wheels/SHA256SUMS"

          cp "$PKG/ABRIR_AUTO_TRADE_CANARY.command" "$PKG/ABRIR_AUTO_TRADE.command"
          rm -f "$PKG/ABRIR_AUTO_TRADE_CANARY.command" "$PKG/ABRIR_PRIMER_CANARY_PREPARAR.command" "$PKG/ABRIR_PRIMER_CANARY_REAL_PAPER.command" "$PKG/ABRIR_PRIMER_CANARY_PAPER.command" "$PKG/AUTO_TRADE_MAC.command"
          rm -f "$PKG/LEEME_PRIMERO_MAC.md"
          chmod +x "$PKG/ABRIR_AUTO_TRADE.command" "$PKG/INSTALAR_AUTO_TRADE.command"
          chmod +x "$PKG/scripts/mac_bootstrap.sh" "$PKG/scripts/mac_rehearsal.sh" "$PKG/scripts/mac_start.sh"

          cat > "$PKG/MAC_STANDALONE_MANIFEST.txt" <<EOF
          AUTO-TRADE R7 PAPER OPERATIONS ONE-APP/STANDALONE
          manifest_version=3
          source_head=${SOURCE_SHA}
          python_version=3.12.13
          python_build_release=20260718
          supported_architectures=arm64,x86_64
          runtime_arm64_sha256=62aeee6161d57303a71a138b75fd5cc6fb8c89c4b1d9c7f0a052d89fa0b6652b
          runtime_x86_64_sha256=10b47148de86f9d87ba6e96a3db606ced90a206a3454d7d6d8fa68536a05d81f
          offline_wheelhouse=YES
          generic_control_center_write=DISABLED
          real_paper_surface=SEPARATE_EXACT_ONE_SHOT
          first_canary_unified_surface=ONE_APP
          r7_paper_operations_surface=GET_ONLY
          r7_entry_authority=R6_INHERITED_EXACT_ONE_SHOT
          r7_existing_exposure_interlock=FAIL_CLOSED
          r7_close_write=DISABLED
          operator_visible_launchers=ONE
          credentials_persisted=NO
          min_notional_usd=10
          target_notional_usd=10.50
          max_notional_usd=12
          retry_post=NO
          live_trading=BLOCKED
          EOF

          cat > "$PKG/MAC_BUILD_INFO.txt" <<EOF
          AUTO-TRADE R7 PAPER OPERATIONS ONE-APP PACKAGE
          source_head=${SOURCE_SHA}
          branch=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
          python_runtime=EMBEDDED_DUAL_ARCH_3.12.13
          offline_install=YES
          installed_home=HOME/Applications/AUTO-TRADE-R6
          user_flow=ONE_APP_OPERATIONS_CONNECT_BROKER_TRUTH_ENTRY_IF_FLAT_RECONCILE
          r7_surface=R7_PAPER_OPERATIONS_READ_ONLY
          operations_get_only=YES
          entry_authority=R6_INHERITED_EXACT_ONE_SHOT
          close_write=DISABLED
          operator_attempt_id_input=NO
          operator_challenge_copy=NO
          broker_credentials_in_package=NO
          broker_credentials_persisted=NO
          external_order_submitted_by_build=NO
          retry_post=NO
          live_trading=BLOCKED
          EOF

          cat > "$PKG/LEEME.txt" <<'EOF'
          AUTO-TRADE · R7 PAPER OPERATIONS · UNA SOLA APP

          1. Ejecuta INSTALAR_AUTO_TRADE.command una sola vez.
          2. Después abre únicamente ABRIR_AUTO_TRADE.command.
          3. Conecta PAPER para ver Portfolio/Safety con broker truth GET-only.
          4. Si existe posición, orden abierta o recovery pendiente, NO prepares ni ejecutes otro BUY.
          5. La entrada first-canary conserva la ruta R6 certificada: preparar -> revisar/aprobar -> ejecutar una sola vez -> reconciliar por GET.

          Entrada: BTC/USD BUY LIMIT IOC · objetivo ~USD 10.50 · rango USD 10-12.
          Cierre de posición WRITE: DISABLED en esta build.
          LIVE: BLOCKED · RETRY POST: FALSE · credenciales persistidas: NO.
          EOF

          ditto -c -k --sequesterRsrc --keepParent "$PKG" "$ZIP"
          (cd dist && shasum -a 256 AUTO-TRADE-R6-MAC-FIRST-CANARY-ONE-APP.zip > AUTO-TRADE-R6-MAC-FIRST-CANARY-ONE-APP.zip.sha256)
          test "$(stat -f%z "$ZIP")" -ge 40000000
      - name: Verify R7 one-app package boundary
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 -c AUTO-TRADE-R6-MAC-FIRST-CANARY-ONE-APP.zip.sha256
          ZIP=AUTO-TRADE-R6-MAC-FIRST-CANARY-ONE-APP.zip
          ROOT=AUTO-TRADE-R6-MAC-FIRST-CANARY-ONE-APP
          for item in \
            MAC_STANDALONE_MANIFEST.txt \
            MAC_BUILD_INFO.txt \
            LEEME.txt \
            ABRIR_AUTO_TRADE.command \
            INSTALAR_AUTO_TRADE.command \
            scripts/mac_first_canary_unified_dashboard.py \
            scripts/mac_first_canary_unified_auto_settle.py \
            scripts/mac_r7_paper_operations_dashboard.py \
            scripts/check_r7_paper_operations_mac_boundary.py \
            tests/test_mac_r7_paper_operations_dashboard.py \
            web/mac_first_canary_unified.html \
            web/mac_r7_paper_operations.html \
            scripts/mac_crypto_first_canary_execute_real_paper.py; do
            unzip -l "$ZIP" | grep -Fq "$ROOT/$item"
          done
          for forbidden in ABRIR_PRIMER_CANARY_PREPARAR.command ABRIR_PRIMER_CANARY_REAL_PAPER.command ABRIR_PRIMER_CANARY_PAPER.command ABRIR_AUTO_TRADE_CANARY.command; do
            if unzip -l "$ZIP" | grep -Fq "$ROOT/$forbidden"; then echo "ERROR: legacy operator launcher leaked: $forbidden" >&2; exit 1; fi
          done
          unzip -p "$ZIP" "$ROOT/MAC_STANDALONE_MANIFEST.txt" | grep -Fq 'manifest_version=3'
          unzip -p "$ZIP" "$ROOT/MAC_STANDALONE_MANIFEST.txt" | grep -Fq 'first_canary_unified_surface=ONE_APP'
          unzip -p "$ZIP" "$ROOT/MAC_STANDALONE_MANIFEST.txt" | grep -Fq 'r7_paper_operations_surface=GET_ONLY'
          unzip -p "$ZIP" "$ROOT/MAC_STANDALONE_MANIFEST.txt" | grep -Fq 'r7_entry_authority=R6_INHERITED_EXACT_ONE_SHOT'
          unzip -p "$ZIP" "$ROOT/MAC_STANDALONE_MANIFEST.txt" | grep -Fq 'r7_existing_exposure_interlock=FAIL_CLOSED'
          unzip -p "$ZIP" "$ROOT/MAC_STANDALONE_MANIFEST.txt" | grep -Fq 'r7_close_write=DISABLED'
          unzip -p "$ZIP" "$ROOT/MAC_STANDALONE_MANIFEST.txt" | grep -Fq 'target_notional_usd=10.50'
          unzip -p "$ZIP" "$ROOT/MAC_STANDALONE_MANIFEST.txt" | grep -Fq 'max_notional_usd=12'
          unzip -p "$ZIP" "$ROOT/MAC_BUILD_INFO.txt" | grep -Fq 'r7_surface=R7_PAPER_OPERATIONS_READ_ONLY'
          unzip -p "$ZIP" "$ROOT/MAC_BUILD_INFO.txt" | grep -Fq 'operations_get_only=YES'
          unzip -p "$ZIP" "$ROOT/MAC_BUILD_INFO.txt" | grep -Fq 'close_write=DISABLED'
          unzip -p "$ZIP" "$ROOT/MAC_BUILD_INFO.txt" | grep -Fq 'operator_attempt_id_input=NO'
          unzip -p "$ZIP" "$ROOT/MAC_BUILD_INFO.txt" | grep -Fq 'operator_challenge_copy=NO'
          unzip -p "$ZIP" "$ROOT/LEEME.txt" | grep -Fq 'objetivo ~USD 10.50'
          unzip -p "$ZIP" "$ROOT/LEEME.txt" | grep -Fq 'Cierre de posición WRITE: DISABLED'
          unzip -p "$ZIP" "$ROOT/ABRIR_AUTO_TRADE.command" | grep -Fq 'mac_r7_paper_operations_dashboard.py'
          unzip -p "$ZIP" "$ROOT/ABRIR_AUTO_TRADE.command" | grep -Fq 'USD 10-12 · TARGET ~USD 10.50'
          unzip -p "$ZIP" "$ROOT/scripts/mac_first_canary_unified_dashboard.py" | grep -Fq '"target_notional_usd": "10.50"'
          unzip -p "$ZIP" "$ROOT/scripts/mac_first_canary_unified_dashboard.py" | grep -Fq '"hard_max_notional_usd": "12"'
          if unzip -p "$ZIP" "$ROOT/ABRIR_AUTO_TRADE.command" | grep -Fq 'máximo USD 5'; then echo 'ERROR: stale USD5 launcher metadata leaked' >&2; exit 1; fi
          if unzip -p "$ZIP" "$ROOT/scripts/mac_first_canary_unified_dashboard.py" | grep -Fq '"target_notional_usd": "2"'; then echo 'ERROR: stale USD2 operator metadata leaked' >&2; exit 1; fi
          if unzip -p "$ZIP" "$ROOT/scripts/mac_first_canary_unified_dashboard.py" | grep -Fq '"hard_max_notional_usd": "5"'; then echo 'ERROR: stale USD5 operator metadata leaked' >&2; exit 1; fi
          if unzip -l "$ZIP" | grep -Fq "$ROOT/LEEME_PRIMERO_MAC.md"; then echo 'ERROR: legacy generic runbook leaked into one-app package' >&2; exit 1; fi
          if unzip -l "$ZIP" | grep -Eq '(^|/)(\.env|\.venv|\.runtime)(/|$)'; then echo 'ERROR: package contains transient environment material' >&2; exit 1; fi
      - name: Upload one-app candidate
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-TRADE-R6-MAC-FIRST-CANARY-ONE-APP-CANDIDATE
          path: |
            dist/AUTO-TRADE-R6-MAC-FIRST-CANARY-ONE-APP.zip
            dist/AUTO-TRADE-R6-MAC-FIRST-CANARY-ONE-APP.zip.sha256
          if-no-files-found: error
          retention-days: 3

  boot:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      PIP_NO_INDEX: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONUNBUFFERED: '1'
      R6_EXTERNAL_PAPER_WRITE: DISABLED
    steps:
      - name: Download exact one-app candidate
        uses: actions/download-artifact@v5
        with:
          name: AUTO-TRADE-R6-MAC-FIRST-CANARY-ONE-APP-CANDIDATE
          path: candidate
      - name: Quarantine and extract
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          shasum -a 256 -c AUTO-TRADE-R6-MAC-FIRST-CANARY-ONE-APP.zip.sha256
          test "$(uname -m)" = '${{ matrix.arch }}'
          QTN_VALUE="0083;$(printf '%x' "$(date +%s)");Safari;AUTO-TRADE-R6-MAC-FIRST-CANARY-ONE-APP.zip"
          xattr -w com.apple.quarantine "$QTN_VALUE" AUTO-TRADE-R6-MAC-FIRST-CANARY-ONE-APP.zip
          ditto -x -k AUTO-TRADE-R6-MAC-FIRST-CANARY-ONE-APP.zip .
          SOURCE="$PWD/AUTO-TRADE-R6-MAC-FIRST-CANARY-ONE-APP"
          test -x "$SOURCE/ABRIR_AUTO_TRADE.command"
          test -x "$SOURCE/INSTALAR_AUTO_TRADE.command"
          test -f "$SOURCE/scripts/mac_r7_paper_operations_dashboard.py"
          test -f "$SOURCE/web/mac_r7_paper_operations.html"
          test ! -e "$SOURCE/ABRIR_PRIMER_CANARY_PREPARAR.command"
          test ! -e "$SOURCE/ABRIR_PRIMER_CANARY_REAL_PAPER.command"
      - name: Offline install with no broker credentials
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$PWD/candidate/AUTO-TRADE-R6-MAC-FIRST-CANARY-ONE-APP"
          INSTALL_ROOT="$HOME/Applications/AUTO-TRADE-R6"
          rm -rf "$INSTALL_ROOT"
          unset APCA_API_KEY_ID APCA_API_SECRET_KEY || true
          export PIP_INDEX_URL='http://127.0.0.1:9/forbidden'
          export PIP_EXTRA_INDEX_URL='http://127.0.0.1:9/forbidden'
          cd "$SOURCE"
          bash INSTALAR_AUTO_TRADE.command | tee /tmp/autotrade-r7-install.log
          grep -Fq 'AUTO-TRADE R7 OPERATIONS INSTALL: OK' /tmp/autotrade-r7-install.log
          test -x "$INSTALL_ROOT/.runtime/${{ matrix.arch }}/python/bin/python3"
          test -x "$INSTALL_ROOT/.venv/bin/python"
          test -x "$INSTALL_ROOT/ABRIR_AUTO_TRADE.command"
          test -f "$INSTALL_ROOT/scripts/mac_r7_paper_operations_dashboard.py"
          test -f "$INSTALL_ROOT/web/mac_r7_paper_operations.html"
          test ! -e "$INSTALL_ROOT/ABRIR_PRIMER_CANARY_PREPARAR.command"
          test ! -e "$INSTALL_ROOT/ABRIR_PRIMER_CANARY_REAL_PAPER.command"
          cd "$INSTALL_ROOT"
          .venv/bin/python scripts/check_r6_first_canary_unified_dashboard.py
          .venv/bin/python scripts/check_r6_live_deny_boundary.py
          .venv/bin/python scripts/check_r6_authority.py
          .venv/bin/python scripts/check_r7_paper_operations_mac_boundary.py
          .venv/bin/pytest -q tests/test_r6_first_canary_unified_dashboard.py tests/test_mac_r7_paper_operations_dashboard.py
      - name: R7 localhost fail-closed smoke with no credentials and no execute call
        shell: bash
        run: |
          set -euo pipefail
          INSTALL_ROOT="$HOME/Applications/AUTO-TRADE-R6"
          cd "$INSTALL_ROOT"
          unset APCA_API_KEY_ID APCA_API_SECRET_KEY || true
          .venv/bin/python scripts/mac_r7_paper_operations_dashboard.py --no-browser --port 8879 > /tmp/autotrade-r7-server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do curl --fail --silent http://127.0.0.1:8879/api/meta > /tmp/r7-meta.json && break; sleep 0.25; done
          python - <<'PY'
          import json
          p=json.load(open('/tmp/r7-meta.json'))
          assert p['surface']=='R7_PAPER_OPERATIONS_READ_ONLY'
          assert p['broker_write_authorized'] is False
          assert p['retry_post'] is False
          assert p['credentials_persisted'] is False
          assert p['live_trading']=='BLOCKED'
          policy=p['first_canary_policy']
          assert policy['environment']=='PAPER'
          assert policy['symbol']=='BTC/USD'
          assert policy['min_notional_usd']=='10'
          assert policy['target_notional_usd']=='10.50'
          assert policy['hard_max_notional_usd']=='12'
          assert policy['operations_get_only'] is True
          assert policy['close_execution_authorized'] is False
          assert policy['retry_post'] is False
          assert policy['credentials_persisted'] is False
          assert policy['live_trading']=='BLOCKED'
          PY
          STATUS="$(curl --silent --show-error --output /tmp/r7-operations.json --write-out '%{http_code}' http://127.0.0.1:8879/api/operations)"
          test "$STATUS" = '409'
          python - <<'PY'
          import json
          p=json.load(open('/tmp/r7-operations.json'))
          assert p['ok'] is False
          assert p['surface']=='R7_PAPER_OPERATIONS_READ_ONLY'
          assert p['entry_preparation_allowed'] is False
          assert p['ready_for_close_preparation'] is False
          assert p['close_execution_authorized'] is False
          assert p['broker_write_authorized'] is False
          assert p['retry_post'] is False
          assert p['credentials_persisted'] is False
          assert p['live_trading']=='BLOCKED'
          PY
          curl --fail --silent http://127.0.0.1:8879/ | grep -Fq 'R7 OPERATIONS'
          kill "$PID"
          wait "$PID" || true
          trap - EXIT
      - name: Offline reinstall self-heal
        shell: bash
        run: |
          set -euo pipefail
          INSTALL_ROOT="$HOME/Applications/AUTO-TRADE-R6"
          rm -rf "$INSTALL_ROOT/.venv"
          cd "$INSTALL_ROOT"
          bash INSTALAR_AUTO_TRADE.command > /tmp/autotrade-r7-reinstall.log
          test -x "$INSTALL_ROOT/.venv/bin/python"
          grep -Fq 'AUTO-TRADE R7 OPERATIONS INSTALL: OK' /tmp/autotrade-r7-reinstall.log

  publish:
    needs: [build, boot]
    runs-on: ubuntu-latest
    steps:
      - name: Download certified candidate
        uses: actions/download-artifact@v5
        with:
          name: AUTO-TRADE-R6-MAC-FIRST-CANARY-ONE-APP-CANDIDATE
          path: certified
      - name: Verify checksum
        run: cd certified && sha256sum -c AUTO-TRADE-R6-MAC-FIRST-CANARY-ONE-APP.zip.sha256
      - name: Publish certified one-app artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-TRADE-R6-MAC-FIRST-CANARY-ONE-APP
          path: |
            certified/AUTO-TRADE-R6-MAC-FIRST-CANARY-ONE-APP.zip
            certified/AUTO-TRADE-R6-MAC-FIRST-CANARY-ONE-APP.zip.sha256
          if-no-files-found: error
          retention-days: 14