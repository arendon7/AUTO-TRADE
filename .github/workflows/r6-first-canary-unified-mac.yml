name: R6 First Canary Unified Mac Flow

on:
  pull_request:
    paths:
      - 'ABRIR_AUTO_TRADE_CANARY.command'
      - 'scripts/mac_first_canary_unified_dashboard.py'
      - 'scripts/mac_first_canary_unified_queue.py'
      - 'scripts/mac_first_canary_unified_auto_settle.py'
      - 'scripts/check_r6_first_canary_unified_dashboard.py'
      - 'scripts/mac_crypto_first_canary_reconcile.py'
      - 'src/autotrade/first_canary_recovery_transport.py'
      - 'web/mac_first_canary_unified.html'
      - 'tests/test_r6_first_canary_unified_dashboard.py'
      - 'tests/test_r6_first_canary_unified_recovery.py'
      - 'tests/test_r6_first_canary_auto_settlement.py'
      - 'tests/test_first_canary_recovery_transport.py'
      - '.github/workflows/r6-first-canary-unified-mac.yml'
  workflow_dispatch:

jobs:
  unified-flow:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Compile unified operator surface
        run: python -m compileall -q src tests scripts
      - name: Unified one-window authority boundary
        run: python scripts/check_r6_first_canary_unified_dashboard.py
      - name: Unified flow adversarial tests
        run: pytest -q tests/test_r6_first_canary_unified_dashboard.py tests/test_r6_first_canary_unified_recovery.py tests/test_r6_first_canary_auto_settlement.py tests/test_first_canary_recovery_transport.py
      - name: Re-prove restart-safe preparation
        run: python scripts/check_r6_first_canary_restart_safe_dashboard.py
      - name: Re-prove real PAPER delegate
        run: python scripts/check_r6_first_canary_real_paper_delegate.py
      - name: Re-prove real PAPER dashboard
        run: python scripts/check_r6_first_canary_real_paper_dashboard.py
      - name: Re-prove execution/recovery gate
        run: python scripts/check_r6_first_canary_execution_gate.py
      - name: Re-prove permanent LIVE deny
        run: python scripts/check_r6_live_deny_boundary.py
      - name: Re-prove global R6 PAPER authority
        run: python scripts/check_r6_authority.py
