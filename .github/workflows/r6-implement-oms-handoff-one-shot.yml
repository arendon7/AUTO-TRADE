name: R6 Implement OMS External Handoff One Shot

on:
  push:
    branches: ["reconstruction/r6-external-paper-protection"]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply OMS external-handoff implementation
        run: |
          python scripts/r6_fix_refinement_helper.py
          python scripts/r6_implement_oms_handoff.py
          python scripts/r6_refine_oms_handoff_control_plane.py
          python scripts/r6_harden_oms_handoff_stage_race.py
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused TD-R6-010 certification
        run: |
          python -m compileall -q src tests scripts
          pytest -q tests/test_r6_oms_external_handoff.py tests/test_r6_paper_writer.py tests/test_r6_oms_handoff_boundary.py
          python scripts/check_r6_oms_handoff_boundary.py
          python scripts/check_r6_authority.py
          python scripts/check_r6_live_deny_boundary.py
          python scripts/check_r6_product_boundary.py
      - name: Full branch certification
        run: |
          pytest --cov=autotrade --cov-report=term-missing
          python scripts/check_contract_registry.py
          python scripts/check_research_authority.py
          python scripts/check_r5_authority.py
          python scripts/check_r6_authority.py
          python scripts/check_r6_live_deny_boundary.py
          python scripts/check_r6_oms_handoff_boundary.py
          python scripts/check_r6_product_boundary.py
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Commit only after all gates pass
        run: |
          git config user.name arendon7
          git config user.email 102555888+arendon7@users.noreply.github.com
          git rm .github/workflows/r6-implement-oms-handoff-one-shot.yml scripts/r6_implement_oms_handoff.py scripts/r6_refine_oms_handoff_control_plane.py scripts/r6_fix_refinement_helper.py scripts/r6_harden_oms_handoff_stage_race.py
          git add src/autotrade/oms.py src/autotrade/brokers/alpaca_paper_writer.py tests/test_r6_paper_writer.py .github/workflows/core-tests.yml .github/workflows/r6-authority.yml
          git commit -m "feat(r6): add OMS-owned external PAPER handoff"
          git push origin HEAD:reconstruction/r6-external-paper-protection
