name: R4 Health Bridge Integration

on:
  push:
    branches:
      - reconstruction/r4-portfolio-health
    paths:
      - .github/workflows/r4-health-bridge-integration-one-shot.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r4-portfolio-health
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Patch integration
        run: python scripts/r4_integrate_health_bridge.py
      - name: Targeted integration tests
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q src tests scripts
          pytest -q tests/test_r4_health_bridge.py tests/test_r4_health_bridge_integration.py
      - name: Commit integration
        run: |
          git config user.name "arendon7"
          git config user.email "102555888+arendon7@users.noreply.github.com"
          git add src/autotrade/health_bridge.py src/autotrade/safety.py src/autotrade/oms.py src/autotrade/bootstrap.py
          git commit -m "feat(r4): integrate reduce-only health bridge with Safety and OMS"
          git push origin HEAD:reconstruction/r4-portfolio-health
