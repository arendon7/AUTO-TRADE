name: R6 Single-Shot PAPER Writer Milestone

on:
  push:
    branches:
      - reconstruction/r6-external-paper-protection
    paths:
      - .github/workflows/r6-writer-milestone-cert-one-shot.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reconcile any interrupted comment-only patch
        run: |
          if test -f scripts/r6_patch_writer_crash_comment.py; then
            python scripts/r6_patch_writer_crash_comment.py
          fi
      - name: Install exact runtime
        run: python -m pip install -e '.[dev]'
      - name: Full regression and branch coverage
        run: |
          python -m compileall -q src tests scripts
          pytest --cov=autotrade --cov-report=term-missing --cov-report=json:r6-writer-coverage.json --junitxml=r6-writer.xml
      - name: Permanent authority and canon gates
        run: |
          python scripts/check_contract_registry.py
          python scripts/check_research_authority.py
          python scripts/check_r5_authority.py
          python scripts/check_r6_authority.py
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Prove writer source has no real-network opt-in artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('src/autotrade/brokers/alpaca_paper_writer.py').read_text()
          assert 'enabled: bool = False' in src
          assert 'reconcile_acknowledged' not in src
          assert src.count('self._transport.write(request)') == 1
          assert 'paper-api.alpaca.markets' not in src  # host comes only from imported canonical constant
          assert 'api.alpaca.markets' not in src
          PY
      - name: Write permanent writer milestone evidence
        env:
          OUT: knowledge/60_EVIDENCE/R6_SINGLE_SHOT_WRITER_MILESTONE.json
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          coverage = json.loads(Path('r6-writer-coverage.json').read_text())
          root = ET.parse('r6-writer.xml').getroot()
          tests = int(root.attrib.get('tests', '0'))
          failures = int(root.attrib.get('failures', '0'))
          errors = int(root.attrib.get('errors', '0'))
          skipped = int(root.attrib.get('skipped', '0'))
          percent = float(coverage['totals']['percent_covered'])
          if failures or errors or percent < 85.0:
              raise SystemExit('cannot certify failing/undercovered writer milestone')

          payload = {
              'schema_version': 1,
              'track': 'R6',
              'control': 'single-shot disabled-by-default external PAPER writer',
              'status': 'PASS_MILESTONE_NOT_REAL_PAPER_QUALIFICATION',
              'source_head': os.environ['GITHUB_SHA'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'tests': {
                  'total': tests,
                  'failures': failures,
                  'errors': errors,
                  'skipped': skipped,
                  'coverage_percent': round(percent, 2),
                  'coverage_gate_percent': 85.0,
              },
              'certified_invariants': [
                  'writer is disabled by default and restricted to exact PAPER /v2/orders authority',
                  'LIVE/arbitrary origins, redirects and environment proxies cannot widen writer authority',
                  'short-lived canary permit must be ISSUED and exactly bound to the frozen submission',
                  'permit is consumed before submission state is durably advanced to UNKNOWN',
                  'UNKNOWN is verified before exactly one low-level transport write can occur',
                  'writer contains no retry loop, cancel, replace or self-acknowledgement path',
                  'a valid 2xx is provisional only; durable state stays UNKNOWN pending GET-only reconciliation',
                  'transport ambiguity, malformed/mismatched response or missing X-Request-ID leaves UNKNOWN and cannot re-arm POST',
                  'a second writer call after UNKNOWN performs no second POST',
                  'crash after permit consumption but before UNKNOWN is conservatively non-resumable by the automatic writer',
                  'permanent R6 authority checker allows POST construction only inside this one audited writer module',
              ],
              'explicit_non_claims': [
                  'no real PAPER order was submitted by this certification workflow',
                  'PAPER trade_updates protection is not yet certified',
                  'terminality/fill/slippage/reconciliation qualification is not yet certified',
                  'TD-R6-001 through TD-R6-008 remain OPEN',
                  'this is not profitability evidence',
                  'LIVE trading remains blocked',
              ],
              'real_external_paper_activity': 'NONE',
              'capital_authority': 'NONE',
              'live_trading': 'BLOCKED',
          }
          Path(os.environ['OUT']).write_text(json.dumps(payload, indent=2) + '\n')
          PY
      - name: Commit evidence and self-clean
        run: |
          rm -f r6-writer-coverage.json r6-writer.xml
          git config user.name "arendon7"
          git config user.email "102555888+arendon7@users.noreply.github.com"
          git add src/autotrade/brokers/alpaca_paper_writer.py \
                  knowledge/60_EVIDENCE/R6_SINGLE_SHOT_WRITER_MILESTONE.json
          if test -f scripts/r6_patch_writer_crash_comment.py; then
            git rm -f scripts/r6_patch_writer_crash_comment.py
          fi
          if test -f .github/workflows/r6-writer-guard-one-shot.yml; then
            git rm -f .github/workflows/r6-writer-guard-one-shot.yml
          fi
          git rm -f .github/workflows/r6-writer-milestone-cert-one-shot.yml
          git commit -m "docs(r6): certify single-shot PAPER writer milestone"
          git push origin HEAD:reconstruction/r6-external-paper-protection
