name: R6 Final Write Guard Integration

on:
  push:
    branches:
      - reconstruction/r6-external-paper-protection
    paths:
      - .github/workflows/r6-final-write-guard-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Integrate registry snapshot, writer rechecks and authority assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Durable submission registry: expose one atomic, tamper-verified global snapshot.
          path = Path('src/autotrade/brokers/alpaca_paper_submission.py')
          text = path.read_text(encoding='utf-8')
          marker = '''class SQLitePaperSubmissionRegistry:\n'''
          dataclass_block = '''@dataclass(frozen=True, slots=True)\nclass PaperSubmissionRegistrySnapshot:\n    binding: PaperSubmissionBinding\n    state: PaperSubmissionState\n    events: tuple[PaperSubmissionEvent, ...]\n    all_states: tuple[PaperSubmissionState, ...]\n\n\n'''
          if 'class PaperSubmissionRegistrySnapshot:' not in text:
              if marker not in text:
                  raise SystemExit('submission registry class marker missing')
              text = text.replace(marker, dataclass_block + marker, 1)

          method_anchor = '''    def mark_submit_attempt_unknown(\n'''
          method = '''    def verified_global_snapshot(\n        self, order_id: str\n    ) -> PaperSubmissionRegistrySnapshot:\n        _validate_id(order_id, "order_id")\n        conn = self._runtime.connect()\n        try:\n            conn.execute("BEGIN")\n            binding, state, events = self._verify_locked(conn, order_id)\n            rows = conn.execute(\n                "SELECT order_id FROM alpaca_paper_submission_bindings ORDER BY order_id"\n            ).fetchall()\n            states: list[PaperSubmissionState] = []\n            for row in rows:\n                current_order_id = str(row["order_id"])\n                if current_order_id == order_id:\n                    states.append(state)\n                else:\n                    _, other_state, _ = self._verify_locked(conn, current_order_id)\n                    states.append(other_state)\n            conn.execute("COMMIT")\n            return PaperSubmissionRegistrySnapshot(\n                binding=binding,\n                state=state,\n                events=events,\n                all_states=tuple(states),\n            )\n        except Exception:\n            if conn.in_transaction:\n                conn.execute("ROLLBACK")\n            raise\n        finally:\n            conn.close()\n\n'''
          if '    def verified_global_snapshot(' not in text:
              if method_anchor not in text:
                  raise SystemExit('submission method anchor missing')
              text = text.replace(method_anchor, method + method_anchor, 1)
          path.write_text(text, encoding='utf-8')

          # 2) Writer: require actual final guard and call it before permit consumption and before I/O.
          path = Path('src/autotrade/brokers/alpaca_paper_writer.py')
          text = path.read_text(encoding='utf-8')
          old = 'from .alpaca_paper_canary import PaperCanaryApproval\n'
          new = '''from .alpaca_paper_canary import PaperCanaryApproval\nfrom .alpaca_paper_final_guard import (\n    PaperFinalWriteBlocked,\n    PaperFinalWriteGuard,\n    PaperFinalWritePhase,\n)\n'''
          if old not in text:
              raise SystemExit('writer canary import marker missing')
          text = text.replace(old, new, 1)

          old = '''    reconciliation_required: bool\n'''
          new = '''    reconciliation_required: bool\n    pre_consume_guard_hash: str\n    pre_io_guard_hash: str\n'''
          if old not in text:
              raise SystemExit('writer result field marker missing')
          text = text.replace(old, new, 1)

          old = '''        submission_registry: SQLitePaperSubmissionRegistry,\n        attempt_id: str,\n'''
          new = '''        submission_registry: SQLitePaperSubmissionRegistry,\n        final_guard: PaperFinalWriteGuard,\n        attempt_id: str,\n'''
          if old not in text:
              raise SystemExit('writer signature marker missing')
          text = text.replace(old, new, 1)

          old = '''        if not self._config.enabled:\n            raise PaperWriterDisabled("external PAPER writer is disabled by default")\n'''
          new = '''        if not self._config.enabled:\n            raise PaperWriterDisabled("external PAPER writer is disabled by default")\n        if not isinstance(final_guard, PaperFinalWriteGuard):\n            raise PaperWriterBlocked("writer requires authoritative PaperFinalWriteGuard")\n'''
          if old not in text:
              raise SystemExit('writer enabled marker missing')
          text = text.replace(old, new, 1)

          old = '''        # Crash-safety order is deliberate:\n        # 1) consume permit; a crash now leaves PREPARED + consumed permit, so only\n'''
          new = '''        try:\n            pre_consume_guard = final_guard.authorize(\n                approval=approval,\n                expected_bracket=expected_bracket,\n                submission_registry=submission_registry,\n                now=now,\n                phase=PaperFinalWritePhase.PRE_CONSUME,\n            )\n        except PaperFinalWriteBlocked as exc:\n            raise PaperWriterBlocked(f"final PRE_CONSUME guard rejected: {exc}") from exc\n\n        # Crash-safety order is deliberate:\n        # 1) consume permit; a crash now leaves PREPARED + consumed permit, so only\n'''
          if old not in text:
              raise SystemExit('writer crash-safety marker missing')
          text = text.replace(old, new, 1)

          old = '''        if unknown.status is not PaperSubmissionStatus.UNKNOWN:\n            raise PaperWriterBlocked("submission failed to persist UNKNOWN before PAPER POST")\n\n        request = AlpacaPaperWriteRequest(\n'''
          new = '''        if unknown.status is not PaperSubmissionStatus.UNKNOWN:\n            raise PaperWriterBlocked("submission failed to persist UNKNOWN before PAPER POST")\n\n        try:\n            pre_io_guard = final_guard.authorize(\n                approval=approval,\n                expected_bracket=expected_bracket,\n                submission_registry=submission_registry,\n                now=now,\n                phase=PaperFinalWritePhase.PRE_IO,\n                expected_attempt_id=attempt_id,\n            )\n        except PaperFinalWriteBlocked as exc:\n            # UNKNOWN is intentionally retained. No POST occurred; only reconciliation\n            # may resolve whether any external order exists.\n            raise PaperWriterBlocked(f"final PRE_IO guard rejected: {exc}") from exc\n\n        request = AlpacaPaperWriteRequest(\n'''
          if old not in text:
              raise SystemExit('writer UNKNOWN marker missing')
          text = text.replace(old, new, 1)

          old = '''            durable_status=PaperSubmissionStatus.UNKNOWN,\n            reconciliation_required=True,\n        )\n'''
          new = '''            durable_status=PaperSubmissionStatus.UNKNOWN,\n            reconciliation_required=True,\n            pre_consume_guard_hash=pre_consume_guard.attestation_hash,\n            pre_io_guard_hash=pre_io_guard.attestation_hash,\n        )\n'''
          if old not in text:
              raise SystemExit('writer result construction marker missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # 3) Permanent authority checker: prove recheck ordering around UNKNOWN and the single POST.
          path = Path('scripts/check_r6_authority.py')
          text = path.read_text(encoding='utf-8')
          marker = '''        if "PAPER_ORDER_PATH = \\"/v2/orders\\"" not in text:\n            errors.append("writer: exact /v2/orders path constant is missing")\n'''
          addition = marker + '''        pre_consume = text.find("PaperFinalWritePhase.PRE_CONSUME")\n        durable_unknown = text.find("mark_submit_attempt_unknown")\n        pre_io = text.find("PaperFinalWritePhase.PRE_IO")\n        transport_write = text.find("self._transport.write(request)")\n        if not 0 <= pre_consume < durable_unknown < pre_io < transport_write:\n            errors.append(\n                "writer: final guard ordering must be PRE_CONSUME -> durable UNKNOWN -> PRE_IO -> one transport write"\n            )\n        if "final_guard: PaperFinalWriteGuard" not in text:\n            errors.append("writer: authoritative PaperFinalWriteGuard parameter is required")\n'''
          if marker not in text:
              raise SystemExit('authority writer marker missing')
          text = text.replace(marker, addition, 1)
          path.write_text(text, encoding='utf-8')

          # 4) Writer tests: build real authoritative stores and pass real guard internally.
          path = Path('tests/test_r6_paper_writer.py')
          text = path.read_text(encoding='utf-8')
          old = '''from autotrade.brokers.alpaca_paper_gateway import (\n    AlpacaPaperAccountAttestation,\n    AlpacaPaperCredentials,\n)\n'''
          new = old + '''from autotrade.brokers.alpaca_paper_final_guard import PaperFinalWriteGuard\nfrom autotrade.health_bridge import EffectiveHealthControl, HealthRiskMode\n'''
          if old not in text:
              raise SystemExit('writer test gateway import marker missing')
          text = text.replace(old, new, 1)
          old = '''from autotrade.domain import OrderIntent, OrderRecord, OrderStatus, OrderType, Side\nfrom autotrade.persistence import SQLiteRuntime\n'''
          new = '''from autotrade.domain import (\n    OrderIntent,\n    OrderRecord,\n    OrderStatus,\n    OrderType,\n    PortfolioSnapshot,\n    Side,\n)\nfrom autotrade.persistence import SQLiteRuntime\nfrom autotrade.state import (\n    InMemoryOrderStore,\n    InMemoryPortfolioStore,\n    InMemorySafetyStateStore,\n    SafetyControlState,\n)\n'''
          if old not in text:
              raise SystemExit('writer test domain import marker missing')
          text = text.replace(old, new, 1)

          anchor = '''def stack(tmp_path):\n'''
          helper = '''class HealthyBridge:\n    def effective_control(self, *, strategy_id, portfolio_entity_id, now):\n        del strategy_id, portfolio_entity_id, now\n        return EffectiveHealthControl(\n            mode=HealthRiskMode.NORMAL,\n            order_multiplier=Decimal("1"),\n            strategy_multiplier=Decimal("1"),\n            portfolio_multiplier=Decimal("1"),\n            reason="R6_PAPER_CANARY",\n            strategy_state_fingerprint=h("writer-strategy-health"),\n            portfolio_state_fingerprint=h("writer-portfolio-health"),\n        )\n\n\nclass FlipToKillSwitchStore:\n    def __init__(self):\n        self.calls = 0\n\n    def get(self):\n        self.calls += 1\n        if self.calls == 1:\n            return SafetyControlState(version=1, updated_at=NOW)\n        return SafetyControlState(\n            kill_switch_active=True,\n            kill_switch_reason="test-final-recheck",\n            version=2,\n            updated_at=NOW + timedelta(seconds=1),\n        )\n\n\n'''
          if anchor not in text:
              raise SystemExit('writer test stack marker missing')
          text = text.replace(anchor, helper + 'def stack(tmp_path, *, safety_store=None):\n', 1)

          old = '''    permit_registry.issue(approval)\n    return {\n'''
          new = '''    permit_registry.issue(approval)\n\n    order_store = InMemoryOrderStore()\n    order_store.create_if_absent(current_order)\n    order_store.update(\n        replace(\n            current_order,\n            status=OrderStatus.SUBMITTING,\n            submitted_at=NOW + timedelta(milliseconds=100),\n        )\n    )\n    safety_store = safety_store or InMemorySafetyStateStore()\n    portfolio_store = InMemoryPortfolioStore()\n    portfolio_store.initialize(\n        PortfolioSnapshot(\n            snapshot_id="writer-portfolio-snapshot-001",\n            equity=Decimal("100000"),\n            gross_exposure=Decimal("0"),\n            net_exposure=Decimal("0"),\n            daily_pnl=Decimal("0"),\n            drawdown=Decimal("0"),\n            open_orders=0,\n            signed_position_notional_by_symbol={},\n            strategy_gross_exposure={},\n            strategy_signed_position_notional_by_symbol={},\n            reconciliation_ok=True,\n            broker_state_known=True,\n        ),\n        now=NOW,\n    )\n    final_guard = PaperFinalWriteGuard(\n        order_store=order_store,\n        safety_state_store=safety_store,\n        portfolio_store=portfolio_store,\n        health_bridge=HealthyBridge(),\n        portfolio_health_entity_id="portfolio-r6-canary",\n    )\n    return {\n'''
          if old not in text:
              raise SystemExit('writer test permit marker missing')
          text = text.replace(old, new, 1)
          old = '''        "permit_registry": permit_registry,\n    }\n'''
          new = '''        "permit_registry": permit_registry,\n        "order_store": order_store,\n        "safety_store": safety_store,\n        "portfolio_store": portfolio_store,\n        "final_guard": final_guard,\n    }\n'''
          if old not in text:
              raise SystemExit('writer test return marker missing')
          text = text.replace(old, new, 1)

          old = '''        submission_registry=values["submission_registry"],\n        attempt_id=attempt_id,\n'''
          new = '''        submission_registry=values["submission_registry"],\n        final_guard=values["final_guard"],\n        attempt_id=attempt_id,\n'''
          if old not in text:
              raise SystemExit('writer test submit marker missing')
          text = text.replace(old, new, 1)

          text += '''\n\ndef test_final_pre_io_recheck_blocks_changed_kill_switch_after_permit_consumption(tmp_path) -> None:\n    flipping = FlipToKillSwitchStore()\n    values = stack(tmp_path, safety_store=flipping)\n    transport = FakeWriteTransport(response=success_response(values["expected"]))\n\n    with pytest.raises(PaperWriterBlocked, match="PRE_IO"):\n        submit(writer(transport), values)\n\n    assert flipping.calls == 2\n    assert transport.requests == []\n    assert values["submission_registry"].get(values["binding"].order_id).status is PaperSubmissionStatus.UNKNOWN\n    assert values["permit_registry"].get(values["approval"].approval_hash).status is PaperCanaryPermitStatus.CONSUMED\n\n\ndef test_success_result_binds_both_just_in_time_guard_hashes(tmp_path) -> None:\n    values = stack(tmp_path)\n    transport = FakeWriteTransport(response=success_response(values["expected"]))\n    result = submit(writer(transport), values)\n    assert len(result.pre_consume_guard_hash) == 64\n    assert len(result.pre_io_guard_hash) == 64\n    assert result.pre_consume_guard_hash != result.pre_io_guard_hash\n'''
          path.write_text(text, encoding='utf-8')
          PY
      - name: Add focused final guard adversarial tests
        run: |
          cat > tests/test_r6_final_write_guard.py <<'PY'
          from __future__ import annotations

          from dataclasses import replace
          from datetime import datetime, timedelta, timezone
          from decimal import Decimal
          from hashlib import sha256
          import sqlite3

          import pytest

          from autotrade.brokers.alpaca_paper_bracket import AlpacaEquityBracketBuilder, PaperEquityVenueRules
          from autotrade.brokers.alpaca_paper_canary import PaperCanaryContext, PaperCanaryGate, PaperCanaryPolicy
          from autotrade.brokers.alpaca_paper_final_guard import (
              PaperFinalWriteBlocked,
              PaperFinalWriteGuard,
              PaperFinalWritePhase,
          )
          from autotrade.brokers.alpaca_paper_gateway import AlpacaPaperAccountAttestation
          from autotrade.brokers.alpaca_paper_submission import PaperSubmissionBinding, SQLitePaperSubmissionRegistry
          from autotrade.domain import OrderIntent, OrderRecord, OrderStatus, OrderType, PortfolioSnapshot, Side
          from autotrade.health_bridge import EffectiveHealthControl, HealthRiskMode
          from autotrade.persistence import SQLiteRuntime
          from autotrade.state import InMemoryOrderStore, InMemoryPortfolioStore, InMemorySafetyStateStore


          UTC = timezone.utc
          NOW = datetime(2026, 8, 11, 15, 0, tzinfo=UTC)
          TRACKS = ("R0", "R1", "R2", "R3", "R4", "R5")


          def h(value: str) -> str:
              return sha256(value.encode()).hexdigest()


          class HealthBridge:
              def __init__(self, mode=HealthRiskMode.NORMAL):
                  self.mode = mode

              def effective_control(self, *, strategy_id, portfolio_entity_id, now):
                  del strategy_id, portfolio_entity_id, now
                  multiplier = Decimal("1") if self.mode is HealthRiskMode.NORMAL else Decimal("0.5")
                  return EffectiveHealthControl(
                      mode=self.mode,
                      order_multiplier=multiplier,
                      strategy_multiplier=multiplier,
                      portfolio_multiplier=multiplier,
                      reason="FINAL_WRITE_TEST",
                      strategy_state_fingerprint=h("strategy-health"),
                      portfolio_state_fingerprint=h("portfolio-health"),
                  )


          def base_order(order_id="guard-order-001", idempotency="guard-idem-001"):
              return OrderRecord(
                  order_id=order_id,
                  intent=OrderIntent(
                      intent_id=f"intent-{order_id}",
                      idempotency_key=idempotency,
                      strategy_id="guard-strategy",
                      symbol="AAPL",
                      side=Side.BUY,
                      quantity=Decimal("1"),
                      order_type=OrderType.LIMIT,
                      created_at=NOW - timedelta(seconds=2),
                      limit_price=Decimal("10"),
                  ),
                  risk_decision_id=f"risk-{order_id}",
                  status=OrderStatus.VALIDATED,
                  created_at=NOW - timedelta(seconds=1),
              )


          def account():
              return AlpacaPaperAccountAttestation(
                  account_id="guard-account-001",
                  account_reference=h("account"),
                  credential_reference=h("credentials"),
                  status="ACTIVE",
                  currency="USD",
                  buying_power=Decimal("100000"),
                  portfolio_value=Decimal("100000"),
                  shorting_enabled=True,
                  attested_at=NOW,
                  request_id="guard-account-request-001",
                  source_host="paper-api.alpaca.markets",
                  source_path="/v2/account",
              )


          def bracket(current_order):
              return AlpacaEquityBracketBuilder().build(
                  order=current_order,
                  venue_rules=PaperEquityVenueRules(
                      symbol="AAPL",
                      asset_class="us_equity",
                      price_tick=Decimal("0.01"),
                      quantity_step=Decimal("0.001"),
                      minimum_quantity=Decimal("0.001"),
                      instrument_master_fingerprint=h("instrument"),
                  ),
                  take_profit_price=Decimal("10.50"),
                  stop_loss_price=Decimal("9.50"),
              )


          def setup(tmp_path, *, health_mode=HealthRiskMode.NORMAL):
              current_order = base_order()
              current_account = account()
              expected = bracket(current_order)
              registry = SQLitePaperSubmissionRegistry(SQLiteRuntime(tmp_path / "submissions.sqlite"))
              binding = PaperSubmissionBinding.from_order(
                  order=current_order,
                  account_attestation_fingerprint=current_account.fingerprint,
                  order_payload_hash=expected.payload_hash,
                  created_at=NOW,
              )
              state = registry.prepare(binding)
              approval = PaperCanaryGate(PaperCanaryPolicy(enabled=True)).approve(
                  PaperCanaryContext(
                      order=current_order,
                      binding=binding,
                      submission_state=state,
                      account_attestation=current_account,
                      now=NOW,
                      certified_tracks=TRACKS,
                      reconciliation_clean=True,
                      unresolved_unknown_orders=0,
                      kill_switch_engaged=False,
                      health_allows_new_exposure=True,
                      prior_canary_submissions=0,
                  )
              )
              orders = InMemoryOrderStore()
              orders.create_if_absent(current_order)
              orders.update(replace(current_order, status=OrderStatus.SUBMITTING, submitted_at=NOW))
              safety = InMemorySafetyStateStore()
              portfolio = InMemoryPortfolioStore()
              portfolio.initialize(
                  PortfolioSnapshot(
                      snapshot_id="guard-portfolio-001",
                      equity=Decimal("100000"),
                      gross_exposure=Decimal("0"),
                      net_exposure=Decimal("0"),
                      daily_pnl=Decimal("0"),
                      drawdown=Decimal("0"),
                      open_orders=0,
                      signed_position_notional_by_symbol={},
                      strategy_gross_exposure={},
                      strategy_signed_position_notional_by_symbol={},
                      reconciliation_ok=True,
                      broker_state_known=True,
                  ),
                  now=NOW,
              )
              guard = PaperFinalWriteGuard(
                  order_store=orders,
                  safety_state_store=safety,
                  portfolio_store=portfolio,
                  health_bridge=HealthBridge(health_mode),
                  portfolio_health_entity_id="portfolio-r6-canary",
              )
              return current_order, expected, registry, binding, approval, orders, safety, portfolio, guard


          def authorize(values, *, phase=PaperFinalWritePhase.PRE_CONSUME, attempt_id=None):
              current_order, expected, registry, binding, approval, orders, safety, portfolio, guard = values
              return guard.authorize(
                  approval=approval,
                  expected_bracket=expected,
                  submission_registry=registry,
                  now=NOW + timedelta(seconds=1),
                  phase=phase,
                  expected_attempt_id=attempt_id,
              )


          def test_preconsume_reads_authoritative_sources_and_hashes_attestation(tmp_path):
              values = setup(tmp_path)
              attested = authorize(values)
              assert attested.phase is PaperFinalWritePhase.PRE_CONSUME
              assert attested.submission_status.value == "PREPARED"
              assert attested.health_mode is HealthRiskMode.NORMAL
              assert len(attested.attestation_hash) == 64


          def test_authoritative_oms_must_be_submitting_not_merely_caller_approved(tmp_path):
              values = setup(tmp_path)
              current_order, expected, registry, binding, approval, orders, safety, portfolio, guard = values
              orders.update(current_order)
              with pytest.raises(PaperFinalWriteBlocked, match="SUBMITTING"):
                  authorize(values)


          def test_kill_switch_and_circuit_are_authoritative_blockers(tmp_path):
              values = setup(tmp_path)
              *_, safety, portfolio, guard = values[0:7] + values[7:]
              values[6].activate(reason="kill", now=NOW)
              with pytest.raises(PaperFinalWriteBlocked, match="kill switch"):
                  authorize(values)

              values = setup(tmp_path / "circuit")
              values[6].activate_circuit(reason="circuit", now=NOW)
              with pytest.raises(PaperFinalWriteBlocked, match="circuit"):
                  authorize(values)


          def test_portfolio_reconciliation_and_known_broker_state_are_required(tmp_path):
              values = setup(tmp_path)
              portfolio = values[7]
              current = portfolio.get()
              portfolio.compare_and_set(
                  expected_version=current.version,
                  snapshot=replace(current.snapshot, reconciliation_ok=False),
                  now=NOW,
              )
              with pytest.raises(PaperFinalWriteBlocked, match="reconciliation"):
                  authorize(values)

              values = setup(tmp_path / "unknown-broker")
              portfolio = values[7]
              current = portfolio.get()
              portfolio.compare_and_set(
                  expected_version=current.version,
                  snapshot=replace(current.snapshot, broker_state_known=False),
                  now=NOW,
              )
              with pytest.raises(PaperFinalWriteBlocked, match="broker state"):
                  authorize(values)


          def test_degraded_health_blocks_even_when_not_no_new_risk(tmp_path):
              values = setup(tmp_path, health_mode=HealthRiskMode.REDUCED)
              with pytest.raises(PaperFinalWriteBlocked, match="Health"):
                  authorize(values)


          def test_other_attempted_or_unknown_submission_exhausts_first_canary_budget(tmp_path):
              values = setup(tmp_path)
              registry = values[2]
              other = base_order("guard-order-002", "guard-idem-002")
              other_expected = bracket(other)
              other_binding = PaperSubmissionBinding.from_order(
                  order=other,
                  account_attestation_fingerprint=account().fingerprint,
                  order_payload_hash=other_expected.payload_hash,
                  created_at=NOW,
              )
              registry.prepare(other_binding)
              registry.mark_submit_attempt_unknown(
                  order_id=other.order_id,
                  attempt_id="other-attempt",
                  now=NOW + timedelta(milliseconds=100),
              )
              with pytest.raises(PaperFinalWriteBlocked, match="another"):
                  authorize(values)


          def test_pre_io_requires_same_durable_attempt_identity(tmp_path):
              values = setup(tmp_path)
              registry = values[2]
              registry.mark_submit_attempt_unknown(
                  order_id=values[0].order_id,
                  attempt_id="expected-attempt",
                  now=NOW + timedelta(milliseconds=100),
              )
              attested = authorize(
                  values,
                  phase=PaperFinalWritePhase.PRE_IO,
                  attempt_id="expected-attempt",
              )
              assert attested.submission_status.value == "UNKNOWN"
              with pytest.raises(PaperFinalWriteBlocked, match="attempt_id"):
                  authorize(
                      values,
                      phase=PaperFinalWritePhase.PRE_IO,
                      attempt_id="different-attempt",
                  )


          def test_global_snapshot_detects_other_control_tamper(tmp_path):
              values = setup(tmp_path)
              registry = values[2]
              other = base_order("guard-order-002", "guard-idem-002")
              other_binding = PaperSubmissionBinding.from_order(
                  order=other,
                  account_attestation_fingerprint=account().fingerprint,
                  order_payload_hash=bracket(other).payload_hash,
                  created_at=NOW,
              )
              registry.prepare(other_binding)
              with sqlite3.connect(registry._runtime.path) as conn:  # adversarial direct corruption
                  conn.execute(
                      "UPDATE alpaca_paper_submission_control SET status='UNKNOWN' WHERE order_id=?",
                      (other.order_id,),
                  )
                  conn.commit()
              with pytest.raises(PaperFinalWriteBlocked, match="corrupt"):
                  authorize(values)
          PY
      - name: Commit implementation before certification
        run: |
          git config user.name arendon7
          git config user.email 102555888+arendon7@users.noreply.github.com
          git add src/autotrade/brokers/alpaca_paper_submission.py \
                  src/autotrade/brokers/alpaca_paper_writer.py \
                  src/autotrade/brokers/alpaca_paper_final_guard.py \
                  scripts/check_r6_authority.py \
                  tests/test_r6_paper_writer.py \
                  tests/test_r6_final_write_guard.py
          git commit -m "feat(r6): enforce just-in-time final PAPER write guard"
          git push origin HEAD:reconstruction/r6-external-paper-protection
      - name: Focused guard tests
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_r6_final_write_guard.py tests/test_r6_paper_writer.py tests/test_r6_authority_checker.py
          python scripts/check_r6_authority.py
      - name: Full certification
        run: |
          python -m compileall -q src tests scripts
          pytest --cov=autotrade --cov-report=term-missing
          python scripts/check_contract_registry.py
          python scripts/check_research_authority.py
