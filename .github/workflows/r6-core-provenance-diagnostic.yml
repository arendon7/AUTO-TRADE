name: R6 Core Provenance Diagnostic

on:
  push:
    branches: ["reconstruction/r6-external-paper-protection"]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Apply refactor and capture focused output
        id: focused
        shell: bash
        run: |
          set +e
          {
            echo '=== APPLY ==='
            python scripts/r6_refactor_core_provenance_health.py
            APPLY_RC=$?
            echo "APPLY_RC=$APPLY_RC"
            if [ "$APPLY_RC" -eq 0 ]; then
              echo '=== COMPILE ==='
              python -m compileall -q src tests scripts
              COMPILE_RC=$?
              echo "COMPILE_RC=$COMPILE_RC"
              if [ "$COMPILE_RC" -eq 0 ]; then
                echo '=== IMPORT ==='
                python - <<'PY'
import autotrade.health_bridge
import autotrade.brokers.alpaca_paper_core_provenance
print('IMPORT_OK')
PY
                IMPORT_RC=$?
                echo "IMPORT_RC=$IMPORT_RC"
                echo '=== PROVENANCE TESTS ==='
                pytest -q tests/test_r6_core_provenance.py
                PROV_RC=$?
                echo "PROV_RC=$PROV_RC"
                echo '=== BOUNDARY TESTS ==='
                pytest -q tests/test_r6_core_provenance_boundary.py
                BOUNDARY_RC=$?
                echo "BOUNDARY_RC=$BOUNDARY_RC"
              fi
            fi
          } > /tmp/r6_provenance_diagnostic.txt 2>&1
          cat /tmp/r6_provenance_diagnostic.txt
      - name: Publish diagnostic only
        run: |
          git reset --hard HEAD
          mkdir -p knowledge/60_EVIDENCE
          cp /tmp/r6_provenance_diagnostic.txt knowledge/60_EVIDENCE/TEMP_R6_CORE_PROVENANCE_DIAGNOSTIC.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/60_EVIDENCE/TEMP_R6_CORE_PROVENANCE_DIAGNOSTIC.txt
          git commit -m "chore(r6): capture temporary provenance diagnostic"
          git push origin HEAD:reconstruction/r6-external-paper-protection
