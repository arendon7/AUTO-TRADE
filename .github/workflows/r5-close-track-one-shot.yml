name: R5 Certified Track Closure

on:
  push:
    branches:
      - reconstruction/r5-stream-shadow-forward
    paths:
      - .github/workflows/r5-close-track-one-shot.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r5-stream-shadow-forward
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install exact R5 runtime
        run: python -m pip install -e '.[dev]'

      - name: Re-certify implementation before debt closure
        run: |
          python -m compileall -q src tests scripts
          pytest --cov=autotrade --cov-report=term-missing
          python scripts/check_contract_registry.py
          python scripts/check_research_authority.py
          python scripts/check_r5_authority.py
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py

      - name: Apply certified R5 canonical closure
        run: python scripts/r5_close_track.py

      - name: Validate certified machine and human canon
        run: |
          python scripts/check_contract_registry.py
          python scripts/check_research_authority.py
          python scripts/check_r5_authority.py
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py

      - name: Commit closure and prove self-clean
        run: |
          git config user.name "arendon7"
          git config user.email "102555888+arendon7@users.noreply.github.com"
          git add knowledge/00_CANON/debt_register.json \
                  knowledge/00_CANON/DEBT_REGISTER.md \
                  knowledge/00_CANON/RECONSTRUCTION_V028R_MATRIX.md \
                  knowledge/00_CANON/ESTADO_ACTUAL.md \
                  knowledge/00_CANON/TAREA_ACTIVA.md \
                  knowledge/00_CANON/CONTEXTO_RAPIDO.md \
                  knowledge/40_HANDOFF/HANDOFF_ACTUAL.md \
                  knowledge/60_EVIDENCE/R5_CERTIFICATION.json
          git rm -f scripts/r5_close_track.py
          git rm -f .github/workflows/r5-close-track-one-shot.yml
          test -z "$(git ls-files '.github/workflows/r5-*-one-shot.yml')"
          test -z "$(git ls-files 'scripts/r5_*one_shot*.py' 'scripts/r5_close_track.py')"
          git commit -m "docs(r5): certify R5 track and gate R6"
          git push origin HEAD:reconstruction/r5-stream-shadow-forward
