name: OSS-3D3H Historical D3A Runtime Reconstruction V2

on:
  push:
    branches:
      - diagnostic/oss3d3h-pip-version-hash
    paths:
      - '.github/workflows/oss3d3h-historical-runtime-reconstruct-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      EXPECTED_DISTRIBUTION_SET: 0e4e828d8fe8cc6421773297892bcdb71ec67495d1cf1681fc07991ee4e3d47f
      RUNTIME_CONSTRAINTS: labs/oss3_qlib/runtime_locks/oss3d3a_d2g_runtime_constraints.txt
      D3A_JOB_ID: '102647050817'
      D3A_LOG: /tmp/oss3d3a-certified-job.log
      BASE_JSON: /tmp/oss3d3h-base-distributions.json
      HISTORICAL_JSON: /tmp/oss3d3a-historical-distributions.json

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Capture pristine setup-python base without third-party imports
        run: |
          python - <<'PY'
          import json, os, re
          from importlib import metadata
          from pathlib import Path
          def canon(name):
              return re.sub(r'[-_.]+', '-', name).lower()
          rows=[]
          for d in metadata.distributions():
              raw=d.metadata.get('Name')
              if raw:
                  rows.append({'name':canon(raw),'version':d.version})
          rows.sort(key=lambda x:(x['name'],x['version']))
          Path(os.environ['BASE_JSON']).write_text(json.dumps(rows,sort_keys=True,separators=(',',':'))+'\n')
          print('pristine distribution count:',len(rows))
          for row in rows: print('BASE',row['name'],row['version'])
          PY

      - name: Download exact certified D3A job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/jobs/${D3A_JOB_ID}/logs" > "$D3A_LOG"
          test -s "$D3A_LOG"
          grep -F "Successfully installed" "$D3A_LOG"

      - name: Install comparison environment
        run: |
          python -m pip install -c "$RUNTIME_CONSTRAINTS" -e '.[dev]'
          python -m pip install -c "$RUNTIME_CONSTRAINTS" 'pyqlib==0.9.7'

      - name: Reconstruct exact historical set
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from importlib import metadata
          from pathlib import Path
          from packaging.utils import canonicalize_name
          from packaging.version import Version, InvalidVersion
          from labs.oss3_qlib.environment_attestation import InstalledDistribution
          from labs.oss3_qlib.family_environment_attestation import _distribution_set_hash

          text=Path(os.environ['D3A_LOG']).read_text(errors='replace')
          base_rows=json.loads(Path(os.environ['BASE_JSON']).read_text())
          current_names={canonicalize_name(d.metadata.get('Name')) for d in metadata.distributions() if d.metadata.get('Name')}
          payloads=[line.split('Successfully installed ',1)[1].strip() for line in text.splitlines() if 'Successfully installed ' in line]
          print('success payloads:',len(payloads))
          if len(payloads)!=2: raise SystemExit(f'expected 2 success payloads, got {len(payloads)}')

          def parse_token(token):
              hits=[]
              for i,ch in enumerate(token):
                  if ch!='-': continue
                  n=canonicalize_name(token[:i]); v=token[i+1:]
                  try: Version(v)
                  except InvalidVersion: continue
                  if n in current_names or n=='auto-trade-core': hits.append((i,n,v))
              if not hits: raise SystemExit(f'unparsed token {token!r}')
              _,n,v=max(hits)
              return n,v

          installed={}
          for payload in payloads:
              for token in payload.split():
                  n,v=parse_token(token)
                  if n in installed and installed[n]!=v: raise SystemExit(f'conflict {n}')
                  installed[n]=v
          print('logged installed package count:',len(installed))

          base={row['name']:row['version'] for row in base_rows}
          historical=dict(base); historical.update(installed)
          def material(mapping):
              return tuple(sorted(InstalledDistribution(name=n,version=v) for n,v in mapping.items()))
          hist_items=material(historical)
          target=os.environ['EXPECTED_DISTRIBUTION_SET']
          print('base count:',len(base),'base=',base)
          print('composed count:',len(hist_items))
          print('composed hash:',_distribution_set_hash(hist_items))
          print('target hash:',target)

          if _distribution_set_hash(hist_items)!=target:
              logged_items=material(installed)
              print('logged-only count:',len(logged_items))
              if len(logged_items)==197:
                  with urllib.request.urlopen('https://pypi.org/pypi/pip/json',timeout=30) as r: releases=json.load(r)['releases']
                  matches=[]
                  for v in releases:
                      candidate=tuple(sorted(logged_items+(InstalledDistribution(name='pip',version=v),)))
                      if _distribution_set_hash(candidate)==target: matches.append(v)
                  print('pip matches against exact logged 197:',matches)
                  if len(matches)==1:
                      historical=dict(installed); historical['pip']=matches[0]; hist_items=material(historical)
                      print('SOLVED_HISTORICAL_PIP_VERSION='+matches[0])

          if _distribution_set_hash(hist_items)!=target:
              current={canonicalize_name(d.metadata.get('Name')):d.version for d in metadata.distributions() if d.metadata.get('Name')}
              for n in sorted(set(historical)|set(current)):
                  if historical.get(n)!=current.get(n): print('DIFF',n,historical.get(n),current.get(n))
              raise SystemExit('exact D3A distribution set not reconstructed')
          if len(hist_items)!=198: raise SystemExit(f'count mismatch {len(hist_items)}')
          out={'distribution_count':len(hist_items),'distribution_set_hash':target,'distributions':[x.to_dict() for x in hist_items]}
          Path(os.environ['HISTORICAL_JSON']).write_text(json.dumps(out,sort_keys=True,separators=(',',':'))+'\n')
          print('OSS-3D3H historical D3A runtime reconstruction: PASS')
          PY

      - name: Upload reconstructed set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oss3d3h-historical-runtime-v2-${{ github.sha }}
          path: |
            ${{ env.BASE_JSON }}
            ${{ env.HISTORICAL_JSON }}
          retention-days: 30
          if-no-files-found: warn
