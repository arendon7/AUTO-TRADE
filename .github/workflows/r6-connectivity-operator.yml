name: R6 Connectivity Operator Boundary

on:
  push:
    branches: ["reconstruction/**", "work/**", "feature/**"]
    paths:
      - "src/autotrade/connectivity_operator_decision.py"
      - "scripts/r6_issue_connectivity_operator_decision.py"
      - "scripts/check_r6_connectivity_operator_boundary.py"
      - "tests/test_r6_connectivity_operator_decision.py"
      - "tests/test_r6_connectivity_operator_cli.py"
      - ".github/workflows/r6-connectivity-operator.yml"
  pull_request:
    paths:
      - "src/autotrade/connectivity_operator_decision.py"
      - "scripts/r6_issue_connectivity_operator_decision.py"
      - "scripts/check_r6_connectivity_operator_boundary.py"
      - "tests/test_r6_connectivity_operator_decision.py"
      - "tests/test_r6_connectivity_operator_cli.py"
      - ".github/workflows/r6-connectivity-operator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectivity-operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Connectivity operator authority boundary
        run: python scripts/check_r6_connectivity_operator_boundary.py
      - name: Connectivity operator functional and adversarial tests
        run: pytest -q tests/test_r6_connectivity_operator_decision.py tests/test_r6_connectivity_operator_cli.py
