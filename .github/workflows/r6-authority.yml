name: R6 PAPER Authority Boundary

on:
  push:
    branches: [main, stable, "reconstruction/**"]
  pull_request:

permissions:
  contents: read

jobs:
  r6-paper-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: R6 PAPER-only authority boundary
        run: python scripts/check_r6_authority.py
      - name: Adversarial checker tests
        run: pytest -q tests/test_r6_authority_checker.py
