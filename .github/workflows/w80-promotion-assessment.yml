name: W80 Durable Promotion Assessment

on:
  push:
    branches: ["work/w80-**"]
  pull_request:

permissions:
  contents: read

jobs:
  durable-promotion-assessment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile W80 surface
        run: >-
          python -m compileall -q
          src/autotrade/strategy_promotion_assessment.py
          src/autotrade/strategy_promotion_assessment_read_model.py
          src/autotrade/strategy_lab_read_model.py
          tests/test_w80_promotion_assessment.py
          tests/test_w80_promotion_assessment_read_model.py
          tests/test_w80_promotion_assessment_policy_binding.py
          tests/test_w80_strategy_lab_projection.py
          scripts/check_w80_promotion_assessment_boundary.py
          scripts/check_w80_promotion_assessment_read_model_boundary.py
          scripts/check_w80_strategy_lab_projection_boundary.py
      - name: W80 durable assessment authority boundary
        run: python scripts/check_w80_promotion_assessment_boundary.py
      - name: W80 independent assessment reader boundary
        run: python scripts/check_w80_promotion_assessment_read_model_boundary.py
      - name: W80 Strategy Lab durable projection boundary
        run: python scripts/check_w80_strategy_lab_projection_boundary.py
      - name: W80 durable assessment tests
        run: >-
          pytest -q
          tests/test_w80_promotion_assessment.py
          tests/test_w80_promotion_assessment_read_model.py
          tests/test_w80_promotion_assessment_policy_binding.py
          tests/test_w80_strategy_lab_projection.py
      - name: Re-prove W79 promotion boundary
        run: python scripts/check_w79_strategy_promotion_boundary.py
      - name: Re-prove W79 Strategy Lab read-only boundary
        run: python scripts/check_w79_strategy_lab_read_model_boundary.py
      - name: Re-prove Mac Control Center boundary
        run: python scripts/check_mac_dashboard_boundary.py
      - name: Re-prove W78 execution qualification boundary
        run: python scripts/check_w78_paper_execution_boundary.py
      - name: Re-prove research authority boundary
        run: python scripts/check_research_authority.py
