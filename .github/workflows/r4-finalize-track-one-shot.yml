name: R4 Final Track Certification

on:
  push:
    branches:
      - reconstruction/r4-portfolio-health
    paths:
      - .github/workflows/r4-finalize-track-one-shot.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r4-portfolio-health
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply R4 track certification
        run: python scripts/r4_finalize_track_certification.py
      - name: Validate machine and human canon
        run: |
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Commit certification and self-clean
        run: |
          git config user.name "arendon7"
          git config user.email "102555888+arendon7@users.noreply.github.com"
          git add knowledge/00_CANON/debt_register.json \
                  knowledge/00_CANON/DEBT_REGISTER.md \
                  knowledge/00_CANON/RECONSTRUCTION_V028R_MATRIX.md \
                  knowledge/00_CANON/ESTADO_ACTUAL.md \
                  knowledge/00_CANON/TAREA_ACTIVA.md \
                  knowledge/60_EVIDENCE/R4_CERTIFICATION.json
          git rm -f scripts/r4_finalize_track_certification.py
          git rm -f .github/workflows/r4-finalize-track-one-shot.yml
          git commit -m "docs(r4): certify R4 track for merge and gate R5"
          git push origin HEAD:reconstruction/r4-portfolio-health
