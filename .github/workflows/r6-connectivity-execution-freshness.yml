name: R6 Connectivity Execution Freshness Boundary

on:
  push:
    branches: ["reconstruction/**", "work/**", "feature/**"]
    paths:
      - "src/autotrade/connectivity_execution_freshness_binding.py"
      - "scripts/r6_connectivity_bound_final_freshness.py"
      - "scripts/check_r6_connectivity_execution_freshness_boundary.py"
      - "tests/test_r6_connectivity_execution_freshness_binding.py"
      - "tests/test_r6_connectivity_execution_freshness_edges.py"
      - "tests/test_r6_connectivity_bound_final_freshness_cli.py"
      - ".github/workflows/r6-connectivity-execution-freshness.yml"
  pull_request:
    paths:
      - "src/autotrade/connectivity_execution_freshness_binding.py"
      - "scripts/r6_connectivity_bound_final_freshness.py"
      - "scripts/check_r6_connectivity_execution_freshness_boundary.py"
      - "tests/test_r6_connectivity_execution_freshness_binding.py"
      - "tests/test_r6_connectivity_execution_freshness_edges.py"
      - "tests/test_r6_connectivity_bound_final_freshness_cli.py"
      - ".github/workflows/r6-connectivity-execution-freshness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectivity-execution-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Execution-intent to Final Freshness boundary
        run: python scripts/check_r6_connectivity_execution_freshness_boundary.py
      - name: Execution-intent bound Final Freshness tests
        run: pytest -q tests/test_r6_connectivity_execution_freshness_binding.py tests/test_r6_connectivity_execution_freshness_edges.py tests/test_r6_connectivity_bound_final_freshness_cli.py
