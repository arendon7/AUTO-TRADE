name: OSS-3A Qlib Prediction Artifact Research

on:
  pull_request:
    paths:
      - "src/autotrade/research/oss3_qlib_artifact.py"
      - "tests/test_research_oss3_qlib_artifact.py"
      - "scripts/check_oss3a_qlib_artifact_boundary.py"
      - "knowledge/20_RESEARCH/OSS3A_QLIB_PREDICTION_ARTIFACT.md"
      - "pyproject.toml"
      - ".github/workflows/oss3a-qlib-artifact.yml"

permissions:
  contents: read

jobs:
  oss3a:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install AUTO-TRADE without Qlib runtime
        run: python -m pip install -e ".[dev]"

      - name: Compile OSS-3A
        run: |
          python -m py_compile \
            src/autotrade/research/oss3_qlib_artifact.py \
            tests/test_research_oss3_qlib_artifact.py \
            scripts/check_oss3a_qlib_artifact_boundary.py

      - name: Assert Qlib is not a core runtime dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("pyproject.toml").read_text(encoding="utf-8").lower()
          assert "pyqlib" not in text
          assert "qlib==" not in text
          print("OSS-3A core dependency isolation: PASS")
          PY

      - name: OSS-3A deterministic + adversarial artifact tests
        run: pytest -q tests/test_research_oss3_qlib_artifact.py

      - name: OSS-3A isolated authority boundary
        run: python scripts/check_oss3a_qlib_artifact_boundary.py

      - name: Research authority regression
        run: python scripts/check_research_authority.py

      - name: W83 canonical strategy runtime re-proof
        run: python scripts/check_w83_strategy_version_binding_boundary.py

      - name: OSS-2H regression
        run: |
          pytest -q \
            tests/test_research_oss2_final_holdout_evaluation.py \
            tests/test_research_oss2_final_holdout_evaluation_adversarial.py \
            tests/test_research_oss2_final_holdout_evaluation_edges.py
          python scripts/check_oss2h_final_holdout_evaluation_boundary.py
