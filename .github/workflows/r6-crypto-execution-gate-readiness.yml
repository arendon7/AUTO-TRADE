name: R6 Crypto PAPER Execution Gate Readiness

on:
  pull_request:
    paths:
      - "ABRIR_AUTO_TRADE.command"
      - "scripts/mac_crypto_execution_health_readiness.py"
      - "scripts/mac_dashboard_execution_gate.py"
      - "scripts/check_mac_crypto_execution_gate_readiness.py"
      - "tests/test_mac_crypto_execution_health_readiness.py"
      - "tests/test_mac_crypto_execution_gate_readiness.py"
      - ".github/workflows/r6-crypto-execution-gate-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-gate-readiness:
    runs-on: macos-14
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Compile readiness surface
        run: |
          python -m compileall -q \
            scripts/mac_crypto_execution_health_readiness.py \
            scripts/mac_dashboard_execution_gate.py \
            scripts/check_mac_crypto_execution_gate_readiness.py

      - name: Permanent execution Health readiness boundary
        run: python scripts/check_mac_crypto_execution_gate_readiness.py

      - name: Read-only Health readiness tests
        run: |
          pytest -q \
            tests/test_mac_crypto_execution_health_readiness.py \
            tests/test_mac_crypto_execution_gate_readiness.py

      - name: Re-prove Mac Control Center remains NO-POST
        run: python scripts/check_mac_dashboard_boundary.py

      - name: Re-prove global R6 authority boundary
        run: python scripts/check_r6_authority.py

      - name: Re-prove crypto execution authority boundary
        run: python scripts/check_r6_crypto_execution_boundary.py
