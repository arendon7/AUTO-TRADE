name: R4 Final Branch Readiness Gate

on:
  push:
    branches:
      - reconstruction/r4-portfolio-health
    paths:
      - .github/workflows/r4-final-readiness-one-shot.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  certify-ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r4-portfolio-health
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Materialize canonical R4 closure if still pending
        run: |
          if [ -f scripts/r4_certify_track.py ]; then
            python scripts/r4_certify_track.py
          fi
          git rm -f scripts/r4_certify_track.py 2>/dev/null || true
          git rm -f .github/workflows/r4-track-certification-one-shot.yml 2>/dev/null || true
          # Remove this one-shot from the tree BEFORE testing so the permanent
          # R4 certification contract proves no temporary R4 workflow remains.
          git rm -f .github/workflows/r4-final-readiness-one-shot.yml
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Full test and branch-coverage gate
        run: pytest -q --cov=autotrade --cov-branch --cov-report=term-missing --cov-fail-under=85
      - name: Contract Registry
        run: python scripts/check_contract_registry.py
      - name: Research and advisory authority boundary
        run: python scripts/check_research_authority.py
      - name: Debt Register contract
        run: python scripts/check_debt_register.py
      - name: Knowledge Contract
        run: python scripts/check_knowledge_contract.py
      - name: Explicit final R4 assertions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          debt = json.loads(Path('knowledge/00_CANON/debt_register.json').read_text())
          assert 'R4' in debt['certified_tracks'], debt['certified_tracks']
          blockers = [
              i['id'] for i in debt['items']
              if i.get('track') == 'R4'
              and i.get('status') == 'OPEN'
              and i.get('severity') in {'P0','P1','P2'}
          ]
          assert blockers == [], blockers

          matrix = Path('knowledge/00_CANON/RECONSTRUCTION_V028R_MATRIX.md').read_text()
          rows = []
          for line in matrix.splitlines():
              if line.startswith('| R4 |'):
                  cells = [c.strip() for c in line.strip('|').split('|')]
                  rows.append((cells[1], cells[3]))
          assert len(rows) == 8, rows
          assert all(status == 'PASS' for _, status in rows), rows

          cert = json.loads(Path('knowledge/60_EVIDENCE/R4_CERTIFICATION.json').read_text())
          assert cert['certification_basis_head'] == '350efd43ac133c95a1997b4a821a2e0bab4afaf2'
          assert cert['open_r4_blocking_debt_ids'] == []
          assert cert['live_trading'] == 'BLOCKED'
          assert cert['capital_authority'] == 'NONE'

          assert list(Path('.github/workflows').glob('r4-*.yml')) == []
          assert list(Path('scripts').glob('r4_*.py')) == []
          print('R4 final branch readiness assertions: PASS')
          PY
      - name: Commit exact tested closure tree
        run: |
          git config user.name "arendon7"
          git config user.email "102555888+arendon7@users.noreply.github.com"
          git add \
            knowledge/00_CANON/debt_register.json \
            knowledge/00_CANON/DEBT_REGISTER.md \
            knowledge/00_CANON/RECONSTRUCTION_V028R_MATRIX.md \
            knowledge/00_CANON/ESTADO_ACTUAL.md \
            knowledge/00_CANON/TAREA_ACTIVA.md \
            knowledge/00_CANON/CONTEXTO_RAPIDO.md \
            knowledge/40_HANDOFF/HANDOFF_ACTUAL.md \
            knowledge/20_ARQUITECTURA/R4_FINAL_ADVERSARIAL_AUDIT.md || true
          git commit -m "docs(r4): finalize certified branch for PR integration"
          git push origin HEAD:reconstruction/r4-portfolio-health
      - name: Mark PR 11 ready only after all gates pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 11 --repo arendon7/AUTO-TRADE
