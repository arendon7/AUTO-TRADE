name: OSS-3D3H Historical Single-Package Hash Search

on:
  push:
    branches:
      - diagnostic/oss3d3h-pip-version-hash
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-package-hash-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      EXPECTED_MODEL_CONFIG: c2181bb4be73d8a0e8067d8640d9c9bd39c85297f6a6ab3e0d190cda039c21eb
      EXPECTED_DISTRIBUTION_SET: 0e4e828d8fe8cc6421773297892bcdb71ec67495d1cf1681fc07991ee4e3d47f
      RUNTIME_CONSTRAINTS: labs/oss3_qlib/runtime_locks/oss3d3a_d2g_runtime_constraints.txt

    steps:
      - name: Checkout exact diagnostic SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Reconstruct constrained D3A candidate environment
        run: |
          python -m pip install -c "$RUNTIME_CONSTRAINTS" -e '.[dev]'
          python -m pip install -c "$RUNTIME_CONSTRAINTS" 'pyqlib==0.9.7'

      - name: Search every public one-package historical substitution
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          from labs.oss3_qlib.environment_attestation import InstalledDistribution
          from labs.oss3_qlib.family_environment_attestation import (
              _distribution_set_hash,
              collect_candidate_environment_attestation,
          )

          att = collect_candidate_environment_attestation(
              model_config_hash=os.environ['EXPECTED_MODEL_CONFIG']
          )
          current = tuple(att.distributions)
          assert len(current) == 198
          target = os.environ['EXPECTED_DISTRIBUTION_SET']
          print('current_distribution_set_hash:', _distribution_set_hash(current))
          print('target_distribution_set_hash:', target)

          def fetch_versions(item):
              url = 'https://pypi.org/pypi/' + urllib.parse.quote(item.name, safe='') + '/json'
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      payload = json.load(r)
                  return item, tuple(payload.get('releases', {}).keys()), None
              except Exception as exc:
                  return item, (), f'{type(exc).__name__}: {exc}'

          catalogs = {}
          errors = {}
          with ThreadPoolExecutor(max_workers=24) as pool:
              futures = [pool.submit(fetch_versions, item) for item in current]
              for fut in as_completed(futures):
                  item, versions, error = fut.result()
                  if error:
                      errors[item.name] = error
                  else:
                      catalogs[item.name] = versions

          print('PyPI catalogs fetched:', len(catalogs))
          print('PyPI catalog misses:', sorted(errors))

          matches = []
          tested = 0
          for index, item in enumerate(current):
              prefix = current[:index]
              suffix = current[index + 1:]
              for version in catalogs.get(item.name, ()):
                  if version == item.version:
                      continue
                  try:
                      replacement = InstalledDistribution(name=item.name, version=version)
                  except Exception:
                      continue
                  candidate = tuple(sorted(prefix + (replacement,) + suffix))
                  tested += 1
                  if _distribution_set_hash(candidate) == target:
                      matches.append((item.name, item.version, version))

          print('single-package historical substitutions tested:', tested)
          print('matching substitutions:', matches)
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one one-package match; found {matches!r}')
          name, current_version, historical_version = matches[0]
          print(f'HISTORICAL_DRIFT={name}:{current_version}->{historical_version}')
          PY
