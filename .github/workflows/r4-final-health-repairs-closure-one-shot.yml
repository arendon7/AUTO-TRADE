name: R4 Final Health Repairs Closure

on:
  push:
    branches:
      - reconstruction/r4-portfolio-health
    paths:
      - .github/workflows/r4-final-health-repairs-closure-one-shot.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r4-portfolio-health
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/r4_close_final_health_repairs.py
      - run: |
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - run: |
          git config user.name "arendon7"
          git config user.email "102555888+arendon7@users.noreply.github.com"
          git add knowledge/00_CANON/debt_register.json knowledge/00_CANON/DEBT_REGISTER.md knowledge/00_CANON/RECONSTRUCTION_V028R_MATRIX.md
          git rm -f scripts/r4_close_final_health_repairs.py
          git rm -f .github/workflows/r4-final-health-repairs-closure-one-shot.yml
          git commit -m "docs(r4): close retry-safe and authoritative Health repairs"
          git push origin HEAD:reconstruction/r4-portfolio-health
