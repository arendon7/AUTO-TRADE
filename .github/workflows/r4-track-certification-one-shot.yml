name: R4 Track Certification Closure

on:
  push:
    branches:
      - reconstruction/r4-portfolio-health
    paths:
      - .github/workflows/r4-track-certification-one-shot.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r4-portfolio-health
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply R4 canonical certification closure
        run: python scripts/r4_certify_track.py
      - name: Validate canonical contracts
        run: |
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Commit closure and self-clean
        run: |
          git config user.name "arendon7"
          git config user.email "102555888+arendon7@users.noreply.github.com"
          git add \
            knowledge/00_CANON/debt_register.json \
            knowledge/00_CANON/DEBT_REGISTER.md \
            knowledge/00_CANON/RECONSTRUCTION_V028R_MATRIX.md \
            knowledge/00_CANON/ESTADO_ACTUAL.md \
            knowledge/00_CANON/TAREA_ACTIVA.md \
            knowledge/00_CANON/CONTEXTO_RAPIDO.md \
            knowledge/40_HANDOFF/HANDOFF_ACTUAL.md \
            knowledge/20_ARQUITECTURA/R4_FINAL_ADVERSARIAL_AUDIT.md
          git rm -f scripts/r4_certify_track.py
          git rm -f .github/workflows/r4-track-certification-one-shot.yml
          git commit -m "docs(r4): certify track and transition canonical target to R5"
          git push origin HEAD:reconstruction/r4-portfolio-health
