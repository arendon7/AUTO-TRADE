name: W86 PAPER Runtime Readiness Seal

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness-seal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile W86 seal surfaces
        run: python -m compileall -q src/autotrade/paper_runtime_source_postcheck.py src/autotrade/paper_runtime_readiness_seal.py scripts/check_w86_paper_runtime_readiness_seal_boundary.py tests/test_w86_paper_runtime_readiness_seal.py tests/test_w86_paper_runtime_readiness_seal_hardening.py
      - name: W86 post-collection readiness seal boundary
        run: python scripts/check_w86_paper_runtime_readiness_seal_boundary.py
      - name: W86 post-collection readiness seal adversarial tests
        run: pytest -q tests/test_w86_paper_runtime_readiness_seal.py tests/test_w86_paper_runtime_readiness_seal_hardening.py
      - name: Re-prove W86 read-only collection pipeline
        run: python scripts/check_w86_paper_runtime_read_only_pipeline_boundary.py
      - name: Re-prove W86 funding capacity
        run: python scripts/check_w86_paper_runtime_funding_capacity_boundary.py
      - name: Re-prove W86 final runtime readiness
        run: python scripts/check_w86_paper_runtime_final_readiness_boundary.py
      - name: Re-prove W86 atomic W85 source snapshot
        run: python scripts/check_w86_paper_runtime_readiness_snapshot_boundary.py
      - name: Re-prove W85 PAPER candidate admission boundary
        run: python scripts/check_w85_paper_candidate_admission_boundary.py
      - name: Re-prove R6 PAPER authority boundary
        run: python scripts/check_r6_authority.py
      - name: Re-prove permanent LIVE deny
        run: python scripts/check_r6_live_deny_boundary.py
