name: W81 Execution Cost Continuity

on:
  pull_request:
    paths:
      - "src/autotrade/execution_cost_continuity.py"
      - "src/autotrade/promotion_cost_continuity.py"
      - "tests/test_w81_execution_cost_continuity.py"
      - "tests/test_w81_execution_cost_continuity_adversarial.py"
      - "tests/test_w81_promotion_cost_continuity.py"
      - "scripts/check_w81_execution_cost_continuity_boundary.py"
      - "scripts/check_w81_promotion_cost_continuity_boundary.py"
      - ".github/workflows/w81-execution-cost-continuity.yml"
      - ".github/workflows/core-tests.yml"
      - "knowledge/00_CANON/debt_register_r7d_auto_paper.json"
      - "knowledge/00_CANON/**"
      - "knowledge/30_DECISIONES/**"
      - "knowledge/40_HANDOFF/**"

permissions:
  contents: read

jobs:
  execution-cost-continuity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile W81 surface
        run: python -m compileall -q src/autotrade/execution_cost_continuity.py src/autotrade/promotion_cost_continuity.py tests/test_w81_execution_cost_continuity.py tests/test_w81_execution_cost_continuity_adversarial.py tests/test_w81_promotion_cost_continuity.py scripts/check_w81_execution_cost_continuity_boundary.py scripts/check_w81_promotion_cost_continuity_boundary.py
      - name: W81 no-execution cost continuity boundary
        run: python scripts/check_w81_execution_cost_continuity_boundary.py
      - name: W81 candidate continuity resolution boundary
        run: python scripts/check_w81_promotion_cost_continuity_boundary.py
      - name: W81 execution cost continuity tests
        run: pytest -q tests/test_w81_execution_cost_continuity.py tests/test_w81_execution_cost_continuity_adversarial.py tests/test_w81_promotion_cost_continuity.py
      - name: Re-prove W78 execution qualification
        run: pytest -q tests/test_w78_paper_execution_qualification.py tests/test_w78_paper_execution_lab.py
      - name: Re-prove W78 execution boundary
        run: python scripts/check_w78_paper_execution_boundary.py
      - name: Re-prove W79 promotion boundary
        run: python scripts/check_w79_strategy_promotion_boundary.py
      - name: Re-prove W80 assessment boundary
        run: python scripts/check_w80_promotion_assessment_boundary.py
      - name: Re-prove research authority boundary
        run: python scripts/check_research_authority.py
