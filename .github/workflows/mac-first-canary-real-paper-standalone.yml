name: Mac First Canary Real PAPER Artifact

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-universal:
    runs-on: macos-15
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up build Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Certify real PAPER authority before packaging
        run: |
          python scripts/check_r6_first_canary_restart_safe_dashboard.py
          python scripts/check_r6_first_canary_real_paper_delegate.py
          python scripts/check_r6_first_canary_real_paper_dashboard.py
          python scripts/check_r6_first_canary_mac_dashboard.py
          python scripts/check_r6_live_deny_boundary.py

      - name: Build universal offline wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="$RUNNER_TEMP/autotrade-first-canary-assets"
          WHEELHOUSE="$ASSETS/wheels"
          mkdir -p "$WHEELHOUSE"
          python -m pip install --upgrade pip 'setuptools>=75' wheel
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir "$WHEELHOUSE"
          python -m pip download \
            --dest "$WHEELHOUSE" --only-binary=:all: \
            --platform macosx_11_0_arm64 --python-version 312 --implementation cp --abi cp312 \
            'websockets==16.1.1' 'pytest>=8.3,<9' 'pytest-cov>=5,<7'
          python -m pip download \
            --dest "$WHEELHOUSE" --only-binary=:all: \
            --platform macosx_10_13_x86_64 --python-version 312 --implementation cp --abi cp312 \
            'websockets==16.1.1' 'pytest>=8.3,<9' 'pytest-cov>=5,<7'
          (
            cd "$WHEELHOUSE"
            find . -maxdepth 1 -type f -name '*.whl' -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS
          )
          test -s "$WHEELHOUSE/SHA256SUMS"

      - name: Download and verify pinned dual-arch CPython runtime
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_DIR="$RUNNER_TEMP/autotrade-first-canary-assets/runtime"
          mkdir -p "$RUNTIME_DIR"
          ARM_FILE="$RUNTIME_DIR/cpython-3.12.13-20260718-arm64.tar.gz"
          INTEL_FILE="$RUNTIME_DIR/cpython-3.12.13-20260718-x86_64.tar.gz"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            'https://github.com/astral-sh/python-build-standalone/releases/download/20260718/cpython-3.12.13%2B20260718-aarch64-apple-darwin-install_only.tar.gz' \
            --output "$ARM_FILE"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            'https://github.com/astral-sh/python-build-standalone/releases/download/20260718/cpython-3.12.13%2B20260718-x86_64-apple-darwin-install_only.tar.gz' \
            --output "$INTEL_FILE"
          echo '62aeee6161d57303a71a138b75fd5cc6fb8c89c4b1d9c7f0a052d89fa0b6652b  cpython-3.12.13-20260718-arm64.tar.gz' > "$RUNTIME_DIR/SHA256SUMS"
          echo '10b47148de86f9d87ba6e96a3db606ced90a206a3454d7d6d8fa68536a05d81f  cpython-3.12.13-20260718-x86_64.tar.gz' >> "$RUNTIME_DIR/SHA256SUMS"
          (cd "$RUNTIME_DIR" && shasum -a 256 -c SHA256SUMS)

      - name: Build separate first-canary PAPER package
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          ASSETS="$RUNNER_TEMP/autotrade-first-canary-assets"
          PKG="dist/AUTO-TRADE-R6-MAC-FIRST-CANARY-PAPER"
          ZIP="dist/AUTO-TRADE-R6-MAC-FIRST-CANARY-PAPER.zip"
          rm -rf dist
          mkdir -p "$PKG/vendor/runtime" "$PKG/vendor/wheels"
          rsync -a ./ "$PKG/" \
            --exclude '.git' --exclude '.venv' --exclude '.runtime' --exclude '.env' \
            --exclude 'dist' --exclude '.pytest_cache' --exclude '.coverage' --exclude 'coverage.json' \
            --exclude '__pycache__' --exclude '*.pyc' --exclude '*.sqlite3' --exclude '*.sqlite3-*'
          cp "$ASSETS/runtime/"*.tar.gz "$PKG/vendor/runtime/"
          cp "$ASSETS/runtime/SHA256SUMS" "$PKG/vendor/runtime/SHA256SUMS"
          cp "$ASSETS/wheels/"*.whl "$PKG/vendor/wheels/"
          cp "$ASSETS/wheels/SHA256SUMS" "$PKG/vendor/wheels/SHA256SUMS"

          chmod +x \
            "$PKG/AUTO_TRADE_MAC.command" \
            "$PKG/ABRIR_AUTO_TRADE.command" \
            "$PKG/ABRIR_PRIMER_CANARY_PAPER.command" \
            "$PKG/ABRIR_PRIMER_CANARY_PREPARAR.command" \
            "$PKG/ABRIR_PRIMER_CANARY_REAL_PAPER.command" \
            "$PKG/INSTALAR_AUTO_TRADE.command"
          chmod +x "$PKG/scripts/mac_bootstrap.sh" "$PKG/scripts/mac_rehearsal.sh" "$PKG/scripts/mac_start.sh"

          cat > "$PKG/MAC_STANDALONE_MANIFEST.txt" <<EOF
          AUTO-TRADE R6 MAC FIRST CANARY PAPER/STANDALONE
          manifest_version=1
          source_head=${SOURCE_SHA}
          python_version=3.12.13
          python_build_release=20260718
          supported_architectures=arm64,x86_64
          runtime_arm64_sha256=62aeee6161d57303a71a138b75fd5cc6fb8c89c4b1d9c7f0a052d89fa0b6652b
          runtime_x86_64_sha256=10b47148de86f9d87ba6e96a3db606ced90a206a3454d7d6d8fa68536a05d81f
          offline_wheelhouse=YES
          generic_control_center_write=DISABLED
          preparation_surface=RESTART_SAFE_NO_POST
          real_paper_surface=SEPARATE_EXACT_ONE_SHOT
          max_notional_usd=5
          retry_post=NO
          live_trading=BLOCKED
          EOF

          cat > "$PKG/MAC_FIRST_CANARY_REAL_PAPER_MANIFEST.txt" <<EOF
          AUTO-TRADE R6 FIRST BTC/USD PAPER CANARY
          source_head=${SOURCE_SHA}
          environment=PAPER
          symbol=BTC/USD
          side=BUY
          order_type=LIMIT
          time_in_force=IOC
          hard_max_notional_usd=5
          restart_safe_preparation=REQUIRED
          fresh_human_approval=REQUIRED
          second_exact_post_consent=REQUIRED
          consent_ttl_seconds=10
          final_get_evidence_ttl_seconds=5
          generic_external_write_env=DISABLED
          audited_https_delegate=REQUIRED
          durable_unknown_before_post=REQUIRED
          post_retry=FORBIDDEN
          ambiguous_recovery=GET_ONLY
          credentials_persisted=NO
          live_trading=BLOCKED
          ci_real_broker_post=FORBIDDEN
          EOF

          cat > "$PKG/MAC_BUILD_INFO.txt" <<EOF
          AUTO-TRADE R6 MAC FIRST CANARY PAPER PACKAGE
          source_head=${SOURCE_SHA}
          branch=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
          python_runtime=EMBEDDED_DUAL_ARCH_3.12.13
          offline_install=YES
          installed_home=HOME/Applications/AUTO-TRADE-R6
          downloaded_bundle_runtime_execution=DENIED
          finder_quarantine_relocation=REQUIRED
          homebrew_required=NO
          system_python_required=NO
          pypi_required_at_first_launch=NO
          generic_control_center=NO_POST
          first_canary_prepare=RESTART_SAFE_NO_POST
          first_canary_real_paper=EXACT_ONE_SHOT_SEPARATE_GATE
          broker_credentials_in_package=NO
          external_order_submitted_by_build=NO
          live_trading=BLOCKED
          EOF

          ditto -c -k --sequesterRsrc --keepParent "$PKG" "$ZIP"
          (cd dist && shasum -a 256 AUTO-TRADE-R6-MAC-FIRST-CANARY-PAPER.zip > AUTO-TRADE-R6-MAC-FIRST-CANARY-PAPER.zip.sha256)
          SIZE_BYTES="$(stat -f%z "$ZIP")"
          echo "first_canary_zip_size_bytes=${SIZE_BYTES}"
          test "$SIZE_BYTES" -ge 40000000

      - name: Verify package and execution separation
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SOURCE_SHA="$(git rev-parse HEAD)"
          cd dist
          shasum -a 256 -c AUTO-TRADE-R6-MAC-FIRST-CANARY-PAPER.zip.sha256
          ZIP=AUTO-TRADE-R6-MAC-FIRST-CANARY-PAPER.zip
          ROOT=AUTO-TRADE-R6-MAC-FIRST-CANARY-PAPER
          for item in \
            MAC_STANDALONE_MANIFEST.txt MAC_FIRST_CANARY_REAL_PAPER_MANIFEST.txt MAC_BUILD_INFO.txt \
            ABRIR_PRIMER_CANARY_PREPARAR.command ABRIR_PRIMER_CANARY_REAL_PAPER.command \
            scripts/mac_first_canary_restart_safe_dashboard.py \
            scripts/mac_first_canary_real_paper_dashboard.py \
            scripts/mac_crypto_first_canary_execute_real_paper.py \
            web/mac_first_canary_real_paper.html; do
            unzip -l "$ZIP" | grep -Fq "$ROOT/$item"
          done
          unzip -p "$ZIP" "$ROOT/MAC_BUILD_INFO.txt" > /tmp/first-canary-build-info.txt
          grep -Fq "source_head=${EXPECTED_SOURCE_SHA}" /tmp/first-canary-build-info.txt
          unzip -p "$ZIP" "$ROOT/MAC_FIRST_CANARY_REAL_PAPER_MANIFEST.txt" > /tmp/first-canary-manifest.txt
          grep -Fq 'environment=PAPER' /tmp/first-canary-manifest.txt
          grep -Fq 'hard_max_notional_usd=5' /tmp/first-canary-manifest.txt
          grep -Fq 'post_retry=FORBIDDEN' /tmp/first-canary-manifest.txt
          grep -Fq 'ambiguous_recovery=GET_ONLY' /tmp/first-canary-manifest.txt
          grep -Fq 'live_trading=BLOCKED' /tmp/first-canary-manifest.txt
          grep -Fq 'ci_real_broker_post=FORBIDDEN' /tmp/first-canary-manifest.txt
          if unzip -l "$ZIP" | grep -Eq '(^|/)(\.env|\.venv|\.runtime)(/|$)'; then
            echo 'ERROR: package contains operational environment material' >&2
            exit 1
          fi
          unzip -p "$ZIP" "$ROOT/ABRIR_PRIMER_CANARY_PREPARAR.command" > /tmp/prepare.command
          unzip -p "$ZIP" "$ROOT/ABRIR_PRIMER_CANARY_REAL_PAPER.command" > /tmp/execute.command
          grep -Fq 'R6_EXTERNAL_PAPER_WRITE=DISABLED' /tmp/prepare.command
          grep -Fq 'Esta pantalla NO puede enviar órdenes.' /tmp/prepare.command
          grep -Fq 'R6_EXTERNAL_PAPER_WRITE=DISABLED' /tmp/execute.command
          grep -Fq 'Puede enviar UNA orden BTC/USD PAPER' /tmp/execute.command
          ! grep -Fq 'APCA_API_SECRET_KEY=' /tmp/prepare.command
          ! grep -Fq 'APCA_API_SECRET_KEY=' /tmp/execute.command

      - name: Upload candidate for dual-arch boot tests
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-TRADE-R6-MAC-FIRST-CANARY-PAPER-CANDIDATE
          path: |
            dist/AUTO-TRADE-R6-MAC-FIRST-CANARY-PAPER.zip
            dist/AUTO-TRADE-R6-MAC-FIRST-CANARY-PAPER.zip.sha256
          if-no-files-found: error
          retention-days: 3

  boot-test:
    needs: build-universal
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      PIP_NO_INDEX: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONUNBUFFERED: '1'
      R6_EXTERNAL_PAPER_WRITE: DISABLED
    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v5
        with:
          name: AUTO-TRADE-R6-MAC-FIRST-CANARY-PAPER-CANDIDATE
          path: candidate

      - name: Simulate Safari Finder quarantine
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          shasum -a 256 -c AUTO-TRADE-R6-MAC-FIRST-CANARY-PAPER.zip.sha256
          test "$(uname -m)" = '${{ matrix.arch }}'
          QTN_VALUE="0083;$(printf '%x' "$(date +%s)");Safari;AUTO-TRADE-R6-MAC-FIRST-CANARY-PAPER.zip"
          xattr -w com.apple.quarantine "$QTN_VALUE" AUTO-TRADE-R6-MAC-FIRST-CANARY-PAPER.zip
          ditto -x -k AUTO-TRADE-R6-MAC-FIRST-CANARY-PAPER.zip .
          SOURCE="$PWD/AUTO-TRADE-R6-MAC-FIRST-CANARY-PAPER"
          while IFS= read -r -d '' item; do xattr -w com.apple.quarantine "$QTN_VALUE" "$item" 2>/dev/null || true; done < <(find "$SOURCE" -print0)
          test -x "$SOURCE/ABRIR_PRIMER_CANARY_PREPARAR.command"
          test -x "$SOURCE/ABRIR_PRIMER_CANARY_REAL_PAPER.command"
          test -x "$SOURCE/INSTALAR_AUTO_TRADE.command"

      - name: Install from quarantined package with no broker credentials
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$PWD/candidate/AUTO-TRADE-R6-MAC-FIRST-CANARY-PAPER"
          INSTALL_ROOT="$HOME/Applications/AUTO-TRADE-R6"
          rm -rf "$INSTALL_ROOT"
          unset APCA_API_KEY_ID APCA_API_SECRET_KEY || true
          export PIP_INDEX_URL='http://127.0.0.1:9/forbidden'
          export PIP_EXTRA_INDEX_URL='http://127.0.0.1:9/forbidden'
          cd "$SOURCE"
          bash INSTALAR_AUTO_TRADE.command | tee /tmp/autotrade-first-canary-install.log
          grep -Fq 'AUTO-TRADE R6 INSTALL: OK' /tmp/autotrade-first-canary-install.log
          grep -Fq "install_root=$INSTALL_ROOT" /tmp/autotrade-first-canary-install.log
          test -x "$INSTALL_ROOT/.runtime/${{ matrix.arch }}/python/bin/python3"
          test -x "$INSTALL_ROOT/.venv/bin/python"
          test -x "$INSTALL_ROOT/ABRIR_PRIMER_CANARY_PREPARAR.command"
          test -x "$INSTALL_ROOT/ABRIR_PRIMER_CANARY_REAL_PAPER.command"
          cd "$INSTALL_ROOT"
          .venv/bin/python scripts/check_r6_first_canary_restart_safe_dashboard.py
          .venv/bin/python scripts/check_r6_first_canary_real_paper_delegate.py
          .venv/bin/python scripts/check_r6_first_canary_real_paper_dashboard.py
          .venv/bin/python scripts/check_r6_first_canary_mac_dashboard.py
          .venv/bin/python scripts/check_r6_live_deny_boundary.py
          .venv/bin/pytest -q tests/test_r6_first_canary_external_post_consent.py tests/test_r6_first_canary_real_paper_execution.py

      - name: Restart-safe preparation localhost smoke without POST
        shell: bash
        run: |
          set -euo pipefail
          INSTALL_ROOT="$HOME/Applications/AUTO-TRADE-R6"
          cd "$INSTALL_ROOT"
          unset APCA_API_KEY_ID APCA_API_SECRET_KEY || true
          export R6_EXTERNAL_PAPER_WRITE=DISABLED
          .venv/bin/python scripts/mac_first_canary_restart_safe_dashboard.py --no-browser --port 18768 > /tmp/restart-safe-dashboard.log 2>&1 &
          PID=$!
          cleanup() { kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; }
          trap cleanup EXIT
          READY=0
          for _ in {1..40}; do
            if curl --fail --silent http://127.0.0.1:18768/api/meta > /tmp/restart-safe-meta.json; then READY=1; break; fi
            sleep 0.25
          done
          test "$READY" = 1
          grep -Fq '"real_execution_enabled":false' /tmp/restart-safe-meta.json
          grep -Fq '"generic_control_center_write_enabled":false' /tmp/restart-safe-meta.json
          grep -Fq '"live_trading":"BLOCKED"' /tmp/restart-safe-meta.json

      - name: Real PAPER execution-only localhost smoke without execute call
        shell: bash
        run: |
          set -euo pipefail
          INSTALL_ROOT="$HOME/Applications/AUTO-TRADE-R6"
          cd "$INSTALL_ROOT"
          unset APCA_API_KEY_ID APCA_API_SECRET_KEY || true
          export R6_EXTERNAL_PAPER_WRITE=DISABLED
          .venv/bin/python scripts/mac_first_canary_real_paper_dashboard.py --no-browser --port 18769 > /tmp/real-paper-dashboard.log 2>&1 &
          PID=$!
          cleanup() { kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; }
          trap cleanup EXIT
          READY=0
          for _ in {1..40}; do
            if curl --fail --silent http://127.0.0.1:18769/api/meta > /tmp/real-paper-meta.json; then READY=1; break; fi
            sleep 0.25
          done
          test "$READY" = 1
          grep -Fq '"real_execution_enabled":true' /tmp/real-paper-meta.json
          grep -Fq '"one_shot_only":true' /tmp/real-paper-meta.json
          grep -Fq '"generic_control_center_write_enabled":false' /tmp/real-paper-meta.json
          grep -Fq '"retry_post":false' /tmp/real-paper-meta.json
          grep -Fq '"live_trading":"BLOCKED"' /tmp/real-paper-meta.json
          test -z "${APCA_API_KEY_ID:-}"
          test -z "${APCA_API_SECRET_KEY:-}"
          echo 'real_paper_execute_endpoint_called_by_ci=NO'

      - name: Delete downloaded source and prove installed self-heal
        shell: bash
        run: |
          set -euo pipefail
          INSTALL_ROOT="$HOME/Applications/AUTO-TRADE-R6"
          rm -rf candidate/AUTO-TRADE-R6-MAC-FIRST-CANARY-PAPER
          cd "$INSTALL_ROOT"
          rm -rf .runtime .venv
          bash INSTALAR_AUTO_TRADE.command | tee /tmp/autotrade-first-canary-reinstall.log
          grep -Fq 'AUTO-TRADE R6 INSTALL: OK' /tmp/autotrade-first-canary-reinstall.log
          grep -Fq 'standalone_install_relocated=NO' /tmp/autotrade-first-canary-reinstall.log
          test -x ".runtime/${{ matrix.arch }}/python/bin/python3"
          .venv/bin/python scripts/check_r6_first_canary_real_paper_dashboard.py
          echo 'installed_first_canary_copy_self_heal=PASS'

  publish:
    needs: [build-universal, boot-test]
    runs-on: ubuntu-24.04
    steps:
      - name: Download exact certified candidate
        uses: actions/download-artifact@v5
        with:
          name: AUTO-TRADE-R6-MAC-FIRST-CANARY-PAPER-CANDIDATE
          path: release

      - name: Recheck checksum and size
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c AUTO-TRADE-R6-MAC-FIRST-CANARY-PAPER.zip.sha256
          SIZE_BYTES="$(stat -c%s AUTO-TRADE-R6-MAC-FIRST-CANARY-PAPER.zip)"
          echo "certified_first_canary_zip_size_bytes=${SIZE_BYTES}"
          test "$SIZE_BYTES" -ge 40000000

      - name: Upload certified first-canary PAPER artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-TRADE-R6-MAC-FIRST-CANARY-PAPER
          path: |
            release/AUTO-TRADE-R6-MAC-FIRST-CANARY-PAPER.zip
            release/AUTO-TRADE-R6-MAC-FIRST-CANARY-PAPER.zip.sha256
          if-no-files-found: error
          retention-days: 14
