name: OSS-3D2V Real Canonical Campaign 2026-09-08

on:
  push:
    branches:
      - research/oss3d2v-real-campaign-run-20260908

permissions:
  contents: read

jobs:
  real-canonical-campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      D2V_CERTIFIED_COMMIT: 3d76961e857469013f173c6c9f09f4d515923f24
    steps:
      - name: Checkout exact certified D2V code
        uses: actions/checkout@v5
        with:
          ref: 3d76961e857469013f173c6c9f09f4d515923f24

      - name: Prove exact certified code checkout
        run: |
          test "$(git rev-parse HEAD)" = "$D2V_CERTIFIED_COMMIT"
          echo "certified D2V code: $D2V_CERTIFIED_COMMIT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install AUTO-TRADE core only
        run: python -m pip install -e '.[dev]'

      - name: Prove Qlib absent
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('qlib') is None
          print('qlib runtime: ABSENT')
          PY

      - name: Execute exact 108-descriptor public GET campaign
        run: |
          EVIDENCE_ROOT="${RUNNER_TEMP}/oss3d2v-evidence"
          mkdir -p "$EVIDENCE_ROOT"
          python scripts/run_oss3d2v_real_acquisition.py \
            --evidence-root "$EVIDENCE_ROOT" \
            --execute-public-get \
            | tee "${RUNNER_TEMP}/d2v-real-result.json"

      - name: Validate complete real campaign result
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'd2v-real-result.json').read_text())
          assert result['descriptor_count'] == 108
          assert result['acquired_from_network'] == 108
          assert result['reused_after_seal_reverification'] == 0
          assert result['reconciled_unsealed_final_material'] == 0
          assert result['missing_without_network_authority'] == 0
          assert result['complete'] is True
          assert len(result['campaign_seal_fingerprint']) == 64
          assert result['final_holdout_values_loaded'] is False
          assert result['capital_authority'] == 'NONE'
          assert result['live_trading'] == 'BLOCKED'
          print('real campaign first pass: COMPLETE')
          PY

      - name: Re-run entire campaign offline with zero GET authority
        run: |
          EVIDENCE_ROOT="${RUNNER_TEMP}/oss3d2v-evidence"
          python scripts/run_oss3d2v_real_acquisition.py \
            --evidence-root "$EVIDENCE_ROOT" \
            | tee "${RUNNER_TEMP}/d2v-offline-reverify-result.json"

      - name: Validate offline full reverification and same seal
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          first = json.loads((root / 'd2v-real-result.json').read_text())
          second = json.loads((root / 'd2v-offline-reverify-result.json').read_text())
          assert second['descriptor_count'] == 108
          assert second['acquired_from_network'] == 0
          assert second['reused_after_seal_reverification'] == 108
          assert second['reconciled_unsealed_final_material'] == 0
          assert second['missing_without_network_authority'] == 0
          assert second['complete'] is True
          assert second['campaign_seal_fingerprint'] == first['campaign_seal_fingerprint']
          assert second['d2u_partition_material_fingerprint'] == first['d2u_partition_material_fingerprint']
          assert second['training_universe_hash'] == first['training_universe_hash']
          assert second['development_universe_hash'] == first['development_universe_hash']
          assert second['final_holdout_values_loaded'] is False
          assert second['capital_authority'] == 'NONE'
          assert second['live_trading'] == 'BLOCKED'
          print('offline 108-descriptor reverification: PASS')
          PY

      - name: Build evidence inventory
        run: |
          python - <<'PY'
          from hashlib import sha256
          import json
          import os
          from pathlib import Path
          runner_temp = Path(os.environ['RUNNER_TEMP'])
          root = runner_temp / 'oss3d2v-evidence'
          entries = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              raw = path.read_bytes()
              entries.append({
                  'path': path.relative_to(root).as_posix(),
                  'bytes': len(raw),
                  'sha256': sha256(raw).hexdigest(),
              })
          payload = {
              'inventory_version': 'OSS3D2V_REAL_CAMPAIGN_EVIDENCE_INVENTORY_V1',
              'certified_code_commit': os.environ['D2V_CERTIFIED_COMMIT'],
              'file_count': len(entries),
              'files': entries,
          }
          inventory = runner_temp / 'd2v-evidence-inventory.json'
          inventory.write_text(json.dumps(payload, sort_keys=True, separators=(',', ':')) + '\n')
          print(f"evidence files: {len(entries)}")
          PY

      - name: Archive exact local evidence
        run: |
          EVIDENCE_ROOT="${RUNNER_TEMP}/oss3d2v-evidence"
          tar -C "$(dirname "$EVIDENCE_ROOT")" \
            -czf "${RUNNER_TEMP}/oss3d2v-real-evidence-20260908.tar.gz" \
            "$(basename "$EVIDENCE_ROOT")"
          sha256sum "${RUNNER_TEMP}/oss3d2v-real-evidence-20260908.tar.gz" \
            | tee "${RUNNER_TEMP}/oss3d2v-real-evidence-20260908.tar.gz.sha256"

      - name: Upload real D2V campaign evidence
        uses: actions/upload-artifact@v4
        with:
          name: oss3d2v-real-campaign-20260908
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            ${{ runner.temp }}/d2v-real-result.json
            ${{ runner.temp }}/d2v-offline-reverify-result.json
            ${{ runner.temp }}/d2v-evidence-inventory.json
            ${{ runner.temp }}/oss3d2v-real-evidence-20260908.tar.gz
            ${{ runner.temp }}/oss3d2v-real-evidence-20260908.tar.gz.sha256

      - name: Final authority proof
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('qlib') is None
          print('D2V real campaign authority: PUBLIC HISTORICAL GET ONLY')
          print('FINAL_HOLDOUT: NOT LOADED')
          print('PAPER/CAPITAL/LIVE: NOT AUTHORIZED')
          PY
