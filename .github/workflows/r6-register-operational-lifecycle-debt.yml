name: R6 Register Operational Lifecycle Debt

on:
  push:
    branches: ["reconstruction/r6-external-paper-protection"]

permissions:
  contents: write

jobs:
  register:
    if: github.event.head_commit.message == 'chore(r6) register TD-R6-013 before operational harness implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Register debt canonically
        run: python scripts/r6_register_operational_lifecycle_debt.py
      - name: Validate debt and knowledge contracts
        run: |
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Publish debt registration and self-clean
        run: |
          git config user.name arendon7
          git config user.email 102555888+arendon7@users.noreply.github.com
          git rm -f scripts/r6_register_operational_lifecycle_debt.py .github/workflows/r6-register-operational-lifecycle-debt.yml
          git add knowledge/00_CANON/debt_register.json knowledge/00_CANON/DEBT_REGISTER.md knowledge/00_CANON/TAREA_ACTIVA.md
          git commit -m "docs(r6): register TD-R6-013 operational lifecycle debt"
          git push origin HEAD:reconstruction/r6-external-paper-protection
