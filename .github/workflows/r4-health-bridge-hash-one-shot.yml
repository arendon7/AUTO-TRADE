name: R4 Health Bridge Hash Hardening

on:
  push:
    branches:
      - reconstruction/r4-portfolio-health
    paths:
      - .github/workflows/r4-health-bridge-hash-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r4-portfolio-health
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/r4_patch_health_bridge_raw_hash.py
      - run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_r4_health_bridge.py
      - run: |
          git config user.name "arendon7"
          git config user.email "102555888+arendon7@users.noreply.github.com"
          git add src/autotrade/health_bridge.py
          git commit -m "fix(r4): verify health bridge raw row commitment first"
          git push origin HEAD:reconstruction/r4-portfolio-health
