name: R6 Complete Pre-Submit PAPER Phase Certification

on:
  push:
    branches:
      - reconstruction/r6-external-paper-protection
    paths:
      - .github/workflows/r6-phase1-pre-submit-cert-one-shot.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install exact runtime
        run: python -m pip install -e '.[dev]'
      - name: Full compile regression and coverage
        run: |
          python -m compileall -q src tests scripts
          pytest --cov=autotrade --cov-report=term-missing --cov-report=json:r6-phase1-coverage.json --junitxml=r6-phase1.xml
      - name: All permanent authority/canon gates
        run: |
          python scripts/check_contract_registry.py
          python scripts/check_research_authority.py
          python scripts/check_r5_authority.py
          python scripts/check_r6_authority.py
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Prove temporary patch infrastructure absent
        run: |
          test ! -e scripts/r6_patch_submission_guard.py
          test ! -e scripts/r6_patch_canary_permit_init.py
          test ! -e scripts/r6_patch_canary_permit_tests.py
          test ! -e .github/workflows/r6-patch-submission-guard-one-shot.yml
          test ! -e .github/workflows/r6-canary-permit-patch-one-shot.yml
          test ! -e .github/workflows/r6-reconciliation-milestone-one-shot.yml
      - name: Write permanent phase evidence
        env:
          OUT: knowledge/60_EVIDENCE/R6_PRE_SUBMIT_PHASE_CERTIFICATION.json
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          coverage = json.loads(Path('r6-phase1-coverage.json').read_text())
          root = ET.parse('r6-phase1.xml').getroot()
          tests = int(root.attrib.get('tests', '0'))
          failures = int(root.attrib.get('failures', '0'))
          errors = int(root.attrib.get('errors', '0'))
          skipped = int(root.attrib.get('skipped', '0'))
          percent = float(coverage['totals']['percent_covered'])
          if failures or errors or percent < 85.0:
              raise SystemExit('R6 pre-submit phase cannot certify')

          payload = {
              'schema_version': 1,
              'track': 'R6',
              'phase': 'PRE_SUBMIT_PAPER_SAFETY',
              'status': 'PASS_PHASE_NOT_DEBT_CLOSURE',
              'source_head': os.environ['GITHUB_SHA'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'tests': {
                  'total': tests,
                  'failures': failures,
                  'errors': errors,
                  'skipped': skipped,
                  'coverage_percent': round(percent, 2),
                  'coverage_gate_percent': 85.0,
              },
              'certified_components': [
                  'disabled-by-default exact PAPER account attestation without order-write API',
                  'immutable client_order_id submission binding plus UNKNOWN-before-future-POST ambiguity barrier',
                  'append-only hash-chained submission state with anchored control head and restart verification',
                  'strict bounded first-canary preflight with fresh account/safety/reconciliation prerequisites',
                  'canonical us_equity BUY LIMIT bracket request with exact Instrument Master tick/step and no auto-upsize',
                  'nested broker response verification requiring exactly coherent take-profit and stop-loss legs',
                  'GET-only client_order_id and nested order reconciliation that never re-arms a 404 UNKNOWN state',
                  'durable one-shot canary permit ledger with expiry, single-attempt consumption and tamper-evident global head',
                  'permanent R6 authority checker still forbidding all external write calls and LIVE authority',
              ],
              'open_blocking_debt': [
                  'TD-R6-001','TD-R6-002','TD-R6-003','TD-R6-004',
                  'TD-R6-005','TD-R6-006','TD-R6-007','TD-R6-008'
              ],
              'next_required_before_any_real_paper_post': [
                  'single allowlisted disabled-by-default writer design bound to consumed permit and UNKNOWN transition',
                  'PAPER trade_updates protection evidence',
                  'terminality/fill/slippage/reconciliation qualification evidence',
                  'expanded permanent authority checker proving only the one audited PAPER writer may POST',
                  'separate bounded opt-in PAPER canary certification workflow',
              ],
              'external_paper_submit': 'DISABLED',
              'capital_authority': 'NONE',
              'profitability_claim': 'NONE',
              'live_trading': 'BLOCKED',
          }
          Path(os.environ['OUT']).write_text(json.dumps(payload, indent=2) + '\n')
          PY
      - name: Commit evidence and self-clean
        run: |
          rm -f r6-phase1-coverage.json r6-phase1.xml
          git config user.name "arendon7"
          git config user.email "102555888+arendon7@users.noreply.github.com"
          git add knowledge/60_EVIDENCE/R6_PRE_SUBMIT_PHASE_CERTIFICATION.json
          git rm -f .github/workflows/r6-phase1-pre-submit-cert-one-shot.yml
          git commit -m "docs(r6): certify complete pre-submit PAPER safety phase"
          git push origin HEAD:reconstruction/r6-external-paper-protection
