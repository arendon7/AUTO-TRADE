name: R6 Close Final Write Guard Debt

on:
  push:
    branches:
      - reconstruction/r6-external-paper-protection
    paths:
      - .github/workflows/r6-close-final-write-guard-debt.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Close only TD-R6-009 and update evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          register = Path('knowledge/00_CANON/debt_register.json')
          doc = json.loads(register.read_text(encoding='utf-8'))
          matches = [item for item in doc['items'] if item.get('id') == 'TD-R6-009']
          if len(matches) != 1:
              raise SystemExit('TD-R6-009 must exist exactly once')
          item = matches[0]
          if item.get('status') != 'OPEN':
              raise SystemExit(f'unexpected TD-R6-009 status: {item.get("status")}')
          item['status'] = 'CLOSED'
          item['evidence'] = [
              'src/autotrade/brokers/alpaca_paper_final_guard.py',
              'src/autotrade/brokers/alpaca_paper_writer.py',
              'src/autotrade/brokers/alpaca_paper_submission.py',
              'scripts/check_r6_authority.py',
              'tests/test_r6_final_write_guard.py',
              'tests/test_r6_final_guard_phase_chain.py',
              'tests/test_r6_paper_writer.py',
              'knowledge/60_EVIDENCE/R6_FINAL_WRITE_GUARD_EVIDENCE.json'
          ]
          item['resolution'] = (
              'Implemented no-network authoritative final-write guard with PRE_CONSUME and PRE_IO '
              're-reads of OMS, Safety/circuit, Portfolio reconciliation/broker-known state, Health and '
              'tamper-verified global submission state. PRE_IO is cryptographically chained to PRE_CONSUME, '
              'blocks intervening Safety/Portfolio version changes, occurs after request validation and '
              'immediately before the single audited PAPER transport write. Intervening worsening performs '
              'zero I/O and retains consumed permit + durable UNKNOWN for reconciliation only. Official '
              'pre-closure clean-head CI: Core 31506151261, Knowledge 31506151276, R6 Authority 31506151231.'
          )
          register.write_text(json.dumps(doc, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          human = Path('knowledge/00_CANON/DEBT_REGISTER.md')
          text = human.read_text(encoding='utf-8')
          old_row = '| `TD-R6-009` | P1 | final write Safety/OMS recheck | authoritative just-in-time re-read immediately before permit consumption/POST; any intervening worsening blocks |\n'
          new_row = '| `TD-R6-009` | P1 | final write Safety/OMS recheck | **CLOSED** — dual authoritative PRE_CONSUME/PRE_IO recheck, cryptographic phase chain, version-race rejection, zero-I/O fail-closed |\n'
          if old_row not in text:
              raise SystemExit('human TD-R6-009 row missing')
          text = text.replace(old_row, new_row, 1)
          if 'R6 P0/P1/P2 OPEN: **9**.' not in text:
              raise SystemExit('R6 open-count marker missing')
          text = text.replace('R6 P0/P1/P2 OPEN: **9**.', 'R6 P0/P1/P2 OPEN: **8**.', 1)
          human.write_text(text, encoding='utf-8')

          evidence = Path('knowledge/60_EVIDENCE/R6_FINAL_WRITE_GUARD_EVIDENCE.json')
          ev = json.loads(evidence.read_text(encoding='utf-8'))
          ev['status'] = 'CLOSED_AFTER_OFFICIAL_CLEAN_HEAD_CI'
          ev['official_clean_head_ci'] = {
              'head_sha': 'c65e8b0c5fe43f8657a93673e5ea431d3ef2b69a',
              'core_safety_run_id': 31506151261,
              'knowledge_contract_run_id': 31506151276,
              'r6_authority_run_id': 31506151231,
              'result': 'PASS'
          }
          ev['next_gate'] = 'Post-closure exact-head CI must remain green; TD-R6-001..008 remain OPEN.'
          evidence.write_text(json.dumps(ev, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Re-certify closure working tree
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q src tests scripts
          pytest --cov=autotrade --cov-report=term-missing
          python scripts/check_contract_registry.py
          python scripts/check_research_authority.py
          python scripts/check_r5_authority.py
          python scripts/check_r6_authority.py
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Commit closure and self-clean
        run: |
          git config user.name arendon7
          git config user.email 102555888+arendon7@users.noreply.github.com
          git add knowledge/00_CANON/debt_register.json \
                  knowledge/00_CANON/DEBT_REGISTER.md \
                  knowledge/60_EVIDENCE/R6_FINAL_WRITE_GUARD_EVIDENCE.json
          git rm .github/workflows/r6-close-final-write-guard-debt.yml
          test -z "$(git ls-files '.github/workflows/r6-*-one-shot.yml' '.github/workflows/r6-close-final-write-guard-debt.yml')"
          git commit -m "docs(r6): close TD-R6-009 final write guard debt"
          git push origin HEAD:reconstruction/r6-external-paper-protection
