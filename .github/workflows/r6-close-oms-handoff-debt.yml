name: R6 Close OMS External Handoff Debt

on:
  push:
    branches: ["reconstruction/r6-external-paper-protection"]

permissions:
  contents: write

jobs:
  close:
    if: github.event.head_commit.message == 'chore(r6) close TD-R6-010 after exact-head CI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply canonical closure
        run: python scripts/r6_close_oms_handoff_debt.py
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Re-certify TD-R6-010 closure working tree
        run: |
          python -m compileall -q src tests scripts
          pytest -q tests/test_r6_oms_external_handoff.py tests/test_r6_paper_writer.py tests/test_r6_oms_handoff_boundary.py
          pytest --cov=autotrade --cov-report=term-missing
          python scripts/check_contract_registry.py
          python scripts/check_research_authority.py
          python scripts/check_r5_authority.py
          python scripts/check_r6_authority.py
          python scripts/check_r6_live_deny_boundary.py
          python scripts/check_r6_oms_handoff_boundary.py
          python scripts/check_r6_product_boundary.py
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Publish canonical closure after all gates pass
        run: |
          git config user.name arendon7
          git config user.email 102555888+arendon7@users.noreply.github.com
          git rm -f scripts/r6_close_oms_handoff_debt.py knowledge/60_EVIDENCE/R6_OMS_HANDOFF_CLOSURE_TRIGGER.json
          git add knowledge/00_CANON/debt_register.json knowledge/00_CANON/DEBT_REGISTER.md knowledge/00_CANON/TAREA_ACTIVA.md knowledge/60_EVIDENCE/R6_OMS_EXTERNAL_HANDOFF_EVIDENCE.json
          git commit -m "docs(r6): close TD-R6-010 OMS external handoff debt"
          git push origin HEAD:reconstruction/r6-external-paper-protection
