name: R3 Bounded Real-Data Campaign One-Shot

on:
  push:
    branches: ["reconstruction/r3-real-data-governance"]
    paths: [".r3campaign/TRIGGER"]

permissions:
  contents: write

jobs:
  bounded-public-data-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact R3 branch
        uses: actions/checkout@v5
        with:
          ref: reconstruction/r3-real-data-governance
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install core without credentials
        run: python -m pip install -e .

      - name: Run bounded read-only campaign
        env:
          AUTOTRADE_ENABLE_R3_REAL_DATA: "1"
        run: python scripts/run_r3_real_data_campaign.py

      - name: Verify immutable evidence roundtrip
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from autotrade.research.external_data import ExternalDatasetArtifact

          root = Path("knowledge/60_EVIDENCE")
          artifact = root / "R3_REAL_DATA_BTCUSDT_1M_20260101.json"
          evidence = root / "R3_REAL_DATA_CAMPAIGN.json"
          restored = ExternalDatasetArtifact.read(artifact)
          doc = json.loads(evidence.read_text(encoding="utf-8"))
          assert doc["bars"] == 10
          assert doc["independent_fetches_equal"] is True
          assert doc["artifact_roundtrip_verified"] is True
          assert doc["api_keys_used"] is False
          assert doc["trading_endpoints_used"] is False
          assert doc["execution_authority"] == "NONE"
          assert doc["live_trading"] == "BLOCKED"
          assert doc["dataset_hash"] == restored.dataset.dataset_hash
          assert doc["manifest_fingerprint"] == restored.manifest.fingerprint
          print("R3 bounded real-data evidence: VERIFIED")
          PY

      - name: Re-run research authority gate
        run: python scripts/check_research_authority.py

      - name: Self-clean transient campaign trigger
        run: |
          rm -rf .r3campaign
          rm -f .github/workflows/r3-real-data-one-shot.yml

      - name: Commit evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "evidence(r3): freeze bounded real-data campaign"
          git push origin HEAD:reconstruction/r3-real-data-governance
