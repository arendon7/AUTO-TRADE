name: R4 Exact Robustness Normalization Repair

on:
  push:
    branches:
      - reconstruction/r4-portfolio-health
    paths:
      - .github/workflows/r4-fix-exact-normalization-one-shot.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r4-portfolio-health
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply exact normalization repair
        run: python scripts/r4_fix_exact_robustness_normalization.py
      - name: Targeted regression suite
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q src tests scripts
          pytest -q tests/test_r4_allocation_exact_normalization.py tests/test_r4_allocation_robustness.py tests/test_r4_portfolio_manager.py
      - name: Commit repair and self-clean
        run: |
          git config user.name "arendon7"
          git config user.email "102555888+arendon7@users.noreply.github.com"
          git add src/autotrade/research/allocation_robustness.py
          git rm -f scripts/r4_fix_exact_robustness_normalization.py
          git rm -f .github/workflows/r4-fix-exact-normalization-one-shot.yml
          git commit -m "fix(r4): enforce exact Decimal robustness normalization"
          git push origin HEAD:reconstruction/r4-portfolio-health
