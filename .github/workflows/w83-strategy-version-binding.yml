name: W83 Execution Strategy Version Binding

on:
  pull_request:
    paths:
      - "src/autotrade/strategy_execution_binding.py"
      - "src/autotrade/promotion_strategy_version_binding.py"
      - "tests/test_w83_execution_strategy_binding.py"
      - "tests/test_w83_promotion_strategy_version_resolution.py"
      - "scripts/check_w83_strategy_version_binding_boundary.py"
      - ".github/workflows/w83-strategy-version-binding.yml"
      - ".github/workflows/core-tests.yml"
      - "knowledge/00_CANON/**"
      - "knowledge/30_DECISIONES/**"
      - "knowledge/40_HANDOFF/**"

permissions:
  contents: read

jobs:
  strategy-version-binding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile W83 surface
        run: python -m compileall -q src/autotrade/strategy_execution_binding.py src/autotrade/promotion_strategy_version_binding.py tests/test_w83_execution_strategy_binding.py tests/test_w83_promotion_strategy_version_resolution.py scripts/check_w83_strategy_version_binding_boundary.py
      - name: W83 strategy-version binding boundary
        run: python scripts/check_w83_strategy_version_binding_boundary.py
      - name: W83 strategy-version binding tests
        run: pytest -q tests/test_w83_execution_strategy_binding.py tests/test_w83_promotion_strategy_version_resolution.py
      - name: Re-prove W82 fee accounting boundary
        run: python scripts/check_w82_fee_accounting_boundary.py
      - name: Re-prove W82 candidate fee resolution boundary
        run: python scripts/check_w82_promotion_fee_accounting_boundary.py
      - name: Re-prove W81 execution cost continuity
        run: python scripts/check_w81_execution_cost_continuity_boundary.py
      - name: Re-prove W81 candidate continuity resolution
        run: python scripts/check_w81_promotion_cost_continuity_boundary.py
      - name: Re-prove W80 assessment boundary
        run: python scripts/check_w80_promotion_assessment_boundary.py
      - name: Re-prove W79 promotion boundary
        run: python scripts/check_w79_strategy_promotion_boundary.py
      - name: Re-prove W78 execution boundary
        run: python scripts/check_w78_paper_execution_boundary.py
      - name: Re-prove research authority boundary
        run: python scripts/check_research_authority.py
