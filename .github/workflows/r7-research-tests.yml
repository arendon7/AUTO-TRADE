name: R7 Research Tests

on:
  push:
    branches: ["feature/r7-strategy-foundation"]
    paths:
      - ".github/workflows/r7-research-tests.yml"
      - "src/autotrade/research/autopilot.py"
      - "src/autotrade/research/cross_market_policy.py"
      - "src/autotrade/research/experiment_b.py"
      - "src/autotrade/research/experiment_c.py"
      - "src/autotrade/research/robustness.py"
      - "src/autotrade/research/regime_stability.py"
      - "src/autotrade/research/statistical_diagnostics.py"
      - "src/autotrade/research/strategy_catalog.py"
      - "src/autotrade/research/strategy_library.py"
      - "src/autotrade/research/strategy_space.py"
      - "scripts/run_r7_experiment_b.py"
      - "tests/test_research_autopilot.py"
      - "tests/test_research_cross_market_policy.py"
      - "tests/test_research_experiment_b.py"
      - "tests/test_research_experiment_c.py"
      - "tests/test_research_robustness.py"
      - "tests/test_research_regime_stability.py"
      - "tests/test_research_statistical_diagnostics.py"
      - "tests/test_research_statistical_gate.py"
      - "tests/test_research_strategy_catalog.py"
      - "tests/test_research_strategy_library.py"
      - "tests/test_research_strategy_space.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r7-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Compile R7 research modules
        run: |
          python -m py_compile \
            src/autotrade/research/autopilot.py \
            src/autotrade/research/cross_market_policy.py \
            src/autotrade/research/experiment_b.py \
            src/autotrade/research/experiment_c.py \
            src/autotrade/research/robustness.py \
            src/autotrade/research/regime_stability.py \
            src/autotrade/research/statistical_diagnostics.py \
            src/autotrade/research/strategy_catalog.py \
            src/autotrade/research/strategy_library.py \
            src/autotrade/research/strategy_space.py \
            scripts/run_r7_experiment_b.py

      - name: R7 focused tests
        run: |
          pytest -q \
            tests/test_research_autopilot.py \
            tests/test_research_cross_market_policy.py \
            tests/test_research_experiment_b.py \
            tests/test_research_experiment_c.py \
            tests/test_research_robustness.py \
            tests/test_research_regime_stability.py \
            tests/test_research_statistical_diagnostics.py \
            tests/test_research_statistical_gate.py \
            tests/test_research_strategy_catalog.py \
            tests/test_research_strategy_library.py \
            tests/test_research_strategy_space.py

      - name: Print frozen Experiment C identities
        run: |
          python - <<'PY'
          from decimal import Decimal
          from autotrade.research.cross_market_policy import DEFAULT_EXPERIMENT_C_BREADTH_POLICY
          from autotrade.research.experiment_c import build_experiment_c_program

          print("breadth_policy", DEFAULT_EXPERIMENT_C_BREADTH_POLICY.fingerprint)
          for quantity in (Decimal("0.10"), Decimal("2"), Decimal("50")):
              program = build_experiment_c_program(quantity=quantity)
              assert program.candidate_count == 12
              print("quantity", quantity, "program_hash", program.canonical_hash)
          PY

      - name: Research authority boundary
        run: python scripts/check_research_authority.py
