name: R6 Pre-Submit PAPER Safety Milestone

on:
  push:
    branches:
      - reconstruction/r6-external-paper-protection
    paths:
      - .github/workflows/r6-pre-submit-safety-milestone-one-shot.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install exact runtime
        run: python -m pip install -e '.[dev]'
      - name: Full regression and coverage
        run: |
          python -m compileall -q src tests scripts
          pytest --cov=autotrade --cov-report=term-missing --cov-report=json:r6-pre-submit-coverage.json --junitxml=r6-pre-submit.xml
      - name: Permanent authority and canon gates
        run: |
          python scripts/check_contract_registry.py
          python scripts/check_research_authority.py
          python scripts/check_r5_authority.py
          python scripts/check_r6_authority.py
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Prove no temporary patch infrastructure remains
        run: |
          test ! -e scripts/r6_patch_submission_guard.py
          test ! -e .github/workflows/r6-patch-submission-guard-one-shot.yml
          test ! -e .github/workflows/r6-ambiguity-cert-one-shot.yml
      - name: Write permanent pre-submit milestone evidence
        env:
          OUT: knowledge/60_EVIDENCE/R6_PRE_SUBMIT_SAFETY_MILESTONE.json
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          coverage = json.loads(Path('r6-pre-submit-coverage.json').read_text())
          root = ET.parse('r6-pre-submit.xml').getroot()
          tests = int(root.attrib.get('tests', '0'))
          failures = int(root.attrib.get('failures', '0'))
          errors = int(root.attrib.get('errors', '0'))
          skipped = int(root.attrib.get('skipped', '0'))
          percent = float(coverage['totals']['percent_covered'])
          if failures or errors or percent < 85.0:
              raise SystemExit('cannot certify failing/undercovered pre-submit milestone')

          payload = {
              'schema_version': 1,
              'track': 'R6',
              'control': 'pre-submit external PAPER safety stack',
              'status': 'PASS_MILESTONE_NOT_DEBT_CLOSURE',
              'source_head': os.environ['GITHUB_SHA'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'tests': {
                  'total': tests,
                  'failures': failures,
                  'errors': errors,
                  'skipped': skipped,
                  'coverage_percent': round(percent, 2),
                  'coverage_gate_percent': 85.0,
              },
              'certified_components': [
                  'disabled-by-default exact Alpaca PAPER account attestation with no order-write API',
                  'durable deterministic client_order_id binding and UNKNOWN-before-future-POST ambiguity barrier',
                  'restart-safe append-only submission event chain with anchored control head',
                  'strict first-canary preflight with fresh PAPER attestation, exact R0-R5 prerequisite and tighter notional cap',
                  'canonical BUY LIMIT us_equity bracket payload with exact tick/step and no auto-upsize',
                  'nested broker bracket response validator requiring exactly one TP and one SL coherent leg',
                  'permanent R6 authority gate forbidding external write calls in the current phase and denying LIVE authority',
              ],
              'explicit_non_claims': [
                  'no real external PAPER POST exists or is authorized at this milestone',
                  'TD-R6-001 through TD-R6-008 remain OPEN',
                  'real client_order_id lookup reconciliation is not yet integrated',
                  'trade_updates and PAPER qualification remain unimplemented',
                  'this is not profitability evidence',
                  'LIVE trading remains blocked',
              ],
              'external_paper_submit': 'DISABLED',
              'capital_authority': 'NONE',
              'live_trading': 'BLOCKED',
          }
          Path(os.environ['OUT']).write_text(json.dumps(payload, indent=2) + '\n')
          PY
      - name: Commit evidence and self-clean
        run: |
          rm -f r6-pre-submit-coverage.json r6-pre-submit.xml
          git config user.name "arendon7"
          git config user.email "102555888+arendon7@users.noreply.github.com"
          git add knowledge/60_EVIDENCE/R6_PRE_SUBMIT_SAFETY_MILESTONE.json
          git rm -f .github/workflows/r6-pre-submit-safety-milestone-one-shot.yml
          git commit -m "docs(r6): certify pre-submit PAPER safety milestone"
          git push origin HEAD:reconstruction/r6-external-paper-protection
