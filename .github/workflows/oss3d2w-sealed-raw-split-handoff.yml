name: OSS-3D2W Sealed Raw Split Handoff

on:
  pull_request:
    branches:
      - research/oss3d2v-restart-safe-real-acquisition
    paths:
      - 'labs/oss3_qlib/sealed_raw_split_handoff.py'
      - 'labs/oss3_qlib/tests/test_sealed_raw_split_handoff.py'
      - 'scripts/check_oss3d2w_sealed_raw_split_handoff_boundary.py'
      - 'knowledge/20_RESEARCH/OSS3D2W_SEALED_RAW_SPLIT_HANDOFF.md'
      - '.github/workflows/oss3d2w-sealed-raw-split-handoff.yml'
      - 'labs/oss3_market_data/real_acquisition_campaign.py'
      - 'src/autotrade/research/oss3_market_collection.py'
      - 'labs/oss3_qlib/raw_training_bundle_provenance.py'
      - 'labs/oss3_qlib/raw_development_provenance.py'

permissions:
  contents: read

jobs:
  oss3d2w:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install AUTO-TRADE core only
        run: python -m pip install -e '.[dev]'

      - name: Prove Qlib is absent from D2W runtime
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('qlib') is None, 'D2W workflow must remain Qlib-free'
          print('qlib runtime: ABSENT')
          PY

      - name: Compile D2W sources
        run: |
          python -m py_compile \
            labs/oss3_qlib/sealed_raw_split_handoff.py \
            labs/oss3_qlib/tests/test_sealed_raw_split_handoff.py \
            scripts/check_oss3d2w_sealed_raw_split_handoff_boundary.py

      - name: D2W sealed raw split handoff boundary
        run: python scripts/check_oss3d2w_sealed_raw_split_handoff_boundary.py

      - name: D2W deterministic seal-to-D2R-D2S suite
        run: python -m pytest -q labs/oss3_qlib/tests/test_sealed_raw_split_handoff.py

      - name: Re-prove D2V restart-safe campaign
        run: |
          python scripts/check_oss3d2v_restart_safe_real_acquisition_boundary.py
          python -m pytest -q labs/oss3_market_data/tests/test_real_acquisition_campaign.py

      - name: Re-prove D2U collection and acquisition boundary
        run: python scripts/check_oss3d2u_historical_collection_acquisition_boundary.py

      - name: Re-prove D2R raw TRAIN provenance boundary
        run: python scripts/check_oss3d2r_raw_training_bundle_provenance_boundary.py

      - name: Re-prove D2S raw DEVELOPMENT provenance boundary
        run: python scripts/check_oss3d2s_raw_development_provenance_boundary.py

      - name: Research authority boundary
        run: python scripts/check_research_authority.py

      - name: Re-prove Qlib was never installed
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('qlib') is None, 'D2W unexpectedly gained Qlib runtime authority'
          print('qlib runtime after D2W certification: ABSENT')
          PY
