name: R6 Permit Issuance Hash One Shot

on:
  push:
    branches: ["reconstruction/r6-external-paper-protection"]

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message == 'chore(r6) certify immutable permit issuance hash'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply immutable permit issuance binding
        run: python scripts/r6_add_permit_issuance_hash_lookup.py
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused certification
        run: |
          python -m compileall -q src tests scripts
          pytest -q tests/test_r6_paper_canary_permit.py tests/test_r6_paper_canary_coordinator.py tests/test_r6_writer_same_attempt_resume.py
          python scripts/check_r6_canary_coordinator_boundary.py
          python scripts/check_r6_execution_bridge_boundary.py
          python scripts/check_r6_authority.py
      - name: Full certification
        run: |
          pytest --cov=autotrade --cov-report=term-missing
          python scripts/check_contract_registry.py
          python scripts/check_research_authority.py
          python scripts/check_r5_authority.py
          python scripts/check_r6_authority.py
          python scripts/check_r6_live_deny_boundary.py
          python scripts/check_r6_oms_handoff_boundary.py
          python scripts/check_r6_canary_coordinator_boundary.py
          python scripts/check_r6_operator_decision_boundary.py
          python scripts/check_r6_execution_bridge_boundary.py
          python scripts/check_r6_product_boundary.py
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Publish only after all gates pass
        run: |
          git config user.name arendon7
          git config user.email 102555888+arendon7@users.noreply.github.com
          git rm -f scripts/r6_add_permit_issuance_hash_lookup.py .github/workflows/r6-permit-issuance-hash-one-shot.yml
          git add src/autotrade/brokers/alpaca_paper_canary_permit.py tests/test_r6_paper_canary_permit.py scripts/r6_bind_writer_to_human_execution.py
          git commit -m "feat(r6): expose immutable verified canary permit issuance hash"
          git push origin HEAD:reconstruction/r6-external-paper-protection
