name: R6 Submission Ambiguity Guard Patch

on:
  push:
    branches:
      - reconstruction/r6-external-paper-protection
    paths:
      - .github/workflows/r6-patch-submission-guard-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply audited guard corrections
        run: python scripts/r6_patch_submission_guard.py
      - name: Install and certify targeted ambiguity semantics
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q src tests scripts
          pytest -q tests/test_r6_paper_submission_ambiguity.py tests/test_r6_alpaca_paper_attestation.py
          python scripts/check_contract_registry.py
          python scripts/check_research_authority.py
          python scripts/check_r5_authority.py
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Commit patch and self-clean
        run: |
          git config user.name "arendon7"
          git config user.email "102555888+arendon7@users.noreply.github.com"
          git add src/autotrade/brokers/alpaca_paper_submission.py
          git rm -f scripts/r6_patch_submission_guard.py
          git rm -f .github/workflows/r6-patch-submission-guard-one-shot.yml
          git commit -m "fix(r6): harden PAPER ambiguity state guards"
          git push origin HEAD:reconstruction/r6-external-paper-protection
