name: R6 Single-Shot PAPER Writer Guard

on:
  push:
    branches:
      - reconstruction/r6-external-paper-protection
    paths:
      - .github/workflows/r6-writer-guard-one-shot.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Clarify crash-recovery contract
        run: python scripts/r6_patch_writer_crash_comment.py
      - name: Install exact runtime
        run: python -m pip install -e '.[dev]'
      - name: Targeted writer and pre-submit regression
        run: |
          python -m compileall -q src tests scripts
          pytest -q \
            tests/test_r6_paper_writer.py \
            tests/test_r6_authority_checker.py \
            tests/test_r6_paper_canary_permit.py \
            tests/test_r6_paper_canary.py \
            tests/test_r6_paper_submission_ambiguity.py \
            tests/test_r6_paper_reconciliation.py \
            tests/test_r6_equity_bracket.py \
            tests/test_r6_alpaca_paper_attestation.py
          python scripts/check_r6_authority.py
          python scripts/check_contract_registry.py
          python scripts/check_research_authority.py
          python scripts/check_r5_authority.py
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Commit clarification and self-clean
        run: |
          git config user.name "arendon7"
          git config user.email "102555888+arendon7@users.noreply.github.com"
          git add src/autotrade/brokers/alpaca_paper_writer.py
          git rm -f scripts/r6_patch_writer_crash_comment.py
          git rm -f .github/workflows/r6-writer-guard-one-shot.yml
          git commit -m "test(r6): certify single-shot PAPER writer guard"
          git push origin HEAD:reconstruction/r6-external-paper-protection
