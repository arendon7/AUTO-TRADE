name: R6 Close PAPER-only Authority Debt

on:
  push:
    branches: ["reconstruction/r6-external-paper-protection"]

permissions:
  contents: write

jobs:
  close:
    if: github.event.head_commit.message == 'chore(r6): trigger certified TD-R6-008 closure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Close TD-R6-008 canonically
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          debt_path = Path('knowledge/00_CANON/debt_register.json')
          debt = json.loads(debt_path.read_text(encoding='utf-8'))
          matches = [item for item in debt['items'] if item['id'] == 'TD-R6-008']
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one TD-R6-008, found {len(matches)}')
          item = matches[0]
          if item['status'] != 'OPEN':
              raise SystemExit(f'TD-R6-008 must be OPEN before closure, found {item["status"]}')
          item['evidence'] = [
              'scripts/check_r6_live_deny_boundary.py',
              'scripts/check_r6_authority.py',
              'tests/test_r6_live_deny_boundary.py',
              'tests/test_r6_authority_checker.py',
              '.github/workflows/core-tests.yml',
              '.github/workflows/r6-authority.yml',
              'knowledge/60_EVIDENCE/R6_PAPER_ONLY_AUTHORITY_EVIDENCE.json',
          ]
          item['resolution'] = (
              'Permanent fail-closed R6 PAPER-only authority boundary scans every alpaca_paper_* production module. '
              'It permits only explicit LIVE deny constants, prevents LIVE URL construction, fixes HTTP Request methods '
              'and low-level I/O budgets, allows exactly one audited writer transport write, bounds trade_updates to one '
              'WSS connect plus auth/listen control frames, forbids OpenAI/Anthropic/autotrade.research authority imports, '
              'and forbids new LIVE promotion identifiers. Safety/OMS final-write and exact PAPER host/path anchors remain '
              'mandatory. Official implementation exact-head CI on 5a4f4730ef6ac242c52f925bb94ccdd0bd7eb5fc: '
              'Core 31513050038, Knowledge 31513049813, R6 Authority 31513049786 PASS; 966 tests / 85.89% coverage.'
          )
          item['status'] = 'CLOSED'
          debt_path.write_text(json.dumps(debt, indent=2) + '\n', encoding='utf-8')

          md_path = Path('knowledge/00_CANON/DEBT_REGISTER.md')
          md = md_path.read_text(encoding='utf-8')
          old = '| `TD-R6-008` | P1 | permanent PAPER-only authority boundary | CI prevents LIVE host, Safety/OMS bypass, AI authorization and PAPER→LIVE authority creep |'
          new = '| `TD-R6-008` | P1 | permanent PAPER-only authority boundary | **CLOSED** — dual permanent CI gates enforce exact PAPER-only network/write authority, LIVE-deny, Safety/OMS and AI/research separation |'
          if old not in md:
              raise SystemExit('TD-R6-008 human row anchor missing')
          md = md.replace(old, new, 1)
          if 'R6 P0/P1/P2 OPEN: **7**.' not in md:
              raise SystemExit('R6 open-count anchor missing')
          md = md.replace('R6 P0/P1/P2 OPEN: **7**.', 'R6 P0/P1/P2 OPEN: **6**.', 1)
          md_path.write_text(md, encoding='utf-8')

          evidence_path = Path('knowledge/60_EVIDENCE/R6_PAPER_ONLY_AUTHORITY_EVIDENCE.json')
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          if evidence.get('debt_id') != 'TD-R6-008':
              raise SystemExit('TD-R6-008 evidence identity mismatch')
          evidence['status'] = 'CLOSED_AFTER_OFFICIAL_EXACT_HEAD_CI'
          evidence['implementation_certification'] = {
              'head_sha': '5a4f4730ef6ac242c52f925bb94ccdd0bd7eb5fc',
              'tests_passed': 966,
              'coverage_percent': 85.89,
              'core_safety_run_id': 31513050038,
              'knowledge_contract_run_id': 31513049813,
              'r6_authority_run_id': 31513049786,
              'contract_registry': 'PASS',
              'research_authority': 'PASS',
              'r5_authority': 'PASS',
              'r6_authority': 'PASS',
              'r6_live_deny_boundary': 'PASS',
              'r6_product_boundary': 'PASS',
              'debt_register': 'PASS',
              'knowledge_contract': 'PASS'
          }
          evidence['next_gate'] = 'Post-closure exact-head CI must remain green; TD-R6-001..006 remain OPEN.'
          evidence_path.write_text(json.dumps(evidence, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Re-certify closure working tree
        run: |
          python -m compileall -q src tests scripts
          pytest -q tests/test_r6_authority_checker.py tests/test_r6_live_deny_boundary.py tests/test_r6_unsupported_products_boundary.py
          pytest --cov=autotrade --cov-report=term-missing
          python scripts/check_contract_registry.py
          python scripts/check_research_authority.py
          python scripts/check_r5_authority.py
          python scripts/check_r6_authority.py
          python scripts/check_r6_live_deny_boundary.py
          python scripts/check_r6_product_boundary.py
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Commit closure and remove helper atomically
        run: |
          git config user.name arendon7
          git config user.email 102555888+arendon7@users.noreply.github.com
          git rm .github/workflows/r6-close-paper-only-authority-debt.yml
          git add knowledge/00_CANON/debt_register.json knowledge/00_CANON/DEBT_REGISTER.md knowledge/60_EVIDENCE/R6_PAPER_ONLY_AUTHORITY_EVIDENCE.json
          git commit -m "docs(r6): close TD-R6-008 permanent PAPER-only authority debt"
          git push origin HEAD:reconstruction/r6-external-paper-protection
