name: W86 PAPER Runtime Market Truth

on:
  pull_request:
    paths:
      - "src/autotrade/paper_runtime_market_truth.py"
      - "src/autotrade/paper_runtime_asset_truth.py"
      - "src/autotrade/paper_runtime_broker_truth.py"
      - "src/autotrade/paper_runtime_candidate_identity.py"
      - "src/autotrade/brokers/alpaca_paper_crypto_market_data.py"
      - "src/autotrade/brokers/alpaca_paper_market_data.py"
      - "src/autotrade/brokers/alpaca_paper_gateway.py"
      - "tests/test_w86_paper_runtime_market_truth.py"
      - "tests/test_w86_paper_runtime_market_truth_hardening.py"
      - "scripts/check_w86_paper_runtime_market_truth_boundary.py"
      - "scripts/check_w86_paper_runtime_asset_truth_boundary.py"
      - "scripts/check_w86_paper_runtime_broker_truth_boundary.py"
      - "scripts/check_w86_paper_runtime_candidate_identity_boundary.py"
      - "scripts/check_r6_market_data_boundary.py"
      - "scripts/check_r6_crypto_quote_primary_policy.py"
      - ".github/workflows/w86-paper-runtime-market-truth.yml"
      - ".github/workflows/core-tests.yml"

permissions:
  contents: read

jobs:
  paper-runtime-market-truth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile W86 market-truth surface
        run: >-
          python -m compileall -q
          src/autotrade/paper_runtime_market_truth.py
          tests/test_w86_paper_runtime_market_truth.py
          tests/test_w86_paper_runtime_market_truth_hardening.py
          scripts/check_w86_paper_runtime_market_truth_boundary.py
      - name: W86 exact market-truth authority boundary
        run: python scripts/check_w86_paper_runtime_market_truth_boundary.py
      - name: W86 market-truth adversarial tests
        run: >-
          pytest -q
          tests/test_w86_paper_runtime_market_truth.py
          tests/test_w86_paper_runtime_market_truth_hardening.py
      - name: Re-prove W86 asset truth
        run: python scripts/check_w86_paper_runtime_asset_truth_boundary.py
      - name: Re-prove W86 broker truth
        run: python scripts/check_w86_paper_runtime_broker_truth_boundary.py
      - name: Re-prove W86 exact candidate identity
        run: python scripts/check_w86_paper_runtime_candidate_identity_boundary.py
      - name: Re-prove R6 market-data read-only boundary
        run: python scripts/check_r6_market_data_boundary.py
      - name: Re-prove R6 crypto quote-primary policy
        run: python scripts/check_r6_crypto_quote_primary_policy.py
      - name: Re-prove R6 PAPER-only authority boundary
        run: python scripts/check_r6_authority.py
      - name: Re-prove R6 permanent LIVE deny
        run: python scripts/check_r6_live_deny_boundary.py
      - name: Re-prove W85 candidate admission
        run: python scripts/check_w85_paper_candidate_admission_boundary.py
      - name: Re-prove W86 durable source
        run: python scripts/check_w86_paper_runtime_readiness_boundary.py
      - name: Re-prove W86 atomic source snapshot
        run: python scripts/check_w86_paper_runtime_readiness_snapshot_boundary.py
      - name: Re-prove research authority
        run: python scripts/check_research_authority.py
