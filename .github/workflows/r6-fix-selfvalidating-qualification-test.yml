name: R6 Fix Self-Validating Qualification Test

on:
  push:
    branches:
      - reconstruction/r6-external-paper-protection
    paths:
      - .github/workflows/r6-fix-selfvalidating-qualification-test.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Patch qualification mismatch fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_r6_paper_qualification.py')
          text = path.read_text(encoding='utf-8')
          old = '''def test_binding_payload_or_client_identity_mismatch_is_rejected(tmp_path) -> None:\n    values = setup_evidence(tmp_path)\n    _, expected, attested, registry, ledger = values\n    wrong_payload = replace(expected, payload_hash=h("different-payload"))\n    with pytest.raises(PaperQualificationRejected, match="payload hash"):\n        AlpacaPaperQualificationEvaluator().qualify(\n            expected_bracket=wrong_payload,\n            bracket_attestation=attested,\n            submission_registry=registry,\n            trade_update_ledger=ledger,\n            evaluated_at=T0 + timedelta(seconds=5),\n        )\n    wrong_client = replace(expected, client_order_id="different-client")\n    with pytest.raises(PaperQualificationRejected, match="client_order_id"):\n        AlpacaPaperQualificationEvaluator().qualify(\n            expected_bracket=wrong_client,\n            bracket_attestation=attested,\n            submission_registry=registry,\n            trade_update_ledger=ledger,\n            evaluated_at=T0 + timedelta(seconds=5),\n        )\n'''
          new = '''def test_binding_payload_or_client_identity_mismatch_is_rejected(tmp_path) -> None:\n    values = setup_evidence(tmp_path)\n    _, expected, attested, registry, ledger = values\n\n    wrong_payload_data = dict(expected.canonical_payload)\n    wrong_payload_data["qty"] = "2"\n    wrong_payload_json = json.dumps(\n        wrong_payload_data, sort_keys=True, separators=(",", ":"), allow_nan=False\n    )\n    wrong_payload = replace(\n        expected,\n        canonical_payload=wrong_payload_data,\n        payload_json=wrong_payload_json,\n        payload_hash=sha256(wrong_payload_json.encode()).hexdigest(),\n    )\n    with pytest.raises(PaperQualificationRejected, match="payload hash"):\n        AlpacaPaperQualificationEvaluator().qualify(\n            expected_bracket=wrong_payload,\n            bracket_attestation=attested,\n            submission_registry=registry,\n            trade_update_ledger=ledger,\n            evaluated_at=T0 + timedelta(seconds=5),\n        )\n\n    wrong_client_data = dict(expected.canonical_payload)\n    wrong_client_data["client_order_id"] = "different-client"\n    wrong_client_json = json.dumps(\n        wrong_client_data, sort_keys=True, separators=(",", ":"), allow_nan=False\n    )\n    wrong_client = replace(\n        expected,\n        client_order_id="different-client",\n        canonical_payload=wrong_client_data,\n        payload_json=wrong_client_json,\n        payload_hash=sha256(wrong_client_json.encode()).hexdigest(),\n    )\n    with pytest.raises(PaperQualificationRejected, match="client_order_id"):\n        AlpacaPaperQualificationEvaluator().qualify(\n            expected_bracket=wrong_client,\n            bracket_attestation=attested,\n            submission_registry=registry,\n            trade_update_ledger=ledger,\n            evaluated_at=T0 + timedelta(seconds=5),\n        )\n'''
          if old not in text:
              raise SystemExit('qualification mismatch test anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch before certification
        run: |
          git config user.name arendon7
          git config user.email 102555888+arendon7@users.noreply.github.com
          git add tests/test_r6_paper_qualification.py
          git commit -m "test(r6): use coherent forged bracket requests in qualification tests"
          git push origin HEAD:reconstruction/r6-external-paper-protection
      - name: Certify focused and full tree
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_r6_paper_qualification.py tests/test_r6_unsupported_products_boundary.py
          python scripts/check_r6_product_boundary.py
          python scripts/check_r6_authority.py
          pytest --cov=autotrade --cov-report=term-missing
          python scripts/check_contract_registry.py
          python scripts/check_research_authority.py
          python scripts/check_r5_authority.py
          python scripts/check_r6_authority.py
          python scripts/check_r6_product_boundary.py
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Self-clean
        run: |
          git rm .github/workflows/r6-fix-selfvalidating-qualification-test.yml
          git commit -m "chore(r6): remove qualification test repair helper"
          git push origin HEAD:reconstruction/r6-external-paper-protection
