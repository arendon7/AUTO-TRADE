name: R4 Authoritative Health Overlay Hardening

on:
  push:
    branches:
      - reconstruction/r4-portfolio-health
    paths:
      - .github/workflows/r4-authoritative-health-overlay-one-shot.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r4-portfolio-health
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply authoritative overlay
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/r4_harden_authoritative_health_overlay.py")
          text = path.read_text()
          old = 'start = text.index("    def effective_control(\\n")\n'
          new = (
              'class_start = text.index("class SQLiteHealthBridgeStore")\n'
              'start = text.index("    def effective_control(\\n", class_start)\n'
          )
          if old not in text:
              raise SystemExit("overlay patcher start anchor not found")
          path.write_text(text.replace(old, new, 1))

          test_path = Path("tests/test_r4_health_bridge.py")
          test_text = test_path.read_text()
          old_expectation = 'assert "STALE_STRATEGY_HEALTH_CONTROL" in stale.reason'
          new_expectation = 'assert "STALE_STRATEGY_AUTHORITATIVE_HEALTH" in stale.reason'
          if old_expectation not in test_text:
              raise SystemExit("legacy stale-health expectation not found")
          test_path.write_text(test_text.replace(old_expectation, new_expectation, 1))
          PY
          python scripts/r4_harden_authoritative_health_overlay.py
      - name: Targeted cross-boundary suite
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q src tests scripts
          pytest -q \
            tests/test_r4_authoritative_health_overlay.py \
            tests/test_r4_recovery_ack_idempotency.py \
            tests/test_r4_health_bridge.py \
            tests/test_r4_health_bridge_integration.py \
            tests/test_r4_portfolio_manager.py \
            tests/test_r4_portfolio_manager_binding.py
      - name: Commit hardening and self-clean
        run: |
          git config user.name "arendon7"
          git config user.email "102555888+arendon7@users.noreply.github.com"
          git add src/autotrade/health_bridge.py tests/test_r4_health_bridge.py
          git rm -f scripts/r4_harden_authoritative_health_overlay.py
          git rm -f .github/workflows/r4-authoritative-health-overlay-one-shot.yml
          git commit -m "fix(r4): overlay authoritative Health on every control read"
          git push origin HEAD:reconstruction/r4-portfolio-health
