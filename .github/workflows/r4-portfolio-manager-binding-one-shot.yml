name: R4 Portfolio Manager Binding Hardening

on:
  push:
    branches:
      - reconstruction/r4-portfolio-health
    paths:
      - .github/workflows/r4-portfolio-manager-binding-one-shot.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r4-portfolio-health
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply binding hardening
        run: python scripts/r4_harden_portfolio_manager_binding.py
      - name: Targeted sizing suite
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q src tests scripts
          pytest -q tests/test_r4_portfolio_manager.py tests/test_r4_portfolio_manager_binding.py tests/test_r4_allocation_exact_normalization.py
          python scripts/check_research_authority.py
      - name: Commit hardening and self-clean
        run: |
          git config user.name "arendon7"
          git config user.email "102555888+arendon7@users.noreply.github.com"
          git add src/autotrade/portfolio_manager.py
          git rm -f scripts/r4_harden_portfolio_manager_binding.py
          git rm -f .github/workflows/r4-portfolio-manager-binding-one-shot.yml
          git commit -m "fix(r4): bind sizing health identity and base robustness evidence"
          git push origin HEAD:reconstruction/r4-portfolio-health
