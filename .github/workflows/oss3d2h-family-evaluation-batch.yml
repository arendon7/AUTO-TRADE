name: OSS-3D2H Family Evaluation Batch

on:
  pull_request:
    branches:
      - research/oss3d2g-isolated-family-runner
    paths:
      - "labs/oss3_qlib/family_evaluation_batch.py"
      - "labs/oss3_qlib/tests/test_family_evaluation_batch.py"
      - "labs/oss3_qlib/tests/test_family_evaluation_batch_binding_immutability.py"
      - "labs/oss3_qlib/family_runner.py"
      - "labs/oss3_qlib/family_model_contract.py"
      - "labs/oss3_qlib/family_environment_attestation.py"
      - "labs/oss3_qlib/environment_attestation.py"
      - "labs/oss3_qlib/dataset_adapter.py"
      - "labs/oss3_qlib/network_guard.py"
      - "labs/oss3_qlib/requirements.txt"
      - "src/autotrade/research/oss3_concrete_model_family.py"
      - "src/autotrade/research/oss3_development_evaluation.py"
      - "src/autotrade/research/oss3_development_model_tournament.py"
      - "src/autotrade/research/oss3_development_inference.py"
      - "src/autotrade/research/oss3_factor_matrix_artifact.py"
      - "src/autotrade/research/oss3_qlib_artifact.py"
      - "src/autotrade/research/oss3_supervised_label_artifact.py"
      - "src/autotrade/research/oss3_training_bundle.py"
      - "src/autotrade/research/trials.py"
      - "src/autotrade/research/tournament.py"
      - "src/autotrade/research/multiple_testing.py"
      - "scripts/check_oss3d2h_family_evaluation_batch_boundary.py"
      - ".github/workflows/oss3d2h-family-evaluation-batch.yml"
      - "knowledge/20_RESEARCH/OSS3D2H_FAMILY_EVALUATION_BATCH.md"

permissions:
  contents: read

jobs:
  oss3d2h:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install AUTO-TRADE core only
        run: python -m pip install -e '.[dev]'
      - name: Compile D2H
        run: |
          python -m py_compile \
            labs/oss3_qlib/family_evaluation_batch.py \
            labs/oss3_qlib/tests/test_family_evaluation_batch.py \
            labs/oss3_qlib/tests/test_family_evaluation_batch_binding_immutability.py \
            scripts/check_oss3d2h_family_evaluation_batch_boundary.py
      - name: D2H runtime-free structural boundary before Qlib install
        run: python scripts/check_oss3d2h_family_evaluation_batch_boundary.py
      - name: Execute D2H deterministic and adversarial orchestration before Qlib install
        run: |
          python -m pytest -q \
            labs/oss3_qlib/tests/test_family_evaluation_batch.py \
            labs/oss3_qlib/tests/test_family_evaluation_batch_binding_immutability.py
      - name: Install exact isolated Qlib runtime
        run: python -m pip install -r labs/oss3_qlib/requirements.txt
      - name: Assert pyqlib 0.9.7
        run: |
          python - <<'PY'
          import qlib
          assert qlib.__version__ == "0.9.7", qlib.__version__
          print("OSS-3D2H pyqlib runtime regression: 0.9.7 PASS")
          PY
      - name: Execute all six D2F candidates through real D2G Qlib runtime
        run: python -m pytest -q labs/oss3_qlib/tests/test_family_runner.py
      - name: Re-prove D2G and D2H boundaries after Qlib install
        run: |
          python scripts/check_oss3d2g_isolated_family_runner_boundary.py
          python scripts/check_oss3d2h_family_evaluation_batch_boundary.py
      - name: D2E and D2D regressions
        run: |
          python -m pytest -q tests/test_research_oss3_development_model_tournament.py
          python scripts/check_oss3d2e_development_model_tournament_boundary.py
          python -m pytest -q tests/test_research_oss3_development_evaluation.py
          python scripts/check_oss3d2d_development_evaluation_boundary.py
      - name: D2A and D2F regressions
        run: |
          python -m pytest -q tests/test_research_oss3_development_inference.py
          python scripts/check_oss3d2a_development_inference_boundary.py
          python -m pytest -q tests/test_research_oss3_concrete_model_family.py
          python scripts/check_oss3d2f_concrete_model_family_boundary.py
      - name: Research artifact lineage regressions
        run: |
          python -m pytest -q \
            tests/test_research_oss3_factor_matrix_artifact.py \
            tests/test_research_oss3_supervised_label_artifact.py \
            tests/test_research_oss3_training_bundle.py \
            tests/test_research_oss3_qlib_artifact.py
      - name: Research authority
        run: python scripts/check_research_authority.py
      - name: W83 strategy-version binding
        run: python scripts/check_w83_strategy_version_binding_boundary.py
      - name: FINAL_HOLDOUT regression
        run: |
          python -m pytest -q \
            tests/test_research_oss2_final_holdout_evaluation.py \
            tests/test_research_oss2_final_holdout_evaluation_adversarial.py \
            tests/test_research_oss2_final_holdout_evaluation_edges.py
          python scripts/check_oss2h_final_holdout_evaluation_boundary.py
