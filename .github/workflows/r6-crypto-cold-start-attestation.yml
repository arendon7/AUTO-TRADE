name: R6 Crypto PAPER Cold-Start Qualification Attestation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-start-qualification-attestation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Compile cold-start attestation surface
        run: python -m compileall -q scripts/mac_crypto_cold_start_qualification_attestation.py scripts/mac_dashboard_cold_start_attestation.py scripts/check_mac_crypto_cold_start_qualification_attestation.py tests/test_mac_crypto_cold_start_qualification_attestation.py
      - name: Permanent cold-start qualification attestation boundary
        run: python scripts/check_mac_crypto_cold_start_qualification_attestation.py
      - name: Cold-start qualification attestation tests
        run: pytest -q tests/test_mac_crypto_cold_start_qualification_attestation.py
      - name: Re-prove cold-start Portfolio bootstrap boundary
        run: python scripts/check_mac_crypto_cold_start_portfolio_bootstrap.py
      - name: Re-prove cold-start Portfolio bootstrap tests
        run: pytest -q tests/test_mac_crypto_cold_start_portfolio_bootstrap.py
      - name: Re-prove Health R4 commissioning boundary
        run: python scripts/check_mac_crypto_health_commissioning.py
      - name: Re-prove execution Health readiness boundary
        run: python scripts/check_mac_crypto_execution_gate_readiness.py
      - name: Re-prove Mac Control Center remains NO-POST
        run: python scripts/check_mac_dashboard_boundary.py
      - name: Re-prove global R6 authority boundary
        run: python scripts/check_r6_authority.py
      - name: Re-prove crypto execution authority boundary
        run: python scripts/check_r6_crypto_execution_boundary.py
