name: R4 Instrument Integrity One-Shot

on:
  push:
    branches: ["reconstruction/r4-portfolio-health"]
    paths: [".r4integrity/TRIGGER"]

permissions:
  contents: write

jobs:
  apply-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact R4 branch
        uses: actions/checkout@v5
        with:
          ref: reconstruction/r4-portfolio-health
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply reviewed hardening
        run: python .r4integrity/apply.py

      - name: Compile hardened tree
        run: python -m compileall -q src tests scripts

      - name: Commit self-cleaned hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(r4): verify instrument fingerprint before semantic parsing"
          git push origin HEAD:reconstruction/r4-portfolio-health
