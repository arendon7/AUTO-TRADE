name: OSS-3D2N One-Shot Economic Holdout Evaluator

on:
  pull_request:
    branches:
      - research/oss3d2m-preregistered-economic-protocol
    paths:
      - 'labs/oss3_qlib/economic_holdout_evaluator.py'
      - 'labs/oss3_qlib/economic_prediction_precommit.py'
      - 'labs/oss3_qlib/tests/d2n_fixture.py'
      - 'labs/oss3_qlib/tests/d2n_precommit_fixture.py'
      - 'labs/oss3_qlib/tests/test_economic_holdout_evaluator.py'
      - 'labs/oss3_qlib/tests/test_economic_prediction_precommit.py'
      - 'scripts/check_oss3d2n_economic_holdout_evaluator_boundary.py'
      - 'scripts/check_oss3d2n_economic_prediction_precommit_boundary.py'
      - 'knowledge/20_RESEARCH/OSS3D2N_ONE_SHOT_ECONOMIC_HOLDOUT_EVALUATOR.md'
      - 'knowledge/20_RESEARCH/OSS3D2N_PREDICTION_PRECOMMIT_HARDENING.md'
      - '.github/workflows/oss3d2n-one-shot-economic-holdout-evaluator.yml'
      - 'labs/oss3_qlib/predictive_economic_protocol.py'
      - 'labs/oss3_qlib/predictive_strategy_contract.py'
      - 'labs/oss3_qlib/final_holdout_evaluator.py'
      - 'labs/oss3_qlib/final_holdout_protocol.py'
      - 'src/autotrade/research/costs.py'
      - 'src/autotrade/research/market.py'
      - 'src/autotrade/research/universe.py'
      - 'src/autotrade/research/oss3_qlib_artifact.py'

permissions:
  contents: read

jobs:
  oss3d2n:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install AUTO-TRADE core only
        run: python -m pip install -e '.[dev]'

      - name: Compile D2N sources before Qlib install
        run: |
          python -m py_compile \
            labs/oss3_qlib/economic_holdout_evaluator.py \
            labs/oss3_qlib/economic_prediction_precommit.py \
            labs/oss3_qlib/tests/d2n_fixture.py \
            labs/oss3_qlib/tests/d2n_precommit_fixture.py \
            labs/oss3_qlib/tests/test_economic_holdout_evaluator.py \
            labs/oss3_qlib/tests/test_economic_prediction_precommit.py \
            scripts/check_oss3d2n_economic_holdout_evaluator_boundary.py \
            scripts/check_oss3d2n_economic_prediction_precommit_boundary.py

      - name: D2N one-shot economic authority boundary before Qlib
        run: python scripts/check_oss3d2n_economic_holdout_evaluator_boundary.py

      - name: D2N prediction precommit boundary before Qlib
        run: python scripts/check_oss3d2n_economic_prediction_precommit_boundary.py

      - name: Re-prove D2M preregistration boundary before Qlib
        run: |
          python scripts/check_oss3d2m_predictive_economic_protocol_boundary.py
          python -m pytest -q labs/oss3_qlib/tests/test_predictive_economic_protocol.py

      - name: Re-prove D2L predictor-to-strategy contract before Qlib
        run: |
          python scripts/check_oss3d2l_predictive_strategy_contract_boundary.py
          python -m pytest -q labs/oss3_qlib/tests/test_predictive_strategy_contract.py

      - name: Re-prove D2J and DEVELOPMENT lineage before Qlib
        run: |
          python scripts/check_oss3d2j_final_holdout_protocol_boundary.py
          python -m pytest -q labs/oss3_qlib/tests/test_final_holdout_protocol.py
          python scripts/check_oss3d2i_development_winner_seal_boundary.py
          python -m pytest -q labs/oss3_qlib/tests/test_development_winner_seal.py
          python scripts/check_oss3d2h_family_evaluation_batch_boundary.py
          python -m pytest -q \
            labs/oss3_qlib/tests/test_family_evaluation_batch.py \
            labs/oss3_qlib/tests/test_family_evaluation_batch_binding_immutability.py

      - name: Research authority before Qlib install
        run: python scripts/check_research_authority.py

      - name: Re-prove cost continuity and fee accounting boundaries
        run: |
          python scripts/check_w81_execution_cost_continuity_boundary.py
          python scripts/check_w81_promotion_cost_continuity_boundary.py
          python scripts/check_w82_fee_accounting_boundary.py
          python scripts/check_w82_promotion_fee_accounting_boundary.py

      - name: Install pinned Qlib runtime
        run: python -m pip install -r labs/oss3_qlib/requirements.txt

      - name: Assert exact pyqlib runtime
        run: |
          python - <<'PY'
          import importlib.metadata
          version = importlib.metadata.version('pyqlib')
          assert version == '0.9.7', version
          print(f'pyqlib=={version}')
          PY

      - name: D2N canonical prediction-precommit admission tests
        run: python -m pytest -q labs/oss3_qlib/tests/test_economic_prediction_precommit.py

      - name: D2N internal deterministic and adversarial economic regression
        run: python -m pytest -q labs/oss3_qlib/tests/test_economic_holdout_evaluator.py

      - name: Re-prove certified D2K predictive one-shot evaluator
        run: |
          python scripts/check_oss3d2k_final_holdout_evaluator_boundary.py
          python -m pytest -q labs/oss3_qlib/tests/test_final_holdout_evaluator.py

      - name: Re-prove six-candidate D2G real runtime
        run: python -m pytest -q labs/oss3_qlib/tests/test_family_runner.py

      - name: D2E and D2D regressions
        run: |
          python -m pytest -q tests/test_research_oss3_development_model_tournament.py
          python scripts/check_oss3d2e_development_model_tournament_boundary.py
          python -m pytest -q tests/test_research_oss3_development_evaluation.py
          python scripts/check_oss3d2d_development_evaluation_boundary.py

      - name: Research authority after Qlib install
        run: python scripts/check_research_authority.py

      - name: Existing one-shot FINAL_HOLDOUT governance regression
        run: |
          python -m pytest -q \
            tests/test_research_oss2_final_holdout_evaluation.py \
            tests/test_research_oss2_final_holdout_evaluation_adversarial.py \
            tests/test_research_oss2_final_holdout_evaluation_edges.py
          python scripts/check_oss2h_final_holdout_evaluation_boundary.py
