name: R4 Health Recovery ACK Chain Hardening

on:
  push:
    branches:
      - reconstruction/r4-portfolio-health
    paths:
      - .github/workflows/r4-health-ack-chain-one-shot.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r4-portfolio-health
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply ACK-chain hardening
        run: |
          python scripts/r4_harden_health_ack_chain.py
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_r4_recovery_ack_idempotency.py")
          text = path.read_text()
          old = '''    assert no_op == state\n\n    bad_window = _window(now, healthy=False, source="later-bad")\n'''
          new = '''    # HEALTHY acknowledgement is severity-neutral but must version durable\n    # evidence so its recovery_id is anchored into the tamper-evident ACK chain.\n    assert no_op.state is HealthState.HEALTHY\n    assert no_op.version == state.version + 1\n    assert no_op.recovery_ack_head != "GENESIS"\n\n    bad_window = _window(now, healthy=False, source="later-bad")\n'''
          if old not in text:
              raise SystemExit("healthy acknowledgement legacy expectation not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Targeted Health/Bridge regression suite
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q src tests scripts
          pytest -q \
            tests/test_r4_health_ack_chain_integrity.py \
            tests/test_r4_recovery_ack_idempotency.py \
            tests/test_r4_health_drift.py \
            tests/test_r4_health_binding_integrity.py \
            tests/test_r4_health_bridge.py \
            tests/test_r4_health_bridge_integration.py \
            tests/test_r4_authoritative_health_overlay.py
      - name: Commit hardening and self-clean
        run: |
          git config user.name "arendon7"
          git config user.email "102555888+arendon7@users.noreply.github.com"
          git add src/autotrade/research/health.py tests/test_r4_recovery_ack_idempotency.py
          git rm -f scripts/r4_harden_health_ack_chain.py
          git rm -f .github/workflows/r4-health-ack-chain-one-shot.yml
          git commit -m "fix(r4): anchor Health recovery ACK chain in durable state"
          git push origin HEAD:reconstruction/r4-portfolio-health
