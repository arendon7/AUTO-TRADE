name: W84 Shadow Forward Promotion Binding

on:
  pull_request:
    paths:
      - "src/autotrade/forward_shadow_measurement.py"
      - "src/autotrade/promotion_shadow_forward_binding.py"
      - "src/autotrade/promotion_shadow_forward_source_verification.py"
      - "tests/test_w84_forward_shadow_measurement.py"
      - "tests/test_w84_forward_shadow_measurement_coverage.py"
      - "tests/test_w84_shadow_forward_promotion_binding.py"
      - "tests/test_w84_shadow_forward_promotion_validation.py"
      - "tests/test_w84_shadow_forward_source_verification.py"
      - "scripts/check_w84_shadow_forward_promotion_boundary.py"
      - ".github/workflows/w84-shadow-forward-promotion.yml"
      - ".github/workflows/core-tests.yml"
      - "knowledge/00_CANON/**"
      - "knowledge/30_DECISIONES/**"
      - "knowledge/40_HANDOFF/**"

permissions:
  contents: read

jobs:
  shadow-forward-promotion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile W84 surface
        run: >-
          python -m compileall -q
          src/autotrade/forward_shadow_measurement.py
          src/autotrade/promotion_shadow_forward_binding.py
          src/autotrade/promotion_shadow_forward_source_verification.py
          tests/test_w84_forward_shadow_measurement.py
          tests/test_w84_forward_shadow_measurement_coverage.py
          tests/test_w84_shadow_forward_promotion_binding.py
          tests/test_w84_shadow_forward_promotion_validation.py
          tests/test_w84_shadow_forward_source_verification.py
          scripts/check_w84_shadow_forward_promotion_boundary.py
      - name: W84 shadow-forward promotion boundary
        run: python scripts/check_w84_shadow_forward_promotion_boundary.py
      - name: W84 shadow-forward promotion tests
        run: >-
          pytest -q
          tests/test_w84_forward_shadow_measurement.py
          tests/test_w84_forward_shadow_measurement_coverage.py
          tests/test_w84_shadow_forward_promotion_binding.py
          tests/test_w84_shadow_forward_promotion_validation.py
          tests/test_w84_shadow_forward_source_verification.py
      - name: Re-prove W83 strategy-version binding boundary
        run: python scripts/check_w83_strategy_version_binding_boundary.py
      - name: Re-prove W82 fee accounting boundary
        run: python scripts/check_w82_fee_accounting_boundary.py
      - name: Re-prove W82 candidate fee resolution boundary
        run: python scripts/check_w82_promotion_fee_accounting_boundary.py
      - name: Re-prove W81 execution cost continuity
        run: python scripts/check_w81_execution_cost_continuity_boundary.py
      - name: Re-prove W81 candidate continuity resolution
        run: python scripts/check_w81_promotion_cost_continuity_boundary.py
      - name: Re-prove W80 assessment boundary
        run: python scripts/check_w80_promotion_assessment_boundary.py
      - name: Re-prove W79 promotion boundary
        run: python scripts/check_w79_strategy_promotion_boundary.py
      - name: Re-prove W78 execution boundary
        run: python scripts/check_w78_paper_execution_boundary.py
      - name: Re-prove research authority boundary
        run: python scripts/check_research_authority.py
