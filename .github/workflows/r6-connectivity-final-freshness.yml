name: R6 Connectivity Final Freshness Boundary

on:
  push:
    branches: ["reconstruction/**", "work/**", "feature/**"]
    paths:
      - "src/autotrade/connectivity_final_freshness.py"
      - "scripts/r6_connectivity_final_freshness.py"
      - "scripts/check_r6_connectivity_final_freshness_boundary.py"
      - "tests/test_r6_connectivity_final_freshness.py"
      - "tests/test_r6_connectivity_final_freshness_cli.py"
      - ".github/workflows/r6-connectivity-final-freshness.yml"
  pull_request:
    paths:
      - "src/autotrade/connectivity_final_freshness.py"
      - "scripts/r6_connectivity_final_freshness.py"
      - "scripts/check_r6_connectivity_final_freshness_boundary.py"
      - "tests/test_r6_connectivity_final_freshness.py"
      - "tests/test_r6_connectivity_final_freshness_cli.py"
      - ".github/workflows/r6-connectivity-final-freshness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectivity-final-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Final freshness GET-only authority boundary
        run: python scripts/check_r6_connectivity_final_freshness_boundary.py
      - name: Final freshness functional and adversarial tests
        run: pytest -q tests/test_r6_connectivity_final_freshness.py tests/test_r6_connectivity_final_freshness_cli.py
