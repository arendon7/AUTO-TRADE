name: OSS-3D3G D2J Predictive FINAL_HOLDOUT Preregistration

on:
  pull_request:
    branches:
      - research/oss3d3f-protected-holdout-materialization
    paths:
      - 'labs/oss3_qlib/final_holdout_protocol.py'
      - 'labs/oss3_qlib/d2j_predictive_final_holdout_preregistration.py'
      - 'labs/oss3_qlib/tests/test_final_holdout_protocol.py'
      - 'labs/oss3_qlib/tests/test_final_holdout_protocol_exclusive_end_sentinel.py'
      - 'labs/oss3_qlib/tests/test_d2j_predictive_final_holdout_preregistration.py'
      - 'scripts/run_oss3d3g_d2j_predictive_final_holdout_preregistration.py'
      - 'scripts/check_oss3d3g_d2j_predictive_final_holdout_preregistration_boundary.py'
      - 'knowledge/20_RESEARCH/OSS3D3G_D2J_PREDICTIVE_FINAL_HOLDOUT_PREREGISTRATION.md'
      - 'knowledge/20_RESEARCH/OSS3D3G_FROZEN_IDENTITIES.json'
      - '.github/workflows/oss3d3g-d2j-predictive-final-holdout-preregistration.yml'
  push:
    branches:
      - research/oss3d3g-d2j-predictive-final-holdout-preregistration
    paths:
      - 'labs/oss3_qlib/final_holdout_protocol.py'
      - 'labs/oss3_qlib/d2j_predictive_final_holdout_preregistration.py'
      - 'labs/oss3_qlib/tests/test_final_holdout_protocol.py'
      - 'labs/oss3_qlib/tests/test_final_holdout_protocol_exclusive_end_sentinel.py'
      - 'labs/oss3_qlib/tests/test_d2j_predictive_final_holdout_preregistration.py'
      - 'scripts/run_oss3d3g_d2j_predictive_final_holdout_preregistration.py'
      - 'scripts/check_oss3d3g_d2j_predictive_final_holdout_preregistration_boundary.py'
      - 'knowledge/20_RESEARCH/OSS3D3G_D2J_PREDICTIVE_FINAL_HOLDOUT_PREREGISTRATION.md'
      - 'knowledge/20_RESEARCH/OSS3D3G_FROZEN_IDENTITIES.json'
      - '.github/workflows/oss3d3g-d2j-predictive-final-holdout-preregistration.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  oss3d3g:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}
      D3C_ARTIFACT_ID: '10172032908'
      D3C_ARTIFACT_ZIP_SHA256: f7e6d4dc62138b52954c4c4f50f3598dd88271bcb9a413883280d8dc2cb5e585
      D3C_DIR: /tmp/oss3d3g-d3c
      D3C_ZIP: /tmp/oss3d3g-d3c.zip
      D3F_ARTIFACT_ID: '10309654587'
      D3F_ARTIFACT_ZIP_SHA256: eff2701668b1ad43523154697f1adba6640c8f6a4fddee2c53f8465f838d827c
      D3F_DIR: /tmp/oss3d3g-d3f
      D3F_ZIP: /tmp/oss3d3g-d3f.zip
      D3G_REGISTRY: /tmp/oss3d3g-d2j.sqlite3
      D3G_RESULT_1: /tmp/oss3d3g-result-1.json
      D3G_RESULT_2: /tmp/oss3d3g-result-2.json
      FROZEN_IDENTITIES: ${{ github.workspace }}/knowledge/20_RESEARCH/OSS3D3G_FROZEN_IDENTITIES.json
      EXPECTED_D3C_BUNDLE: 1d271c31f506be21d2a99c857a1007cc5676cfcb5ab83fb6a524171a38dbaf43
      EXPECTED_D3C_SCIENCE: 5b4261b186e30cbdc30ec2c3025305fbb96650247a066cdf470ce53e80f86ea7
      EXPECTED_D3C_D2I: 65537f610766852c834893604192e1fe5562d0385fa2b00f4c692b6b074d7cb1
      EXPECTED_D3F_EVIDENCE: a9681ff31f4d74176d072c2076d129516d8db19cfb8aea093432ec6f7ac9d5b6
      EXPECTED_Q1_COMMITMENT: a6fef49419ef22b75be45385a805f8f3242653a3fcb74cb708be6548ac865bde
      EXPECTED_WINNER: linear-ridge-a10
      EXPECTED_D3G_EVIDENCE: 95881a179f4ebe84cbd7a2b29300212ad9c4e0902dad3acc8da16e87ee7315f1
      EXPECTED_D2J_RECEIPT: a54fa9e736ca1baa83ae06887954bad39d254e39b6019a852e13859ef25b882d
      EXPECTED_D2J_POLICY: 7983cfd3666fc2fcf9744f2b35744bc8a37cb6ee442dca615bb042e9e74417a5
      EXPECTED_AUTHORIZATION_ID: oss3d2j:2455ca9d6ec35cd923a9bac039bb58eef4a44c0a5994611c

    steps:
      - name: Checkout exact D3G source SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED_SOURCE_SHA"
          echo "exact D3G source: $ACTUAL"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install AUTO-TRADE core only
        run: python -m pip install -e '.[dev]'

      - name: Verify immutable frozen D3G identities
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['FROZEN_IDENTITIES'])
          raw = path.read_text(encoding='utf-8')
          d = json.loads(raw)
          assert raw == json.dumps(d, sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False) + '\n'
          assert d['schema_version'] == 'OSS3D3G_FROZEN_REAL_IDENTITIES_V1'
          assert d['d3g_evidence_fingerprint'] == os.environ['EXPECTED_D3G_EVIDENCE']
          assert d['d2j_receipt_hash'] == os.environ['EXPECTED_D2J_RECEIPT']
          assert d['d2j_policy_fingerprint'] == os.environ['EXPECTED_D2J_POLICY']
          assert d['expected_holdout_authorization_id'] == os.environ['EXPECTED_AUTHORIZATION_ID']
          assert d['source_d3c_bundle_fingerprint'] == os.environ['EXPECTED_D3C_BUNDLE']
          assert d['source_d2i_seal_fingerprint'] == os.environ['EXPECTED_D3C_D2I']
          assert d['source_d3f_evidence_fingerprint'] == os.environ['EXPECTED_D3F_EVIDENCE']
          assert d['holdout_commitment_fingerprint'] == os.environ['EXPECTED_Q1_COMMITMENT']
          assert d['selected_trial_id'] == os.environ['EXPECTED_WINNER']
          assert d['final_holdout_evaluations_performed'] == 0
          assert d['final_holdout_observed'] is False
          assert d['holdout_permit_issued'] is False
          assert d['holdout_permit_consumed'] is False
          assert d['final_holdout_checkout_authorized'] is False
          assert d['predictive_validation_passed'] is False
          assert d['profitability_claim_authorized'] is False
          assert d['promotion_authorized'] is False
          assert d['execution_authorized'] is False
          assert d['paper_execution_authorized'] is False
          assert d['capital_authority'] == 'NONE'
          assert d['live_trading'] == 'BLOCKED'
          print('frozen D3G real identities: PASS')
          PY

      - name: Prove Qlib absent before D3G
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('qlib') is None
          print('qlib runtime before D3G: ABSENT')
          PY

      - name: Compile D3G and D2J sources
        run: |
          python -m py_compile \
            labs/oss3_qlib/final_holdout_protocol.py \
            labs/oss3_qlib/d2j_predictive_final_holdout_preregistration.py \
            labs/oss3_qlib/tests/test_final_holdout_protocol_exclusive_end_sentinel.py \
            labs/oss3_qlib/tests/test_d2j_predictive_final_holdout_preregistration.py \
            scripts/run_oss3d3g_d2j_predictive_final_holdout_preregistration.py \
            scripts/check_oss3d3g_d2j_predictive_final_holdout_preregistration_boundary.py

      - name: D3G preregistration-only authority boundary
        run: |
          python scripts/check_oss3d3g_d2j_predictive_final_holdout_preregistration_boundary.py
          python scripts/check_oss3d2j_final_holdout_protocol_boundary.py
          python scripts/check_oss3d2i_development_winner_seal_boundary.py
          python scripts/check_oss3d3c_durable_development_outcome_boundary.py
          python scripts/check_research_authority.py

      - name: D2J and D3G deterministic/adversarial tests
        run: |
          python -m pytest -q \
            labs/oss3_qlib/tests/test_final_holdout_protocol.py \
            labs/oss3_qlib/tests/test_final_holdout_protocol_exclusive_end_sentinel.py \
            labs/oss3_qlib/tests/test_d2j_predictive_final_holdout_preregistration.py

      - name: Download and verify exact certified D3C ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf "$D3C_DIR" "$D3C_ZIP"
          mkdir -p "$D3C_DIR"
          curl --fail-with-body -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${D3C_ARTIFACT_ID}/zip" \
            -o "$D3C_ZIP"
          echo "${D3C_ARTIFACT_ZIP_SHA256}  ${D3C_ZIP}" | sha256sum -c -
          unzip -q "$D3C_ZIP" -d "$D3C_DIR"

      - name: Download and verify exact certified D3F public ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf "$D3F_DIR" "$D3F_ZIP"
          mkdir -p "$D3F_DIR"
          curl --fail-with-body -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${D3F_ARTIFACT_ID}/zip" \
            -o "$D3F_ZIP"
          echo "${D3F_ARTIFACT_ZIP_SHA256}  ${D3F_ZIP}" | sha256sum -c -
          unzip -q "$D3F_ZIP" -d "$D3F_DIR"

      - name: Resolve and verify certified public handoffs
        id: sources
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from labs.oss3_qlib.durable_development_outcome import read_durable_development_outcome
          from labs.oss3_qlib.d2j_predictive_final_holdout_preregistration import read_public_d3f_evidence
          d3c = list(Path(os.environ['D3C_DIR']).rglob('oss3d3c-durable-development-outcome.json'))
          d3f = list(Path(os.environ['D3F_DIR']).rglob('oss3d3f-protected-holdout-public-evidence.json'))
          assert len(d3c) == 1, d3c
          assert len(d3f) == 1, d3f
          bundle = read_durable_development_outcome(d3c[0])
          assert bundle.fingerprint == os.environ['EXPECTED_D3C_BUNDLE']
          assert bundle.scientific_outcome_fingerprint == os.environ['EXPECTED_D3C_SCIENCE']
          assert bundle.d2i_winner_seal_fingerprint == os.environ['EXPECTED_D3C_D2I']
          assert bundle.selected_trial_id == os.environ['EXPECTED_WINNER']
          assert bundle.final_holdout_observed is False
          assert bundle.final_holdout_authorized is False
          assert bundle.holdout_permit_consumed is False
          assert bundle.capital_authority == 'NONE'
          assert bundle.live_trading == 'BLOCKED'
          public = read_public_d3f_evidence(d3f[0])
          assert public.fingerprint == os.environ['EXPECTED_D3F_EVIDENCE']
          assert public.predictive_commitment_fingerprint == os.environ['EXPECTED_Q1_COMMITMENT']
          assert public.label_values_exposed is False
          assert public.prediction_values_materialized is False
          assert public.predictive_metrics_computed is False
          assert public.final_holdout_observed is False
          assert public.d2j_protocol_registered is False
          assert public.holdout_permit_issued is False
          assert public.holdout_permit_consumed is False
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"d3c={d3c[0]}\n")
              handle.write(f"d3f={d3f[0]}\n")
          print('certified D3C/D3F public handoffs: PASS')
          PY

      - name: Preregister exact D2J protocol without observing Q1
        run: |
          rm -f "$D3G_REGISTRY" "$D3G_RESULT_1" "$D3G_RESULT_2"
          python scripts/run_oss3d3g_d2j_predictive_final_holdout_preregistration.py \
            --d3c-bundle "${{ steps.sources.outputs.d3c }}" \
            --d3f-public-evidence "${{ steps.sources.outputs.d3f }}" \
            --registry "$D3G_REGISTRY" \
            --output "$D3G_RESULT_1"

      - name: Prove restart-safe byte-identical D2J preregistration
        run: |
          python scripts/run_oss3d3g_d2j_predictive_final_holdout_preregistration.py \
            --d3c-bundle "${{ steps.sources.outputs.d3c }}" \
            --d3f-public-evidence "${{ steps.sources.outputs.d3f }}" \
            --registry "$D3G_REGISTRY" \
            --output "$D3G_RESULT_2"
          cmp "$D3G_RESULT_1" "$D3G_RESULT_2"

      - name: Inspect durable D3G result and one-row D2J registry
        run: |
          python - <<'PY'
          import json, os, sqlite3
          from pathlib import Path
          raw = Path(os.environ['D3G_RESULT_1']).read_text(encoding='utf-8')
          d = json.loads(raw)
          assert raw == json.dumps(d, sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False) + '\n'
          assert d['fingerprint'] == os.environ['EXPECTED_D3G_EVIDENCE']
          assert d['d2j_receipt_hash'] == os.environ['EXPECTED_D2J_RECEIPT']
          assert d['d2j_policy_fingerprint'] == os.environ['EXPECTED_D2J_POLICY']
          assert d['expected_holdout_authorization_id'] == os.environ['EXPECTED_AUTHORIZATION_ID']
          assert d['source_d3c_bundle_fingerprint'] == os.environ['EXPECTED_D3C_BUNDLE']
          assert d['source_scientific_outcome_fingerprint'] == os.environ['EXPECTED_D3C_SCIENCE']
          assert d['source_d2i_seal_fingerprint'] == os.environ['EXPECTED_D3C_D2I']
          assert d['selected_trial_id'] == os.environ['EXPECTED_WINNER']
          assert d['source_d3f_evidence_fingerprint'] == os.environ['EXPECTED_D3F_EVIDENCE']
          assert d['holdout_commitment_fingerprint'] == os.environ['EXPECTED_Q1_COMMITMENT']
          assert d['registry_row_count'] == 1
          assert d['idempotent_replay_verified'] is True
          assert d['final_holdout_evaluations_performed'] == 0
          assert d['final_holdout_observed'] is False
          assert d['final_holdout_consumed'] is False
          assert d['holdout_permit_issued'] is False
          assert d['holdout_permit_consumed'] is False
          assert d['final_holdout_checkout_authorized'] is False
          assert d['predictive_validation_passed'] is False
          assert d['profitability_claim_authorized'] is False
          assert d['promotion_authorized'] is False
          assert d['execution_authorized'] is False
          assert d['paper_execution_authorized'] is False
          assert d['capital_authority'] == 'NONE'
          assert d['live_trading'] == 'BLOCKED'
          conn = sqlite3.connect(f"file:{Path(os.environ['D3G_REGISTRY']).resolve()}?mode=ro", uri=True)
          try:
              count = conn.execute('SELECT COUNT(*) FROM oss3_final_holdout_protocols').fetchone()[0]
          finally:
              conn.close()
          assert count == 1
          for forbidden in ('"feature_rows"', '"label_rows"', '"prediction_rows"', '"label_values"', '"outcomes"'):
              assert forbidden not in raw
          print('D3G durable preregistration result: PASS')
          print('D3G evidence:', d['fingerprint'])
          print('D2J receipt:', d['d2j_receipt_hash'])
          print('expected future authorization identity:', d['expected_holdout_authorization_id'])
          PY

      - name: Prove Qlib remains absent after D3G
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('qlib') is None
          print('qlib runtime after D3G: ABSENT')
          PY

      - name: Re-prove research authority after preregistration
        run: |
          python scripts/check_oss3d3g_d2j_predictive_final_holdout_preregistration_boundary.py
          python scripts/check_oss3d2j_final_holdout_protocol_boundary.py
          python scripts/check_research_authority.py

      - name: Upload D3G public preregistration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oss3d3g-d2j-predictive-preregistration-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ env.D3G_RESULT_1 }}
            ${{ env.D3G_REGISTRY }}
