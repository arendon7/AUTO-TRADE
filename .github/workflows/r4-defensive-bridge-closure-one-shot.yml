name: R4 Defensive Bridge Closure

on:
  push:
    branches:
      - reconstruction/r4-portfolio-health
    paths:
      - .github/workflows/r4-defensive-bridge-closure-one-shot.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r4-portfolio-health
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply certified closure
        run: python scripts/r4_close_defensive_bridge.py
      - name: Validate contracts
        run: |
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Commit closure and remove one-shot machinery
        run: |
          git config user.name "arendon7"
          git config user.email "102555888+arendon7@users.noreply.github.com"
          git add knowledge/00_CANON/debt_register.json knowledge/00_CANON/DEBT_REGISTER.md knowledge/00_CANON/RECONSTRUCTION_V028R_MATRIX.md
          git rm -f scripts/r4_close_defensive_bridge.py
          git rm -f .github/workflows/r4-health-bridge-integration-one-shot.yml || true
          git rm -f .github/workflows/r4-defensive-bridge-closure-one-shot.yml
          git commit -m "docs(r4): close certified defensive health bridge"
          git push origin HEAD:reconstruction/r4-portfolio-health
