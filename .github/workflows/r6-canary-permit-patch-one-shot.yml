name: R6 Canary Permit Durability Patch

on:
  push:
    branches:
      - reconstruction/r6-external-paper-protection
    paths:
      - .github/workflows/r6-canary-permit-patch-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply durability/test fixture patches
        run: |
          python scripts/r6_patch_canary_permit_init.py
          python scripts/r6_patch_canary_permit_tests.py
      - name: Install and certify targeted permit layer
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q src tests scripts
          pytest -q tests/test_r6_paper_canary_permit.py tests/test_r6_paper_canary.py tests/test_r6_paper_submission_ambiguity.py
          python scripts/check_r6_authority.py
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Commit and self-clean
        run: |
          git config user.name "arendon7"
          git config user.email "102555888+arendon7@users.noreply.github.com"
          git add src/autotrade/brokers/alpaca_paper_canary_permit.py tests/test_r6_paper_canary_permit.py
          git rm -f scripts/r6_patch_canary_permit_init.py
          git rm -f scripts/r6_patch_canary_permit_tests.py
          git rm -f .github/workflows/r6-canary-permit-patch-one-shot.yml
          git commit -m "fix(r6): harden one-shot PAPER canary permit durability"
          git push origin HEAD:reconstruction/r6-external-paper-protection
