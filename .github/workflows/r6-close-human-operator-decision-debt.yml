name: R6 Close Human Operator Decision Debt

on:
  push:
    branches: ["reconstruction/r6-external-paper-protection"]

permissions:
  contents: write

jobs:
  close:
    if: github.event.head_commit.message == 'chore(r6) close TD-R6-011 after exact-head CI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply canonical TD-R6-011 closure
        run: python scripts/r6_close_human_operator_decision_debt.py
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused human-authority certification
        run: |
          python -m compileall -q src tests scripts
          pytest -q tests/test_r6_paper_canary_coordinator.py tests/test_r6_operator_decision.py tests/test_r6_paper_execution_bridge.py tests/test_r6_writer_human_gate.py tests/test_r6_paper_writer.py tests/test_r6_writer_same_attempt_resume.py tests/test_r6_paper_canary_permit.py
          python scripts/check_r6_canary_coordinator_boundary.py
          python scripts/check_r6_operator_decision_boundary.py
          python scripts/check_r6_execution_bridge_boundary.py
          python scripts/check_r6_writer_human_gate.py
          python scripts/check_r6_oms_handoff_boundary.py
          python scripts/check_r6_live_deny_boundary.py
          python scripts/check_r6_authority.py
          python scripts/check_r6_product_boundary.py
      - name: Full closure certification
        run: |
          pytest --cov=autotrade --cov-report=term-missing
          python scripts/check_contract_registry.py
          python scripts/check_research_authority.py
          python scripts/check_r5_authority.py
          python scripts/check_r6_authority.py
          python scripts/check_r6_live_deny_boundary.py
          python scripts/check_r6_oms_handoff_boundary.py
          python scripts/check_r6_canary_coordinator_boundary.py
          python scripts/check_r6_operator_decision_boundary.py
          python scripts/check_r6_execution_bridge_boundary.py
          python scripts/check_r6_writer_human_gate.py
          python scripts/check_r6_product_boundary.py
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Publish canonical closure only after all gates pass
        run: |
          git config user.name arendon7
          git config user.email 102555888+arendon7@users.noreply.github.com
          git rm -f scripts/r6_close_human_operator_decision_debt.py .github/workflows/r6-close-human-operator-decision-debt.yml
          git add knowledge/00_CANON/debt_register.json knowledge/00_CANON/DEBT_REGISTER.md knowledge/00_CANON/TAREA_ACTIVA.md knowledge/60_EVIDENCE/R6_HUMAN_OPERATOR_EXECUTION_EVIDENCE.json
          git commit -m "docs(r6): close TD-R6-011 human operator execution debt"
          git push origin HEAD:reconstruction/r6-external-paper-protection
