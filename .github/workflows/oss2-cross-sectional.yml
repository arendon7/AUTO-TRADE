name: OSS-2 Cross-Sectional Research

on:
  pull_request:
    paths:
      - "src/autotrade/research/universe.py"
      - "src/autotrade/research/cross_sectional.py"
      - "src/autotrade/research/cross_sectional_backtest.py"
      - "src/autotrade/research/__init__.py"
      - "tests/test_research_oss2_cross_sectional.py"
      - "tests/test_research_oss2_backtest.py"
      - "knowledge/20_RESEARCH/OSS2_IMPLEMENTATION.md"
      - ".github/workflows/oss2-cross-sectional.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oss2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Compile OSS-2 research surface
        run: |
          python -m py_compile \
            src/autotrade/research/universe.py \
            src/autotrade/research/cross_sectional.py \
            src/autotrade/research/cross_sectional_backtest.py

      - name: OSS-2 tests
        run: |
          pytest -q \
            tests/test_research_oss2_cross_sectional.py \
            tests/test_research_oss2_backtest.py

      - name: OSS-1 regression tests
        run: |
          pytest -q \
            tests/test_research_oss_strategy_dsl.py \
            tests/test_research_oss_campaign.py \
            tests/test_strategy_catalog.py

      - name: Existing dependence/allocation regression
        run: |
          pytest -q \
            tests/test_r4_portfolio_dependence.py \
            tests/test_r4_dependence_integrity.py \
            tests/test_r4_dependence_universe_integrity.py \
            tests/test_r4_allocation_robustness.py \
            tests/test_r4_allocation_exact_normalization.py

      - name: Research authority boundary
        run: python scripts/check_research_authority.py

      - name: W83 strategy-version boundary re-proof
        run: python scripts/check_w83_strategy_version_binding_boundary.py
