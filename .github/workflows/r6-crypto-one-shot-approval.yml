name: R6 Crypto PAPER One-Shot Approval UAT

on:
  pull_request:
    paths:
      - "ABRIR_AUTO_TRADE.command"
      - "scripts/mac_crypto_approval_prepare.py"
      - "scripts/mac_dashboard_one_shot.py"
      - "scripts/r6_issue_crypto_operator_decision_uat.py"
      - "scripts/check_mac_crypto_one_shot_approval.py"
      - "scripts/check_r6_operator_decision_boundary.py"
      - "scripts/check_r6_crypto_operator_decision_boundary.py"
      - "tests/test_mac_crypto_approval_prepare.py"
      - "tests/test_mac_crypto_one_shot_approval_gate.py"
      - "tests/test_r6_operator_decision_boundary.py"
      - "tests/test_r6_crypto_operator_decision_boundary.py"
      - "src/autotrade/brokers/alpaca_paper_crypto_operator_decision.py"
      - ".github/workflows/r6-crypto-one-shot-approval.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-shot-approval-uat:
    runs-on: macos-14
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore executable entrypoints
        run: |
          chmod +x ABRIR_AUTO_TRADE.command AUTO_TRADE_MAC.command INSTALAR_AUTO_TRADE.command
          chmod +x scripts/mac_bootstrap.sh scripts/mac_rehearsal.sh scripts/mac_start.sh

      - name: Build safe local runtime
        run: bash scripts/mac_bootstrap.sh

      - name: Compile one-shot approval surface
        run: |
          .venv/bin/python -m compileall -q \
            scripts/mac_crypto_approval_prepare.py \
            scripts/mac_dashboard_one_shot.py \
            scripts/r6_issue_crypto_operator_decision_uat.py \
            scripts/check_mac_crypto_one_shot_approval.py \
            scripts/check_r6_crypto_operator_decision_boundary.py

      - name: Permanent one-shot approval UAT boundary
        run: .venv/bin/python scripts/check_mac_crypto_one_shot_approval.py

      - name: Canonical crypto operator issuer boundary
        run: |
          .venv/bin/python scripts/check_r6_operator_decision_boundary.py
          .venv/bin/python scripts/check_r6_crypto_operator_decision_boundary.py

      - name: Approval prepare and primary Control Center tests
        run: |
          .venv/bin/pytest -q \
            tests/test_mac_crypto_approval_prepare.py \
            tests/test_mac_crypto_one_shot_approval_gate.py \
            tests/test_r6_paper_crypto_operator_decision.py \
            tests/test_r6_operator_decision_boundary.py \
            tests/test_r6_crypto_operator_decision_boundary.py

      - name: Re-prove primary Mac Control Center remains NO-POST
        run: |
          .venv/bin/python scripts/check_mac_dashboard_boundary.py
          .venv/bin/python scripts/check_mac_crypto_http_resilience.py

      - name: Re-prove global R6 PAPER authority boundary
        run: .venv/bin/python scripts/check_r6_authority.py
