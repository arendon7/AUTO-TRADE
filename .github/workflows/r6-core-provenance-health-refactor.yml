name: R6 Core Provenance Health Refactor

on:
  push:
    branches: ["reconstruction/r6-external-paper-protection"]

permissions:
  contents: write

jobs:
  refactor-and-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Apply exact Health provenance refactor
        run: python scripts/r6_refactor_core_provenance_health.py
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Focused provenance tests
        run: pytest -q tests/test_r6_core_provenance.py tests/test_r6_core_provenance_boundary.py tests/test_health_bridge.py
      - name: Full suite and machine coverage floor
        run: |
          pytest --cov=autotrade --cov-report=term-missing --cov-report=json:coverage.json
          python scripts/check_coverage_floor.py coverage.json 85
      - name: Permanent gates
        run: |
          python scripts/check_contract_registry.py
          python scripts/check_research_authority.py
          python scripts/check_r5_authority.py
          python scripts/check_r6_authority.py
          python scripts/check_r6_live_deny_boundary.py
          python scripts/check_r6_oms_handoff_boundary.py
          python scripts/check_r6_canary_coordinator_boundary.py
          python scripts/check_r6_operator_decision_boundary.py
          python scripts/check_r6_execution_bridge_boundary.py
          python scripts/check_r6_writer_human_gate.py
          python scripts/check_r6_operational_lifecycle_boundary.py
          python scripts/check_r6_core_provenance_boundary.py
          python scripts/check_r6_product_boundary.py
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Publish only certified refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/r6_refactor_core_provenance_health.py
          rm .github/workflows/r6-core-provenance-health-refactor.yml
          rm -f coverage.json .coverage
          git add -A
          git diff --cached --check
          git commit -m "refactor(r6): reuse canonical Health verifier for core provenance"
          git push origin HEAD:reconstruction/r6-external-paper-protection
