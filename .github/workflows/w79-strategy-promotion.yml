name: W79 Strategy Promotion Evidence

on:
  push:
    branches: ["work/w79-**"]
  pull_request:

permissions:
  contents: read

jobs:
  strategy-promotion-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile W79 surface
        run: >-
          python -m compileall -q
          src/autotrade/strategy_lab_promotion.py
          src/autotrade/strategy_lab_read_model.py
          tests/test_w79_strategy_promotion.py
          tests/test_w79_strategy_promotion_validation.py
          tests/test_w79_strategy_lab_read_model.py
          tests/test_w79_strategy_lab_dashboard.py
          scripts/check_w79_strategy_promotion_boundary.py
          scripts/check_w79_strategy_lab_read_model_boundary.py
      - name: W79 no-execution authority boundary
        run: python scripts/check_w79_strategy_promotion_boundary.py
      - name: W79 Strategy Lab read-only boundary
        run: python scripts/check_w79_strategy_lab_read_model_boundary.py
      - name: W79 promotion and Strategy Lab tests
        run: >-
          pytest -q
          tests/test_w79_strategy_promotion.py
          tests/test_w79_strategy_promotion_validation.py
          tests/test_w79_strategy_lab_read_model.py
          tests/test_w79_strategy_lab_dashboard.py
      - name: Re-prove Mac Control Center boundary
        run: python scripts/check_mac_dashboard_boundary.py
      - name: Re-prove Mac Control Center tests
        run: pytest -q tests/test_mac_dashboard.py
      - name: Re-prove W78 execution qualification boundary
        run: python scripts/check_w78_paper_execution_boundary.py
      - name: Re-prove research authority boundary
        run: python scripts/check_research_authority.py
