name: R6 Register OMS Handoff Debt

on:
  push:
    branches: ["reconstruction/r6-external-paper-protection"]

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Register TD-R6-010
        run: python scripts/r6_register_oms_handoff_debt.py
      - name: Validate canon
        run: |
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Commit registration and remove temporary machinery
        run: |
          git config user.name arendon7
          git config user.email 102555888+arendon7@users.noreply.github.com
          git rm .github/workflows/r6-register-oms-handoff-debt.yml scripts/r6_register_oms_handoff_debt.py
          git add knowledge/00_CANON/debt_register.json knowledge/00_CANON/DEBT_REGISTER.md knowledge/00_CANON/TAREA_ACTIVA.md
          git commit -m "docs(r6): register TD-R6-010 OMS external handoff debt"
          git push origin HEAD:reconstruction/r6-external-paper-protection
