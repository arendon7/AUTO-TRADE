name: OSS-3D3A Stable Rehydrated Raw Split

on:
  pull_request:
    branches:
      - research/oss3d2z-durable-descriptor-material-manifest
    paths:
      - 'labs/oss3_qlib/stable_rehydrated_raw_split.py'
      - 'labs/oss3_qlib/tests/test_stable_rehydrated_raw_split.py'
      - 'scripts/check_oss3d3a_stable_rehydrated_raw_split_boundary.py'
      - 'knowledge/20_RESEARCH/OSS3D3A_STABLE_REHYDRATED_RAW_SPLIT.md'
      - '.github/workflows/oss3d3a-stable-rehydrated-raw-split.yml'
      - 'src/autotrade/research/oss3_real_descriptor_identity.py'
      - 'src/autotrade/research/oss3_real_campaign_evidence.py'
      - 'src/autotrade/research/oss3_market_collection.py'
      - 'src/autotrade/research/oss3_market_snapshot.py'
      - 'labs/oss3_qlib/raw_training_bundle_provenance.py'
      - 'labs/oss3_qlib/raw_development_provenance.py'

permissions:
  contents: read

jobs:
  oss3d3a:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install AUTO-TRADE core only
        run: python -m pip install -e '.[dev]'

      - name: Prove Qlib absent before D3A
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('qlib') is None, 'D3A workflow must remain Qlib-free'
          print('qlib runtime: ABSENT')
          PY

      - name: Compile D3A sources
        run: |
          python -m py_compile \
            labs/oss3_qlib/stable_rehydrated_raw_split.py \
            labs/oss3_qlib/tests/test_stable_rehydrated_raw_split.py \
            scripts/check_oss3d3a_stable_rehydrated_raw_split_boundary.py

      - name: D3A stable rehydration boundary
        run: python scripts/check_oss3d3a_stable_rehydrated_raw_split_boundary.py

      - name: D3A deterministic and adversarial invariance suite
        run: python -m pytest -q labs/oss3_qlib/tests/test_stable_rehydrated_raw_split.py

      - name: Re-prove certified D2Z descriptor material boundary
        run: python scripts/check_oss3d2z_durable_descriptor_material_manifest_boundary.py

      - name: Re-prove certified D2Z manifest suite
        run: python -m pytest -q tests/test_research_oss3_real_descriptor_identity.py

      - name: Re-prove D2Y durable real campaign seal
        run: python -m pytest -q tests/test_research_oss3_real_campaign_evidence.py

      - name: Re-prove D2U collection and assembly
        run: python -m pytest -q tests/test_research_oss3_market_collection.py

      - name: Re-prove D2R raw TRAIN boundary
        run: python scripts/check_oss3d2r_raw_training_bundle_provenance_boundary.py

      - name: Re-prove D2S raw DEVELOPMENT boundary
        run: python scripts/check_oss3d2s_raw_development_provenance_boundary.py

      - name: Research authority boundary
        run: python scripts/check_research_authority.py

      - name: Prove D3A has no acquisition or network runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('labs/oss3_qlib/stable_rehydrated_raw_split.py').read_text().lower()
          for marker in (
              'urlopen(', 'requests.', 'httpx.', 'socket.socket(', 'subprocess.',
              'acquire_preregistered_archive(', 'build_real_archive_transport(',
              'run_restart_safe_campaign(',
          ):
              assert marker not in source, marker
          print('D3A acquisition/network/process runtime surface: ABSENT')
          PY

      - name: Re-prove Qlib was never installed
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('qlib') is None, 'D3A unexpectedly gained Qlib runtime authority'
          print('qlib runtime after D3A certification: ABSENT')
          PY
