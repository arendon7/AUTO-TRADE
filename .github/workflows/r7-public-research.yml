name: R7 Public Research Matrix

on:
  push:
    branches: ["feature/r7-strategy-foundation"]
    paths:
      - ".github/workflows/r7-public-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    name: ${{ matrix.symbol }}-${{ matrix.interval }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - symbol: BTCUSDT
            interval: 1h
            price_tick: "0.01"
            quantity_step: "0.00001"
            research_quantity: "0.10"
            train_bars: 1800
            development_bars: 2401
            wf_train: 600
            wf_eval: 300
            wf_step: 300
          - symbol: ETHUSDT
            interval: 1h
            price_tick: "0.01"
            quantity_step: "0.0001"
            research_quantity: "2"
            train_bars: 1800
            development_bars: 2401
            wf_train: 600
            wf_eval: 300
            wf_step: 300
          - symbol: SOLUSDT
            interval: 1h
            price_tick: "0.01"
            quantity_step: "0.001"
            research_quantity: "50"
            train_bars: 1800
            development_bars: 2401
            wf_train: 600
            wf_eval: 300
            wf_step: 300
          - symbol: BTCUSDT
            interval: 4h
            price_tick: "0.01"
            quantity_step: "0.00001"
            research_quantity: "0.10"
            train_bars: 500
            development_bars: 801
            wf_train: 300
            wf_eval: 100
            wf_step: 100
          - symbol: ETHUSDT
            interval: 4h
            price_tick: "0.01"
            quantity_step: "0.0001"
            research_quantity: "2"
            train_bars: 500
            development_bars: 801
            wf_train: 300
            wf_eval: 100
            wf_step: 100
          - symbol: SOLUSDT
            interval: 4h
            price_tick: "0.01"
            quantity_step: "0.001"
            research_quantity: "50"
            train_bars: 500
            development_bars: 801
            wf_train: 300
            wf_eval: 100
            wf_step: 100

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Run fixed DEVELOPMENT campaign
        env:
          CAMPAIGN_ID: ${{ matrix.symbol }}-${{ matrix.interval }}-fixed-20250901-20260601
        run: |
          python scripts/run_r7_binance_development.py \
            --symbol "${{ matrix.symbol }}" \
            --interval "${{ matrix.interval }}" \
            --start "2025-09-01T00:00:00Z" \
            --end "2026-06-01T00:00:00Z" \
            --train-bars "${{ matrix.train_bars }}" \
            --development-bars "${{ matrix.development_bars }}" \
            --price-tick "${{ matrix.price_tick }}" \
            --quantity-step "${{ matrix.quantity_step }}" \
            --research-quantity "${{ matrix.research_quantity }}" \
            --initial-cash "100000" \
            --fee-bps "10" \
            --half-spread-bps "2" \
            --slippage-bps "5" \
            --max-leverage "1" \
            --max-volume-participation "0.01" \
            --min-net-return "-0.05" \
            --min-sharpe "0.25" \
            --max-drawdown "0.25" \
            --min-profit-factor "1.0" \
            --min-fills "5" \
            --pbo-partitions "8" \
            --walk-forward-train-bars "${{ matrix.wf_train }}" \
            --walk-forward-evaluation-bars "${{ matrix.wf_eval }}" \
            --walk-forward-step-bars "${{ matrix.wf_step }}" \
            --walk-forward-min-folds "3" \
            --min-positive-fold-ratio "0.50" \
            --min-median-fold-sharpe "0.0" \
            --min-worst-fold-net-return "-0.10" \
            --max-worst-fold-drawdown "0.30" \
            --min-stress-pass-ratio "0.6666666667" \
            --min-worst-stress-net-return "-0.10" \
            --max-worst-stress-drawdown "0.35" \
            --campaign-id "${CAMPAIGN_ID}" \
            --code-version "${GITHUB_SHA}" \
            --output-dir "artifacts/r7/${CAMPAIGN_ID}" \
            --enable-public-data

      - name: Prove HOLDOUT was not checked out
        env:
          CAMPAIGN_ID: ${{ matrix.symbol }}-${{ matrix.interval }}-fixed-20250901-20260601
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          campaign = os.environ["CAMPAIGN_ID"]
          report = Path("artifacts/r7") / campaign / f"{campaign}-report.json"
          payload = json.loads(report.read_text(encoding="utf-8"))
          holdout = payload["protected_holdout"]
          assert holdout["checked_out"] is False
          assert holdout["bar_count"] > 0
          assert len(holdout["dataset_hash"]) == 64
          print(f"HOLDOUT protected: {holdout['bar_count']} bars {holdout['dataset_hash'][:12]}")
          PY

      - name: Upload campaign evidence
        uses: actions/upload-artifact@v4
        with:
          name: r7-${{ matrix.symbol }}-${{ matrix.interval }}
          path: artifacts/r7/${{ matrix.symbol }}-${{ matrix.interval }}-fixed-20250901-20260601/
          if-no-files-found: error
          retention-days: 30

  summary:
    name: Aggregate DEVELOPMENT evidence
    needs: research
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download successful campaign artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: r7-*
          path: artifacts/r7-matrix
          merge-multiple: true

      - name: Build immutable matrix summary
        run: |
          python scripts/summarize_r7_reports.py \
            artifacts/r7-matrix \
            artifacts/r7-matrix-summary.json

      - name: Upload matrix summary
        uses: actions/upload-artifact@v4
        with:
          name: r7-matrix-summary
          path: artifacts/r7-matrix-summary.json
          if-no-files-found: error
          retention-days: 30
