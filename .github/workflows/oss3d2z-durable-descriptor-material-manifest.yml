name: OSS-3D2Z Durable Descriptor Material Manifest

on:
  pull_request:
    branches:
      - research/oss3d2y-durable-real-campaign-evidence-seal
    paths:
      - 'src/autotrade/research/oss3_real_descriptor_identity.py'
      - 'tests/test_research_oss3_real_descriptor_identity.py'
      - 'scripts/check_oss3d2z_durable_descriptor_material_manifest_boundary.py'
      - 'knowledge/20_RESEARCH/OSS3D2Z_DURABLE_DESCRIPTOR_MATERIAL_MANIFEST.md'
      - 'knowledge/20_RESEARCH/evidence/OSS3D2Z_REAL_DESCRIPTOR_MATERIAL_MANIFEST.json'
      - '.github/workflows/oss3d2z-durable-descriptor-material-manifest.yml'
      - 'src/autotrade/research/oss3_real_campaign_evidence.py'
      - 'src/autotrade/research/oss3_market_collection.py'
      - 'src/autotrade/research/oss3_market_snapshot.py'

permissions:
  contents: read

jobs:
  oss3d2z:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install AUTO-TRADE core only
        run: python -m pip install -e '.[dev]'

      - name: Prove Qlib absent before D2Z
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('qlib') is None, 'D2Z workflow must remain Qlib-free'
          print('qlib runtime: ABSENT')
          PY

      - name: Compile D2Z sources
        run: |
          python -m py_compile \
            src/autotrade/research/oss3_real_descriptor_identity.py \
            tests/test_research_oss3_real_descriptor_identity.py \
            scripts/check_oss3d2z_durable_descriptor_material_manifest_boundary.py

      - name: D2Z durable descriptor material boundary
        run: python scripts/check_oss3d2z_durable_descriptor_material_manifest_boundary.py

      - name: D2Z deterministic and adversarial manifest suite
        run: python -m pytest -q tests/test_research_oss3_real_descriptor_identity.py

      - name: Re-prove D2Y durable real-campaign seal
        run: |
          python scripts/check_oss3d2y_durable_real_campaign_evidence_boundary.py
          python -m pytest -q tests/test_research_oss3_real_campaign_evidence.py

      - name: Re-prove D2X post-outage continuous-history root
        run: python scripts/check_oss3d2x_post_outage_continuous_history_boundary.py

      - name: Re-prove D2U V2 collection identity
        run: python -m pytest -q tests/test_research_oss3_market_collection.py

      - name: Re-prove D2T immutable snapshot normalizer
        run: python -m pytest -q tests/test_research_oss3_market_snapshot.py

      - name: Research authority boundary
        run: python scripts/check_research_authority.py

      - name: Prove D2Z certification has no network runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('src/autotrade/research/oss3_real_descriptor_identity.py').read_text().lower()
          for marker in ('urlopen(', 'requests.', 'httpx.', 'socket.socket(', 'subprocess.'):
              assert marker not in source, marker
          print('D2Z certification runtime network surface: ABSENT')
          PY

      - name: Re-prove Qlib was never installed
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('qlib') is None, 'D2Z unexpectedly gained Qlib runtime authority'
          print('qlib runtime after D2Z certification: ABSENT')
          PY
