name: R6 Repair Writer Human Binding Helper One Shot

on:
  push:
    branches: ["reconstruction/r6-external-paper-protection"]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore(r6) repair writer human binding helper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Repair helper anchor
        run: python scripts/r6_fix_writer_human_binding_helper.py
      - name: Verify helper compiles
        run: python -m py_compile scripts/r6_bind_writer_to_human_execution.py
      - name: Publish repaired helper and self-clean
        run: |
          git config user.name arendon7
          git config user.email 102555888+arendon7@users.noreply.github.com
          git rm -f scripts/r6_fix_writer_human_binding_helper.py .github/workflows/r6-fix-writer-human-binding-helper-one-shot.yml
          git add scripts/r6_bind_writer_to_human_execution.py
          git commit -m "fix(r6): repair writer human binding helper anchor"
          git push origin HEAD:reconstruction/r6-external-paper-protection
