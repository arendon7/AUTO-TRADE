name: OSS-3D3H One-Shot Lightweight Campaign ID Fix

on:
  push:
    branches:
      - research/oss3d3h-d2k-replay-readiness-seal
    paths:
      - '.github/workflows/oss3d3h-one-shot-lightweight-campaign-id-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: research/oss3d3h-d2k-replay-readiness-seal
          fetch-depth: 0
      - name: Remove heavyweight D3A module import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('labs/oss3_qlib/d2k_replay_readiness.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'from labs.oss3_qlib.real_development_campaign import REAL_CAMPAIGN_ID\n'
          if text.count(old_import) != 1:
              raise SystemExit(f'unexpected REAL_CAMPAIGN_ID import count: {text.count(old_import)}')
          text = text.replace(old_import, '')
          anchor = 'REVIEW_FRONTIER = "SEPARATE_EXPLICIT_D2K_ONE_SHOT_AUTHORIZATION_REVIEW_ONLY"\n'
          replacement = anchor + 'REAL_CAMPAIGN_ID = "oss3d3a-real-development-campaign-v1"\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'unexpected REVIEW_FRONTIER anchor count: {text.count(anchor)}')
          text = text.replace(anchor, replacement)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          grep -n "REAL_CAMPAIGN_ID" labs/oss3_qlib/d2k_replay_readiness.py
      - name: Commit source-only correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/oss3_qlib/d2k_replay_readiness.py
          git commit -m 'fix(oss3d3h): keep replay preparation core-only'
          git push origin HEAD:research/oss3d3h-d2k-replay-readiness-seal
