name: Knowledge Contract

on:
  push:
    branches: [main, stable, "foundation/**", "feature/**", "reconstruction/**"]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  canonical-memory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate canonical knowledge and safety baseline
        run: python scripts/check_knowledge_contract.py

  oss3d3a-certify-exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      D3A_SOURCE_SHA: 2cb202f4aa821af97d36a041c7034194c3594e64
      D3A_ARTIFACT_DIR: ${{ runner.temp }}/oss3d3a-source-artifact
      D3A_REHYDRATE_PARENT: ${{ runner.temp }}/oss3d3a-rehydrate-parent
      D3A_EVIDENCE_ROOT: ${{ runner.temp }}/oss3d3a-rehydrate-parent/oss3d3a-certified-d2y-evidence
      D3A_REHYDRATION_JSON: ${{ runner.temp }}/oss3d3a-rehydration.json
      D3A_WORK_ROOT: ${{ runner.temp }}/oss3d3a-model-work
      D3A_RESULT_JSON: ${{ runner.temp }}/oss3d3a-real-development-result.json
    steps:
      - name: Checkout exact D3A scientific source
        uses: actions/checkout@v5
        with:
          ref: 2cb202f4aa821af97d36a041c7034194c3594e64
          fetch-depth: 0

      - name: Prove exact D3A scientific source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$D3A_SOURCE_SHA"
          echo "D3A source SHA: $D3A_SOURCE_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install AUTO-TRADE core only
        run: python -m pip install -e '.[dev]'

      - name: Prove Qlib absent before real-data rehydration
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('qlib') is None
          print('qlib runtime before D3A rehydration: ABSENT')
          PY

      - name: Compile D3A sources
        run: |
          python -m py_compile \
            labs/oss3_market_data/real_campaign_rehydration.py \
            labs/oss3_qlib/real_development_campaign.py \
            labs/oss3_qlib/tests/test_real_development_campaign.py \
            scripts/run_oss3d3a_rehydration.py \
            scripts/run_oss3d3a_real_development_campaign.py \
            scripts/check_oss3d3a_real_development_campaign_boundary.py

      - name: D3A real DEVELOPMENT campaign boundary
        run: python scripts/check_oss3d3a_real_development_campaign_boundary.py

      - name: Re-prove D2Z durable descriptor identities
        run: |
          python scripts/check_oss3d2z_durable_descriptor_material_manifest_boundary.py
          python -m pytest -q tests/test_research_oss3_real_descriptor_identity.py

      - name: Download exact certified D2Y real campaign artifact
        uses: actions/download-artifact@v4
        with:
          name: oss3d2x-v2-real-campaign-20260908
          path: ${{ env.D3A_ARTIFACT_DIR }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34309982898

      - name: Rehydrate and verify exact real campaign with Qlib absent
        run: |
          python scripts/run_oss3d3a_rehydration.py \
            --artifact-dir "$D3A_ARTIFACT_DIR" \
            --extraction-parent "$D3A_REHYDRATE_PARENT" \
            --repository-root "$GITHUB_WORKSPACE" \
            --output "$D3A_REHYDRATION_JSON"

      - name: Inspect core-only rehydration evidence
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads(Path(os.environ['D3A_REHYDRATION_JSON']).read_text())
          assert d['source_inventory_verified'] is True
          assert d['source_tar_verified'] is True
          assert d['exact_extracted_file_family_verified'] is True
          assert d['d2z_descriptor_identities_verified'] == 99
          assert d['d2w_offline_reverification_complete'] is True
          assert d['network_used_during_rehydration'] is False
          assert d['qlib_runtime_used'] is False
          assert d['development_labels_materialized'] is False
          assert d['development_metrics_computed'] is False
          assert d['final_holdout_observed'] is False
          assert d['capital_authority'] == 'NONE'
          assert d['live_trading'] == 'BLOCKED'
          print('D3A exact real campaign rehydration evidence: PASS')
          print('D2W evidence:', d['d2w_evidence_fingerprint'])
          PY

      - name: Re-prove Qlib remained absent through rehydration
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('qlib') is None
          print('qlib runtime after D3A rehydration: ABSENT')
          PY

      - name: Install exact frozen Qlib runtime
        run: python -m pip install 'pyqlib==0.9.7'

      - name: Prove exact Qlib version
        run: |
          python - <<'PY'
          from importlib.metadata import version
          assert version('pyqlib') == '0.9.7'
          print('pyqlib:', version('pyqlib'))
          PY

      - name: Run exact six-model real DEVELOPMENT campaign
        run: |
          python scripts/run_oss3d3a_real_development_campaign.py \
            --evidence-root "$D3A_EVIDENCE_ROOT" \
            --work-root "$D3A_WORK_ROOT" \
            --rehydration-evidence "$D3A_REHYDRATION_JSON" \
            --repository-root "$GITHUB_WORKSPACE" \
            --output "$D3A_RESULT_JSON"

      - name: Inspect real DEVELOPMENT scientific outcome
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads(Path(os.environ['D3A_RESULT_JSON']).read_text())
          assert d['status'] in {'COMPLETED', 'PRELABEL_BLOCKED'}
          assert len(d['candidate_output_hashes']) == 6
          assert len(d['structural_profiles']) == 6
          assert d['predictions_frozen_before_development_labels'] is True
          assert d['family_retuned'] is False
          assert d['fallback_candidate_used'] is False
          assert d['reselection_allowed'] is False
          assert d['statistical_significance_claim_authorized'] is False
          assert d['profitability_claim_authorized'] is False
          assert d['final_holdout_observed'] is False
          assert d['final_holdout_authorized'] is False
          assert d['holdout_permit_consumed'] is False
          assert d['promotion_authorized'] is False
          assert d['execution_authorized'] is False
          assert d['paper_execution_authorized'] is False
          assert d['capital_authority'] == 'NONE'
          assert d['live_trading'] == 'BLOCKED'
          print('D3A REAL DEVELOPMENT STATUS:', d['status'])
          print('EVALUABLE:', ','.join(d['evaluable_candidate_ids']) or 'NONE')
          for item in d['structural_profiles']:
              print('PROFILE', item['candidate_id'], 'evaluable=', item['evaluable'],
                    'nonconstant_cross_sections=', item['nonconstant_cross_section_count'], '/', item['cross_section_count'])
          if d['status'] == 'COMPLETED':
              assert len(d['evaluable_candidate_ids']) >= 2
              assert d['development_labels_materialized'] is True
              assert d['development_metrics_computed'] is True
              assert d['selected_trial_id'] in d['evaluable_candidate_ids']
              assert d['d2i_winner_seal_fingerprint']
              print('D2I WINNER:', d['selected_trial_id'])
              print('PRIMARY METRIC:', d['winner_primary_metric'])
              print('RAW P:', d['winner_raw_p_value'])
              print('HOLM P:', d['winner_holm_adjusted_p_value'])
              for item in d['candidate_results']:
                  print('RESULT', item['candidate_id'], item['status'], item['primary_metric'], item['raw_p_value'])
          else:
              assert len(d['evaluable_candidate_ids']) < 2
              assert d['development_labels_materialized'] is False
              assert d['development_metrics_computed'] is False
              assert d['selected_trial_id'] is None
              print('D3A stopped pre-label by frozen structural policy; no retuning is permitted.')
          PY

      - name: D3A deterministic structural and governance tests
        run: python -m pytest -q labs/oss3_qlib/tests/test_real_development_campaign.py

      - name: Re-prove upstream research boundaries
        run: |
          python scripts/check_oss3d2y_durable_real_campaign_evidence_boundary.py
          python scripts/check_oss3d2x_post_outage_continuous_history_boundary.py
          python scripts/check_oss3d2w_sealed_raw_split_handoff_boundary.py
          python scripts/check_oss3d2r_raw_training_bundle_provenance_boundary.py
          python scripts/check_oss3d2s_raw_development_provenance_boundary.py
          python scripts/check_oss3d2h_family_evaluation_batch_boundary.py
          python scripts/check_oss3d2i_development_winner_seal_boundary.py

      - name: Research authority boundary
        run: python scripts/check_research_authority.py

      - name: Prove D3A source has no FINAL_HOLDOUT execution surface
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('labs/oss3_qlib/real_development_campaign.py').read_text().lower()
          forbidden = (
              'holdoutpermit', 'consume_holdout_permit', 'evaluate_oss2_final_holdout',
              'protectedoss2finalholdout', 'submit_order', 'place_order', 'orderintent',
          )
          for marker in forbidden:
              assert marker not in source, marker
          print('D3A FINAL_HOLDOUT / execution surface: ABSENT')
          PY

      - name: Upload D3A scientific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oss3d3a-real-development-evidence-2cb202f4aa821af97d36a041c7034194c3594e64
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ env.D3A_REHYDRATION_JSON }}
            ${{ env.D3A_RESULT_JSON }}
