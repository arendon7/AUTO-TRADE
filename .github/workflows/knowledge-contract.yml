name: Knowledge Contract

on:
  push:
    branches: [main, stable, "foundation/**", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  canonical-memory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate canonical knowledge and safety baseline
        run: python scripts/check_knowledge_contract.py
