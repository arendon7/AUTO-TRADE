name: OSS-3D2U Historical Collection Acquisition

on:
  pull_request:
    branches:
      - research/oss3d2t-immutable-market-snapshot
    paths:
      - 'src/autotrade/research/oss3_market_collection.py'
      - 'labs/oss3_market_data/archive_acquisition.py'
      - 'tests/test_research_oss3_market_collection.py'
      - 'labs/oss3_market_data/tests/test_archive_acquisition.py'
      - 'scripts/check_oss3d2u_historical_collection_acquisition_boundary.py'
      - 'knowledge/20_RESEARCH/OSS3D2U_HISTORICAL_COLLECTION_ACQUISITION.md'
      - '.github/workflows/oss3d2u-historical-collection-acquisition.yml'
      - 'src/autotrade/research/oss3_market_snapshot.py'
      - 'src/autotrade/research/external_data.py'
      - 'src/autotrade/research/market.py'
      - 'src/autotrade/research/universe.py'
      - 'labs/oss3_qlib/raw_training_bundle_provenance.py'
      - 'labs/oss3_qlib/raw_development_provenance.py'

permissions:
  contents: read

jobs:
  oss3d2u:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install AUTO-TRADE core only
        run: python -m pip install -e '.[dev]'

      - name: Prove Qlib is absent from D2U runtime
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('qlib') is None, 'D2U workflow must remain Qlib-free'
          print('qlib runtime: ABSENT')
          PY

      - name: Compile D2U sources
        run: |
          python -m py_compile \
            src/autotrade/research/oss3_market_collection.py \
            labs/oss3_market_data/archive_acquisition.py \
            tests/test_research_oss3_market_collection.py \
            labs/oss3_market_data/tests/test_archive_acquisition.py \
            scripts/check_oss3d2u_historical_collection_acquisition_boundary.py

      - name: D2U collection/acquisition authority boundary
        run: python scripts/check_oss3d2u_historical_collection_acquisition_boundary.py

      - name: D2U finite plan registry and partition assembly
        run: python -m pytest -q tests/test_research_oss3_market_collection.py

      - name: D2U triple-checksum acquisition adversarial suite
        run: python -m pytest -q labs/oss3_market_data/tests/test_archive_acquisition.py

      - name: Re-prove D2T immutable snapshot contract
        run: |
          python scripts/check_oss3d2t_immutable_market_snapshot_boundary.py
          python -m pytest -q \
            tests/test_research_oss3_market_snapshot.py \
            tests/test_research_oss3_market_snapshot_monthly.py

      - name: Re-prove R3 public GET-only transport contracts
        run: |
          python -m pytest -q \
            tests/test_r3_external_data.py \
            tests/test_r3_external_data_hardening.py

      - name: Re-prove raw downstream provenance boundaries
        run: |
          python scripts/check_oss3d2q_raw_market_feature_provenance_boundary.py
          python scripts/check_oss3d2r_raw_training_bundle_provenance_boundary.py
          python scripts/check_oss3d2s_raw_development_provenance_boundary.py

      - name: Research authority boundary
        run: python scripts/check_research_authority.py

      - name: Prove CI made no real public-data request
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/oss3d2u-historical-collection-acquisition.yml').read_text()
          forbidden = (
              'cu' + 'rl ',
              'wg' + 'et ',
              'data.binance.vision' + '/data/',
              'AUTOTRADE_ENABLE_R3_REAL_' + 'DATA=1',
          )
          for marker in forbidden:
              assert marker not in workflow, f'real network marker in D2U CI: {marker}'
          print('D2U CI real network: ABSENT')
          PY

      - name: Re-prove Qlib was never installed
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('qlib') is None, 'D2U unexpectedly gained Qlib runtime authority'
          print('qlib runtime after D2U certification: ABSENT')
          PY
