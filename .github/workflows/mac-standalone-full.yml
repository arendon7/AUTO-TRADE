name: Mac FULL Standalone Artifact

on:
  push:
    branches: ["reconstruction/**"]
    paths:
      - "AUTO_TRADE_MAC.command"
      - "ABRIR_AUTO_TRADE.command"
      - "INSTALAR_AUTO_TRADE.command"
      - "LEEME_PRIMERO_MAC.md"
      - "web/**"
      - "scripts/mac_*.sh"
      - "scripts/mac_*.py"
      - "scripts/check_mac_*.py"
      - "scripts/r6_*.py"
      - "src/autotrade/**"
      - "tests/test_mac_*.py"
      - "tests/test_r6_*.py"
      - "pyproject.toml"
      - ".github/workflows/mac-standalone-full.yml"
  pull_request:
    paths:
      - "AUTO_TRADE_MAC.command"
      - "ABRIR_AUTO_TRADE.command"
      - "INSTALAR_AUTO_TRADE.command"
      - "LEEME_PRIMERO_MAC.md"
      - "web/**"
      - "scripts/mac_*.sh"
      - "scripts/mac_*.py"
      - "scripts/check_mac_*.py"
      - "scripts/r6_*.py"
      - "src/autotrade/**"
      - "tests/test_mac_*.py"
      - "tests/test_r6_*.py"
      - "pyproject.toml"
      - ".github/workflows/mac-standalone-full.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-universal:
    runs-on: macos-15
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up build Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Static standalone safety boundary
        run: python scripts/check_mac_standalone_boundary.py

      - name: Static Control Center safety boundary
        run: python scripts/check_mac_dashboard_boundary.py

      - name: Build universal offline wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="$RUNNER_TEMP/autotrade-standalone-assets"
          WHEELHOUSE="$ASSETS/wheels"
          mkdir -p "$WHEELHOUSE"
          python -m pip install --upgrade pip 'setuptools>=75' wheel
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir "$WHEELHOUSE"

          python -m pip download \
            --dest "$WHEELHOUSE" \
            --only-binary=:all: \
            --platform macosx_11_0_arm64 \
            --python-version 312 \
            --implementation cp \
            --abi cp312 \
            'websockets==16.1.1' 'pytest>=8.3,<9' 'pytest-cov>=5,<7'

          python -m pip download \
            --dest "$WHEELHOUSE" \
            --only-binary=:all: \
            --platform macosx_10_13_x86_64 \
            --python-version 312 \
            --implementation cp \
            --abi cp312 \
            'websockets==16.1.1' 'pytest>=8.3,<9' 'pytest-cov>=5,<7'

          (
            cd "$WHEELHOUSE"
            find . -maxdepth 1 -type f -name '*.whl' -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS
          )
          test -s "$WHEELHOUSE/SHA256SUMS"

      - name: Download and verify pinned dual-arch CPython runtime
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_DIR="$RUNNER_TEMP/autotrade-standalone-assets/runtime"
          mkdir -p "$RUNTIME_DIR"
          ARM_FILE="$RUNTIME_DIR/cpython-3.12.13-20260718-arm64.tar.gz"
          INTEL_FILE="$RUNTIME_DIR/cpython-3.12.13-20260718-x86_64.tar.gz"

          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            'https://github.com/astral-sh/python-build-standalone/releases/download/20260718/cpython-3.12.13%2B20260718-aarch64-apple-darwin-install_only.tar.gz' \
            --output "$ARM_FILE"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            'https://github.com/astral-sh/python-build-standalone/releases/download/20260718/cpython-3.12.13%2B20260718-x86_64-apple-darwin-install_only.tar.gz' \
            --output "$INTEL_FILE"

          echo '62aeee6161d57303a71a138b75fd5cc6fb8c89c4b1d9c7f0a052d89fa0b6652b  cpython-3.12.13-20260718-arm64.tar.gz' > "$RUNTIME_DIR/SHA256SUMS"
          echo '10b47148de86f9d87ba6e96a3db606ced90a206a3454d7d6d8fa68536a05d81f  cpython-3.12.13-20260718-x86_64.tar.gz' >> "$RUNTIME_DIR/SHA256SUMS"
          (
            cd "$RUNTIME_DIR"
            shasum -a 256 -c SHA256SUMS
          )

      - name: Build FULL standalone package
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          ASSETS="$RUNNER_TEMP/autotrade-standalone-assets"
          PKG="dist/AUTO-TRADE-R6-MAC-FULL"
          ZIP="dist/AUTO-TRADE-R6-MAC-FULL.zip"
          rm -rf dist
          mkdir -p "$PKG/vendor/runtime" "$PKG/vendor/wheels"

          rsync -a ./ "$PKG/" \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude '.runtime' \
            --exclude '.env' \
            --exclude 'dist' \
            --exclude '.pytest_cache' \
            --exclude '.coverage' \
            --exclude 'coverage.json' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '*.sqlite3' \
            --exclude '*.sqlite3-*'

          cp "$ASSETS/runtime/"*.tar.gz "$PKG/vendor/runtime/"
          cp "$ASSETS/runtime/SHA256SUMS" "$PKG/vendor/runtime/SHA256SUMS"
          cp "$ASSETS/wheels/"*.whl "$PKG/vendor/wheels/"
          cp "$ASSETS/wheels/SHA256SUMS" "$PKG/vendor/wheels/SHA256SUMS"

          chmod +x "$PKG/AUTO_TRADE_MAC.command" "$PKG/ABRIR_AUTO_TRADE.command" "$PKG/INSTALAR_AUTO_TRADE.command"
          chmod +x "$PKG/scripts/mac_bootstrap.sh" "$PKG/scripts/mac_rehearsal.sh" "$PKG/scripts/mac_start.sh"

          cat > "$PKG/MAC_STANDALONE_MANIFEST.txt" <<EOF
          AUTO-TRADE R6 MAC FULL/STANDALONE
          manifest_version=1
          source_head=${SOURCE_SHA}
          python_version=3.12.13
          python_build_release=20260718
          supported_architectures=arm64,x86_64
          runtime_arm64_sha256=62aeee6161d57303a71a138b75fd5cc6fb8c89c4b1d9c7f0a052d89fa0b6652b
          runtime_x86_64_sha256=10b47148de86f9d87ba6e96a3db606ced90a206a3454d7d6d8fa68536a05d81f
          offline_wheelhouse=YES
          homebrew_required=NO
          system_python_required=NO
          pypi_required_at_first_launch=NO
          external_post_authorized=NO
          live_trading=BLOCKED
          EOF

          cat > "$PKG/MAC_BUILD_INFO.txt" <<EOF
          AUTO-TRADE R6 MAC FULL/STANDALONE PACKAGE
          source_head=${SOURCE_SHA}
          branch=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
          python_runtime=EMBEDDED_DUAL_ARCH_3.12.13
          offline_install=YES
          homebrew_required=NO
          system_python_required=NO
          pypi_required_at_first_launch=NO
          control_center=LOCALHOST_ONLY
          external_paper_write=DISABLED_BY_LAUNCHER
          live_trading=BLOCKED
          broker_credentials_in_package=NO
          external_order_submitted_by_build=NO
          finder_order_execution_surface=NO
          EOF

          ditto -c -k --sequesterRsrc --keepParent "$PKG" "$ZIP"
          (
            cd dist
            shasum -a 256 AUTO-TRADE-R6-MAC-FULL.zip > AUTO-TRADE-R6-MAC-FULL.zip.sha256
          )

          SIZE_BYTES="$(stat -f%z "$ZIP")"
          echo "standalone_zip_size_bytes=${SIZE_BYTES}"
          if (( SIZE_BYTES < 40000000 )); then
            echo "ERROR: FULL/STANDALONE archive is suspiciously small: ${SIZE_BYTES} bytes" >&2
            exit 1
          fi

      - name: Verify FULL package contents and no execution surface
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SOURCE_SHA="$(git rev-parse HEAD)"
          cd dist
          shasum -a 256 -c AUTO-TRADE-R6-MAC-FULL.zip.sha256
          unzip -l AUTO-TRADE-R6-MAC-FULL.zip | grep -q 'AUTO-TRADE-R6-MAC-FULL/MAC_STANDALONE_MANIFEST.txt'
          unzip -l AUTO-TRADE-R6-MAC-FULL.zip | grep -q 'AUTO-TRADE-R6-MAC-FULL/vendor/runtime/cpython-3.12.13-20260718-arm64.tar.gz'
          unzip -l AUTO-TRADE-R6-MAC-FULL.zip | grep -q 'AUTO-TRADE-R6-MAC-FULL/vendor/runtime/cpython-3.12.13-20260718-x86_64.tar.gz'
          unzip -l AUTO-TRADE-R6-MAC-FULL.zip | grep -q 'AUTO-TRADE-R6-MAC-FULL/vendor/wheels/auto_trade_core-0.4.0.dev0-py3-none-any.whl'
          unzip -l AUTO-TRADE-R6-MAC-FULL.zip | grep -q 'AUTO-TRADE-R6-MAC-FULL/ABRIR_AUTO_TRADE.command'
          unzip -l AUTO-TRADE-R6-MAC-FULL.zip | grep -q 'AUTO-TRADE-R6-MAC-FULL/INSTALAR_AUTO_TRADE.command'
          unzip -l AUTO-TRADE-R6-MAC-FULL.zip | grep -q 'AUTO-TRADE-R6-MAC-FULL/web/mac_dashboard.html'
          unzip -l AUTO-TRADE-R6-MAC-FULL.zip | grep -q 'AUTO-TRADE-R6-MAC-FULL/scripts/mac_dashboard.py'
          unzip -p AUTO-TRADE-R6-MAC-FULL.zip AUTO-TRADE-R6-MAC-FULL/MAC_BUILD_INFO.txt > /tmp/MAC_BUILD_INFO.txt
          grep -Fq "source_head=${EXPECTED_SOURCE_SHA}" /tmp/MAC_BUILD_INFO.txt
          grep -Fq 'offline_install=YES' /tmp/MAC_BUILD_INFO.txt
          grep -Fq 'homebrew_required=NO' /tmp/MAC_BUILD_INFO.txt
          grep -Fq 'system_python_required=NO' /tmp/MAC_BUILD_INFO.txt
          grep -Fq 'pypi_required_at_first_launch=NO' /tmp/MAC_BUILD_INFO.txt
          grep -Fq 'control_center=LOCALHOST_ONLY' /tmp/MAC_BUILD_INFO.txt
          if unzip -l AUTO-TRADE-R6-MAC-FULL.zip | grep -Eq '(^|/)(\.env|\.venv|\.runtime)(/|$)'; then
            echo 'ERROR: standalone package contains forbidden operational environment material' >&2
            exit 1
          fi
          for launcher in AUTO_TRADE_MAC.command ABRIR_AUTO_TRADE.command INSTALAR_AUTO_TRADE.command; do
            unzip -p AUTO-TRADE-R6-MAC-FULL.zip "AUTO-TRADE-R6-MAC-FULL/${launcher}" > "/tmp/${launcher}"
            for forbidden in \
              'r6_execute_paper_canary.py' \
              'r6_connectivity_bound_final_freshness.py' \
              '--execute-paper-canary' \
              'source .env' \
              'alpaca_paper_writer' \
              'stage_external_submission'; do
              if grep -Fq -- "$forbidden" "/tmp/${launcher}"; then
                echo "ERROR: ${launcher} contains forbidden execution surface: $forbidden" >&2
                exit 1
              fi
            done
          done
          grep -Fq 'scripts/mac_dashboard.py' /tmp/ABRIR_AUTO_TRADE.command
          grep -Fq 'scripts/mac_bootstrap.sh' /tmp/INSTALAR_AUTO_TRADE.command

      - name: Upload candidate for dual-arch boot tests
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-TRADE-R6-MAC-FULL-CANDIDATE
          path: |
            dist/AUTO-TRADE-R6-MAC-FULL.zip
            dist/AUTO-TRADE-R6-MAC-FULL.zip.sha256
          if-no-files-found: error
          retention-days: 3

  boot-test:
    needs: build-universal
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      PIP_NO_INDEX: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      R6_EXTERNAL_PAPER_WRITE: DISABLED
    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v5
        with:
          name: AUTO-TRADE-R6-MAC-FULL-CANDIDATE
          path: candidate

      - name: Verify checksum and architecture
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          shasum -a 256 -c AUTO-TRADE-R6-MAC-FULL.zip.sha256
          test "$(uname -m)" = '${{ matrix.arch }}'
          unzip -q AUTO-TRADE-R6-MAC-FULL.zip
          cd AUTO-TRADE-R6-MAC-FULL
          test -f MAC_STANDALONE_MANIFEST.txt
          test -x ABRIR_AUTO_TRADE.command
          test -x INSTALAR_AUTO_TRADE.command
          test ! -e .venv
          test ! -e .runtime

      - name: First user install using embedded runtime and offline wheels only
        shell: bash
        run: |
          set -euo pipefail
          cd candidate/AUTO-TRADE-R6-MAC-FULL
          unset APCA_API_KEY_ID APCA_API_SECRET_KEY || true
          export PIP_INDEX_URL='http://127.0.0.1:9/forbidden'
          export PIP_EXTRA_INDEX_URL='http://127.0.0.1:9/forbidden'
          bash INSTALAR_AUTO_TRADE.command | tee /tmp/autotrade-standalone-bootstrap.log
          grep -Fq 'standalone_mode=YES' /tmp/autotrade-standalone-bootstrap.log
          grep -Fq 'AUTO-TRADE R6 INSTALL: OK' /tmp/autotrade-standalone-bootstrap.log
          test -x ".runtime/${{ matrix.arch }}/python/bin/python3"
          test -x .venv/bin/python
          .venv/bin/python - <<'PY'
          import sys
          import autotrade
          assert sys.version_info[:3] == (3, 12, 13)
          print('embedded_runtime_import=PASS')
          PY
          .venv/bin/python scripts/check_mac_standalone_boundary.py
          .venv/bin/python scripts/check_mac_click_launcher_boundary.py
          .venv/bin/python scripts/check_mac_dashboard_boundary.py
          .venv/bin/python scripts/check_r6_precanary_status_boundary.py
          .venv/bin/pytest -q tests/test_mac_safe_console.py tests/test_mac_click_launcher.py tests/test_mac_dashboard.py tests/test_mac_doctor_provenance.py tests/test_r6_precanary_status.py

      - name: Control Center localhost smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd candidate/AUTO-TRADE-R6-MAC-FULL
          .venv/bin/python scripts/mac_dashboard.py --no-browser --port 18765 > /tmp/autotrade-dashboard.log 2>&1 &
          DASH_PID=$!
          cleanup() { kill "$DASH_PID" 2>/dev/null || true; wait "$DASH_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          READY=0
          for _ in {1..40}; do
            if curl --fail --silent --show-error http://127.0.0.1:18765/api/meta > /tmp/autotrade-dashboard-meta.json; then
              READY=1
              break
            fi
            sleep 0.25
          done
          test "$READY" = 1
          grep -Fq '"order_execution_from_dashboard":false' /tmp/autotrade-dashboard-meta.json
          grep -Fq '"live_trading":"BLOCKED"' /tmp/autotrade-dashboard-meta.json
          grep -Fq '"external_paper_write":"DISABLED"' /tmp/autotrade-dashboard-meta.json
          grep -Fq 'Order execution from dashboard: UNAVAILABLE' /tmp/autotrade-dashboard.log

      - name: Move package and prove venv recreation from embedded runtime
        shell: bash
        run: |
          set -euo pipefail
          mv candidate/AUTO-TRADE-R6-MAC-FULL "$RUNNER_TEMP/AUTO-TRADE-MOVED"
          cd "$RUNNER_TEMP/AUTO-TRADE-MOVED"
          rm -rf .runtime
          bash INSTALAR_AUTO_TRADE.command | tee /tmp/autotrade-standalone-moved.log
          grep -Fq 'standalone_mode=YES' /tmp/autotrade-standalone-moved.log
          grep -Fq 'AUTO-TRADE R6 INSTALL: OK' /tmp/autotrade-standalone-moved.log
          test -x ".runtime/${{ matrix.arch }}/python/bin/python3"
          .venv/bin/python -c 'import autotrade; print("moved_package_import=PASS")'

  publish:
    needs: [build-universal, boot-test]
    runs-on: ubuntu-24.04
    steps:
      - name: Download exact certified candidate
        uses: actions/download-artifact@v5
        with:
          name: AUTO-TRADE-R6-MAC-FULL-CANDIDATE
          path: release

      - name: Recheck final checksum and size
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c AUTO-TRADE-R6-MAC-FULL.zip.sha256
          SIZE_BYTES="$(stat -c%s AUTO-TRADE-R6-MAC-FULL.zip)"
          echo "certified_standalone_zip_size_bytes=${SIZE_BYTES}"
          test "$SIZE_BYTES" -ge 40000000

      - name: Upload certified FULL standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-TRADE-R6-MAC-FULL
          path: |
            release/AUTO-TRADE-R6-MAC-FULL.zip
            release/AUTO-TRADE-R6-MAC-FULL.zip.sha256
          if-no-files-found: error
          retention-days: 14
