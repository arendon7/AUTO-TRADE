name: OSS-3D2K One-Shot FINAL_HOLDOUT Evaluator

on:
  pull_request:
    branches:
      - research/oss3d2j-final-holdout-protocol
    paths:
      - 'labs/oss3_qlib/final_holdout_evaluator.py'
      - 'labs/oss3_qlib/tests/d2k_fixture.py'
      - 'labs/oss3_qlib/tests/test_final_holdout_evaluator.py'
      - 'scripts/check_oss3d2k_final_holdout_evaluator_boundary.py'
      - 'knowledge/20_RESEARCH/OSS3D2K_ONE_SHOT_FINAL_HOLDOUT_EVALUATOR.md'
      - '.github/workflows/oss3d2k-one-shot-final-holdout-evaluator.yml'
      - 'labs/oss3_qlib/final_holdout_protocol.py'
      - 'labs/oss3_qlib/development_winner_seal.py'
      - 'labs/oss3_qlib/family_evaluation_batch.py'
      - 'labs/oss3_qlib/family_model_contract.py'
      - 'labs/oss3_qlib/family_environment_attestation.py'
      - 'labs/oss3_qlib/environment_attestation.py'
      - 'labs/oss3_qlib/network_guard.py'
      - 'labs/oss3_qlib/requirements.txt'
      - 'src/autotrade/research/oss3_development_inference.py'
      - 'src/autotrade/research/oss3_factor_matrix_artifact.py'
      - 'src/autotrade/research/oss3_supervised_label_artifact.py'
      - 'src/autotrade/research/oss3_training_bundle.py'

permissions:
  contents: read

jobs:
  oss3d2k:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install AUTO-TRADE core only
        run: python -m pip install -e '.[dev]'
      - name: Compile D2K without importing Qlib
        run: |
          python -m py_compile \
            labs/oss3_qlib/final_holdout_evaluator.py \
            labs/oss3_qlib/tests/d2k_fixture.py \
            labs/oss3_qlib/tests/test_final_holdout_evaluator.py \
            scripts/check_oss3d2k_final_holdout_evaluator_boundary.py
      - name: D2K one-shot authority boundary before Qlib install
        run: python scripts/check_oss3d2k_final_holdout_evaluator_boundary.py
      - name: Re-prove D2J protocol before holdout runtime install
        run: |
          python scripts/check_oss3d2j_final_holdout_protocol_boundary.py
          python -m pytest -q labs/oss3_qlib/tests/test_final_holdout_protocol.py
      - name: Re-prove D2I and D2H upstream research boundaries
        run: |
          python scripts/check_oss3d2i_development_winner_seal_boundary.py
          python -m pytest -q labs/oss3_qlib/tests/test_development_winner_seal.py
          python scripts/check_oss3d2h_family_evaluation_batch_boundary.py
          python -m pytest -q \
            labs/oss3_qlib/tests/test_family_evaluation_batch.py \
            labs/oss3_qlib/tests/test_family_evaluation_batch_binding_immutability.py
      - name: Install pinned Qlib runtime
        run: python -m pip install -r labs/oss3_qlib/requirements.txt
      - name: Assert exact pyqlib runtime
        run: |
          python - <<'PY'
          import importlib.metadata
          version = importlib.metadata.version('pyqlib')
          assert version == '0.9.7', version
          print(f'pyqlib=={version}')
          PY
      - name: D2K real-runtime durable-checkout and adversarial tests
        run: python -m pytest -q labs/oss3_qlib/tests/test_final_holdout_evaluator.py
      - name: Re-run six-candidate D2G real-runtime proof
        run: python -m pytest -q labs/oss3_qlib/tests/test_family_runner.py
      - name: D2E and D2D regressions
        run: |
          python -m pytest -q tests/test_research_oss3_development_model_tournament.py
          python scripts/check_oss3d2e_development_model_tournament_boundary.py
          python -m pytest -q tests/test_research_oss3_development_evaluation.py
          python scripts/check_oss3d2d_development_evaluation_boundary.py
      - name: Research authority
        run: python scripts/check_research_authority.py
      - name: Existing one-shot FINAL_HOLDOUT governance regression
        run: |
          python -m pytest -q \
            tests/test_research_oss2_final_holdout_evaluation.py \
            tests/test_research_oss2_final_holdout_evaluation_adversarial.py \
            tests/test_research_oss2_final_holdout_evaluation_edges.py
          python scripts/check_oss2h_final_holdout_evaluation_boundary.py
