name: R3 Statistical Governance One-Shot Patch

on:
  push:
    branches: ["reconstruction/r3-real-data-governance"]
    paths: [".r3stats/TRIGGER"]

permissions:
  contents: write

jobs:
  apply-reviewed-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r3-real-data-governance
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python .r3stats/apply.py
      - run: python -m compileall -q src tests scripts
      - name: Commit self-cleaned result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(r3): correct CSCV and Deflated Sharpe governance"
          git push origin HEAD:reconstruction/r3-real-data-governance
