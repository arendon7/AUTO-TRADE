name: W86 PAPER Runtime Read-Only Pipeline

on:
  pull_request:
    paths:
      - "src/autotrade/paper_runtime_read_only_pipeline.py"
      - "src/autotrade/paper_runtime_funding_capacity.py"
      - "src/autotrade/paper_runtime_final_readiness.py"
      - "src/autotrade/paper_runtime_broker_truth.py"
      - "src/autotrade/paper_runtime_asset_truth.py"
      - "src/autotrade/paper_runtime_market_truth.py"
      - "src/autotrade/paper_runtime_safety_health_truth.py"
      - "tests/test_w86_paper_runtime_read_only_pipeline.py"
      - "tests/test_w86_paper_runtime_read_only_pipeline_hardening.py"
      - "tests/test_w86_paper_runtime_funding_capacity.py"
      - "tests/test_w86_paper_runtime_funding_capacity_hardening.py"
      - "scripts/check_w86_paper_runtime_read_only_pipeline_boundary.py"
      - "scripts/check_w86_paper_runtime_funding_capacity_boundary.py"
      - ".github/workflows/w86-paper-runtime-read-only-pipeline.yml"
      - ".github/workflows/core-tests.yml"

permissions:
  contents: read

jobs:
  paper-runtime-read-only-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile W86 read-only pipeline surface
        run: >-
          python -m compileall -q
          src/autotrade/paper_runtime_read_only_pipeline.py
          tests/test_w86_paper_runtime_read_only_pipeline.py
          tests/test_w86_paper_runtime_read_only_pipeline_hardening.py
          scripts/check_w86_paper_runtime_read_only_pipeline_boundary.py
      - name: W86 read-only runtime pipeline boundary
        run: python scripts/check_w86_paper_runtime_read_only_pipeline_boundary.py
      - name: W86 read-only runtime pipeline adversarial tests
        run: >-
          pytest -q
          tests/test_w86_paper_runtime_read_only_pipeline.py
          tests/test_w86_paper_runtime_read_only_pipeline_hardening.py
      - name: Re-prove W86 funding-capacity tests
        run: >-
          pytest -q
          tests/test_w86_paper_runtime_funding_capacity.py
          tests/test_w86_paper_runtime_funding_capacity_hardening.py
      - name: Re-prove W86 funding-capacity boundary
        run: python scripts/check_w86_paper_runtime_funding_capacity_boundary.py
      - name: Re-prove W86 final readiness tests
        run: pytest -q tests/test_w86_paper_runtime_final_readiness.py
      - name: Re-prove W86 final readiness boundary
        run: python scripts/check_w86_paper_runtime_final_readiness_boundary.py
      - name: Re-prove W86 broker truth
        run: python scripts/check_w86_paper_runtime_broker_truth_boundary.py
      - name: Re-prove W86 asset truth
        run: python scripts/check_w86_paper_runtime_asset_truth_boundary.py
      - name: Re-prove W86 market truth
        run: python scripts/check_w86_paper_runtime_market_truth_boundary.py
      - name: Re-prove W86 Safety Health truth
        run: python scripts/check_w86_paper_runtime_safety_health_truth_boundary.py
      - name: Re-prove W85 candidate admission
        run: python scripts/check_w85_paper_candidate_admission_boundary.py
      - name: Re-prove R6 PAPER-only authority boundary
        run: python scripts/check_r6_authority.py
      - name: Re-prove R6 permanent LIVE deny
        run: python scripts/check_r6_live_deny_boundary.py
      - name: Re-prove research authority
        run: python scripts/check_research_authority.py
