name: R6 Durable Ambiguity Milestone Certification

on:
  push:
    branches:
      - reconstruction/r6-external-paper-protection
    paths:
      - .github/workflows/r6-ambiguity-cert-one-shot.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Full regression and branch coverage
        run: |
          python -m compileall -q src tests scripts
          pytest --cov=autotrade --cov-report=term-missing --cov-report=json:coverage-r6.json --junitxml=pytest-r6.xml
      - name: Permanent authority and canon gates
        run: |
          python scripts/check_contract_registry.py
          python scripts/check_research_authority.py
          python scripts/check_r5_authority.py
          python scripts/check_r6_authority.py
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Prove patch infrastructure is clean
        run: |
          test ! -e scripts/r6_patch_submission_guard.py
          test ! -e .github/workflows/r6-patch-submission-guard-one-shot.yml
      - name: Write permanent milestone evidence
        env:
          OUT: knowledge/60_EVIDENCE/R6_SUBMISSION_AMBIGUITY_MILESTONE.json
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          coverage = json.loads(Path('coverage-r6.json').read_text())
          root = ET.parse('pytest-r6.xml').getroot()
          tests = int(root.attrib.get('tests', '0'))
          failures = int(root.attrib.get('failures', '0'))
          errors = int(root.attrib.get('errors', '0'))
          skipped = int(root.attrib.get('skipped', '0'))
          if failures or errors:
              raise SystemExit('cannot certify failing suite')
          percent = float(coverage['totals']['percent_covered'])
          if percent < 85.0:
              raise SystemExit(f'coverage below gate: {percent}')

          payload = {
              'schema_version': 1,
              'track': 'R6',
              'control': 'durable external PAPER client_order_id ambiguity barrier',
              'status': 'PASS_MILESTONE_NOT_DEBT_CLOSURE',
              'source_head': os.environ['GITHUB_SHA'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'tests': {
                  'passed_or_skipped_total': tests,
                  'failures': failures,
                  'errors': errors,
                  'skipped': skipped,
                  'coverage_percent': round(percent, 2),
                  'coverage_gate_percent': 85.0,
              },
              'certified_invariants': [
                  'submission binding freezes local order, deterministic client_order_id, intent fingerprint, risk decision, account attestation and exact external payload hash',
                  'a submit attempt is durably transitioned to UNKNOWN before any future external POST and a second attempt is blocked',
                  'identical attempt replay is idempotent; changed attempt while UNKNOWN is blocked',
                  'absence lookups accumulate evidence but never automatically re-arm submission',
                  'broker acknowledgement must match frozen client_order_id and payload hash',
                  'binding, event chain and separately anchored control state are verified on every read/restart',
                  'event mutation, sequence gaps, tail deletion and control mutation fail closed',
                  'submission registry has no network or order POST surface',
                  'R6 authority gate currently forbids all external write calls and networking outside the approved attestation gateway',
              ],
              'explicit_non_claims': [
                  'TD-R6-002 remains OPEN until real PAPER lookup/reconciliation transport is integrated and certified',
                  'external PAPER order submission remains disabled',
                  'this is not profitability evidence',
                  'this does not grant LIVE authority',
              ],
              'capital_authority': 'NONE',
              'external_paper_submit': 'DISABLED',
              'live_trading': 'BLOCKED',
          }
          Path(os.environ['OUT']).write_text(json.dumps(payload, indent=2) + '\n')
          PY
      - name: Commit evidence and self-clean
        run: |
          rm -f coverage-r6.json pytest-r6.xml
          git config user.name "arendon7"
          git config user.email "102555888+arendon7@users.noreply.github.com"
          git add knowledge/60_EVIDENCE/R6_SUBMISSION_AMBIGUITY_MILESTONE.json
          git rm -f .github/workflows/r6-ambiguity-cert-one-shot.yml
          git commit -m "docs(r6): certify durable PAPER ambiguity milestone"
          git push origin HEAD:reconstruction/r6-external-paper-protection
