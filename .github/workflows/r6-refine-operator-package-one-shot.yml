name: R6 Refine Operator Decision Package One Shot

on:
  push:
    branches: ["reconstruction/r6-external-paper-protection"]

permissions:
  contents: write

jobs:
  refine:
    if: github.event.head_commit.message == 'chore(r6) retry prepared-package operator decision refinement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply package-bound human-decision refinement
        run: python scripts/r6_refine_operator_decision_package.py
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused certification
        run: |
          python -m compileall -q src tests scripts
          pytest -q tests/test_r6_paper_canary_coordinator.py tests/test_r6_operator_decision.py tests/test_r6_canary_coordinator_boundary.py
          python scripts/check_r6_canary_coordinator_boundary.py
          python scripts/check_r6_oms_handoff_boundary.py
          python scripts/check_r6_live_deny_boundary.py
          python scripts/check_r6_authority.py
          python scripts/check_r6_product_boundary.py
      - name: Full certification
        run: |
          pytest --cov=autotrade --cov-report=term-missing
          python scripts/check_contract_registry.py
          python scripts/check_research_authority.py
          python scripts/check_r5_authority.py
          python scripts/check_r6_authority.py
          python scripts/check_r6_live_deny_boundary.py
          python scripts/check_r6_oms_handoff_boundary.py
          python scripts/check_r6_canary_coordinator_boundary.py
          python scripts/check_r6_product_boundary.py
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Publish only after all gates pass
        run: |
          git config user.name arendon7
          git config user.email 102555888+arendon7@users.noreply.github.com
          git rm -f scripts/r6_refine_operator_decision_package.py .github/workflows/r6-refine-operator-package-one-shot.yml
          git add src/autotrade/brokers/alpaca_paper_operator_decision.py tests/test_r6_operator_decision.py
          git commit -m "feat(r6): bind human decision to exact prepared canary package"
          git push origin HEAD:reconstruction/r6-external-paper-protection
