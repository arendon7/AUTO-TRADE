name: OSS-3D3A Exact Sign Test Hotfix Bootstrap

on:
  push:
    branches:
      - research/oss3d3a-real-development-campaign
    paths:
      - '.github/workflows/oss3d3a-sign-test-hotfix-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src:.
    steps:
      - name: Checkout D3A branch
        uses: actions/checkout@v5
        with:
          ref: research/oss3d3a-real-development-campaign
          fetch-depth: 0

      - name: Apply mathematically identical large-n exact sign-test hardening
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/autotrade/research/oss3_development_model_tournament.py')
          source = source_path.read_text(encoding='utf-8')
          old_import = 'from dataclasses import dataclass\n'
          new_import = 'from dataclasses import dataclass\nfrom fractions import Fraction\n'
          if 'from fractions import Fraction\n' not in source:
              assert source.count(old_import) == 1
              source = source.replace(old_import, new_import, 1)
          old_return = '    return sum(comb(n, k) for k in range(positives, n + 1)) / float(2**n)\n'
          new_return = '    return float(Fraction(sum(comb(n, k) for k in range(positives, n + 1)), 1 << n))\n'
          assert source.count(old_return) == 1, 'expected legacy exact sign-test return not found exactly once'
          source = source.replace(old_return, new_return, 1)
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('labs/oss3_qlib/tests/test_real_development_campaign.py')
          test_source = test_path.read_text(encoding='utf-8')
          marker = 'def test_d2e_exact_sign_test_supports_full_hourly_development_without_float_overflow():'
          if marker not in test_source:
              test_source += '''\n\n\ndef test_d2e_exact_sign_test_supports_full_hourly_development_without_float_overflow():\n    from autotrade.research.oss3_development_model_tournament import _one_sided_exact_sign_test\n\n    # 8,760 non-zero cross-sectional signs approximate a full hourly year and\n    # reproduces the magnitude that overflowed the legacy float(2**n) path.\n    values = (1.0,) * 4380 + (-1.0,) * 4380\n    p_value = _one_sided_exact_sign_test(values)\n    assert 0.0 <= p_value <= 1.0\n    assert p_value > 0.5\n\n    # Small-n semantics remain the exact same one-sided binomial tail.\n    assert _one_sided_exact_sign_test((1.0, 1.0, -1.0)) == 0.5\n'''
              test_path.write_text(test_source, encoding='utf-8')
          PY

      - name: Compile and run exact sign-test regression before commit
        run: |
          set -euo pipefail
          python -m py_compile src/autotrade/research/oss3_development_model_tournament.py labs/oss3_qlib/tests/test_real_development_campaign.py
          python - <<'PY'
          from autotrade.research.oss3_development_model_tournament import _one_sided_exact_sign_test
          p = _one_sided_exact_sign_test((1.0,) * 4380 + (-1.0,) * 4380)
          assert 0.0 <= p <= 1.0
          assert p > 0.5
          assert _one_sided_exact_sign_test((1.0, 1.0, -1.0)) == 0.5
          print('large-n exact sign test:', p)
          PY

      - name: Commit source hardening and self-delete bootstrap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autotrade/research/oss3_development_model_tournament.py labs/oss3_qlib/tests/test_real_development_campaign.py
          git rm .github/workflows/oss3d3a-sign-test-hotfix-bootstrap.yml
          git commit -m "fix: make D2E exact sign test safe for real DEVELOPMENT horizon"
          git push origin HEAD:research/oss3d3a-real-development-campaign
