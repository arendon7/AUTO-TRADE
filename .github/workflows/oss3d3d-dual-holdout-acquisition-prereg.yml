name: OSS-3D3D Dual Holdout Acquisition Preregistration

on:
  pull_request:
    branches:
      - research/oss3d3c-durable-development-outcome
    paths:
      - 'labs/oss3_qlib/dual_holdout_acquisition_preregistration.py'
      - 'labs/oss3_qlib/tests/test_dual_holdout_acquisition_preregistration.py'
      - 'scripts/run_oss3d3d_dual_holdout_preregistration.py'
      - 'scripts/check_oss3d3d_dual_holdout_preregistration_boundary.py'
      - 'knowledge/20_RESEARCH/OSS3D3D_DUAL_HOLDOUT_ACQUISITION_PREREGISTRATION.md'
      - '.github/workflows/oss3d3d-dual-holdout-acquisition-prereg.yml'
  push:
    branches:
      - research/oss3d3d-dual-holdout-acquisition-prereg
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  oss3d3d:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}
      D3C_SOURCE_DIR: /tmp/oss3d3d-source-d3c
      D3D_REGISTRY: /tmp/oss3d3d/dual-holdout-prereg.sqlite3
      D3D_PLAN_JSON: /tmp/oss3d3d/dual-holdout-plan.json
      EXPECTED_D3C_HEAD: 2f168513482e188ed381550ba4ab3780011e600d
      EXPECTED_D3C_ARTIFACT: 1d271c31f506be21d2a99c857a1007cc5676cfcb5ab83fb6a524171a38dbaf43
      EXPECTED_SCIENCE: 5b4261b186e30cbdc30ec2c3025305fbb96650247a066cdf470ce53e80f86ea7
    steps:
      - name: Checkout exact D3D source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install AUTO-TRADE core only
        run: python -m pip install -e '.[dev]'

      - name: Prove Qlib absent
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('qlib') is None
          print('qlib runtime: ABSENT')
          PY

      - name: Compile D3D sources
        run: |
          python -m py_compile \
            labs/oss3_qlib/dual_holdout_acquisition_preregistration.py \
            labs/oss3_qlib/tests/test_dual_holdout_acquisition_preregistration.py \
            scripts/run_oss3d3d_dual_holdout_preregistration.py \
            scripts/check_oss3d3d_dual_holdout_preregistration_boundary.py

      - name: D3D pre-acquisition authority boundary
        run: python scripts/check_oss3d3d_dual_holdout_preregistration_boundary.py

      - name: D3D deterministic and adversarial tests
        run: python -m pytest -q labs/oss3_qlib/tests/test_dual_holdout_acquisition_preregistration.py

      - name: Re-prove generic D2J and D2M contracts
        run: |
          python -m pytest -q \
            labs/oss3_qlib/tests/test_final_holdout_protocol.py \
            labs/oss3_qlib/tests/test_predictive_economic_protocol.py

      - name: Download exact certified D3C artifact
        uses: actions/download-artifact@v4
        with:
          name: oss3d3c-durable-development-outcome-2f168513482e188ed381550ba4ab3780011e600d
          path: ${{ env.D3C_SOURCE_DIR }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34526809682

      - name: Verify exact D3C source artifact
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from labs.oss3_qlib.durable_development_outcome import read_durable_development_outcome

          root = Path(os.environ['D3C_SOURCE_DIR'])
          matches = list(root.rglob('oss3d3c-durable-development-outcome.json'))
          assert len(matches) == 1, matches
          bundle = read_durable_development_outcome(matches[0])
          assert bundle.fingerprint == os.environ['EXPECTED_D3C_ARTIFACT']
          assert bundle.scientific_outcome_fingerprint == os.environ['EXPECTED_SCIENCE']
          assert bundle.selected_trial_id == 'linear-ridge-a10'
          assert bundle.final_holdout_observed is False
          assert bundle.final_holdout_authorized is False
          assert bundle.holdout_permit_consumed is False
          assert bundle.execution_authorized is False
          assert bundle.paper_execution_authorized is False
          assert bundle.capital_authority == 'NONE'
          assert bundle.live_trading == 'BLOCKED'
          print('certified D3C source artifact: PASS', bundle.fingerprint)
          PY

      - name: Create durable D3D preregistration
        run: |
          mkdir -p /tmp/oss3d3d
          python scripts/run_oss3d3d_dual_holdout_preregistration.py \
            --registry "$D3D_REGISTRY" \
            --output "$D3D_PLAN_JSON"

      - name: Verify D3D artifact and read-only registry
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.run_oss3d3d_dual_holdout_preregistration import require_exact_read_only
          from labs.oss3_qlib.dual_holdout_acquisition_preregistration import canonical_oss3d3d_dual_holdout_plan

          require_exact_read_only(os.environ['D3D_REGISTRY'])
          plan = canonical_oss3d3d_dual_holdout_plan()
          document = json.loads(Path(os.environ['D3D_PLAN_JSON']).read_text())
          assert document['fingerprint'] == plan.fingerprint
          assert document['source_d3c_certified_head'] == os.environ['EXPECTED_D3C_HEAD']
          assert document['source_d3c_artifact_hash'] == os.environ['EXPECTED_D3C_ARTIFACT']
          assert document['source_d3c_scientific_outcome_hash'] == os.environ['EXPECTED_SCIENCE']
          assert document['predictive']['partition_start'] == '2026-01-01T00:00:00+00:00'
          assert document['predictive']['partition_end'] == '2026-04-01T00:00:00+00:00'
          assert document['economic']['partition_start'] == '2026-04-01T00:00:00+00:00'
          assert document['economic']['partition_end'] == '2026-07-01T00:00:00+00:00'
          assert len(document['predictive']['descriptors']) == 9
          assert len(document['economic']['descriptors']) == 9
          assert document['network_acquisition_performed'] is False
          assert document['final_holdout_observed'] is False
          assert document['economic_holdout_observed'] is False
          assert document['holdout_permit_issued'] is False
          assert document['holdout_permit_consumed'] is False
          assert document['capital_authority'] == 'NONE'
          assert document['live_trading'] == 'BLOCKED'
          print('durable D3D preregistration: PASS', plan.fingerprint)
          PY

      - name: Re-prove D3C and research authority boundaries
        run: |
          python scripts/check_oss3d3c_durable_development_outcome_boundary.py
          python scripts/check_research_authority.py
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('qlib') is None
          print('qlib runtime after D3D: ABSENT')
          PY

      - name: Upload D3D preregistration evidence
        uses: actions/upload-artifact@v4
        with:
          name: oss3d3d-dual-holdout-prereg-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ env.D3D_PLAN_JSON }}
            ${{ env.D3D_REGISTRY }}
