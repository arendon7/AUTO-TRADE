name: W82 Fee-Complete Execution Accounting

on:
  pull_request:
    paths:
      - "src/autotrade/fee_accounting.py"
      - "src/autotrade/fee_product_economics.py"
      - "src/autotrade/fee_schedule_attestation.py"
      - "src/autotrade/paper_fee_activity_evidence.py"
      - "src/autotrade/promotion_fee_accounting.py"
      - "tests/test_w82_fee_accounting.py"
      - "tests/test_w82_fee_accounting_adversarial.py"
      - "tests/test_w82_fee_product_validation.py"
      - "tests/test_w82_fee_schedule_attestation.py"
      - "tests/test_w82_promotion_fee_accounting.py"
      - "tests/test_w82_promotion_fee_accounting_hardening.py"
      - "scripts/check_w82_fee_accounting_boundary.py"
      - "scripts/check_w82_promotion_fee_accounting_boundary.py"
      - ".github/workflows/w82-fee-accounting.yml"
      - ".github/workflows/core-tests.yml"
      - "knowledge/00_CANON/debt_register_r7d_auto_paper.json"
      - "knowledge/00_CANON/**"
      - "knowledge/30_DECISIONES/**"
      - "knowledge/40_HANDOFF/**"

permissions:
  contents: read

jobs:
  fee-complete-accounting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile W82 surface
        run: python -m compileall -q src/autotrade/fee_accounting.py src/autotrade/fee_product_economics.py src/autotrade/fee_schedule_attestation.py src/autotrade/paper_fee_activity_evidence.py src/autotrade/promotion_fee_accounting.py tests/test_w82_fee_accounting.py tests/test_w82_fee_accounting_adversarial.py tests/test_w82_fee_product_validation.py tests/test_w82_fee_schedule_attestation.py tests/test_w82_promotion_fee_accounting.py tests/test_w82_promotion_fee_accounting_hardening.py scripts/check_w82_fee_accounting_boundary.py scripts/check_w82_promotion_fee_accounting_boundary.py
      - name: W82 fee accounting boundary
        run: python scripts/check_w82_fee_accounting_boundary.py
      - name: W82 candidate fee resolution boundary
        run: python scripts/check_w82_promotion_fee_accounting_boundary.py
      - name: W82 fee accounting tests
        run: pytest -q tests/test_w82_fee_accounting.py tests/test_w82_fee_accounting_adversarial.py tests/test_w82_fee_product_validation.py tests/test_w82_fee_schedule_attestation.py tests/test_w82_promotion_fee_accounting.py tests/test_w82_promotion_fee_accounting_hardening.py
      - name: Re-prove W81 execution cost continuity
        run: python scripts/check_w81_execution_cost_continuity_boundary.py
      - name: Re-prove W81 candidate continuity resolution
        run: python scripts/check_w81_promotion_cost_continuity_boundary.py
      - name: Re-prove W80 assessment boundary
        run: python scripts/check_w80_promotion_assessment_boundary.py
      - name: Re-prove W79 promotion boundary
        run: python scripts/check_w79_strategy_promotion_boundary.py
      - name: Re-prove W78 execution boundary
        run: python scripts/check_w78_paper_execution_boundary.py
      - name: Re-prove research authority boundary
        run: python scripts/check_research_authority.py
