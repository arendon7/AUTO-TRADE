name: OSS-3D2T Real Geometry Diagnostic 2026-09-08

on:
  push:
    branches:
      - research/oss3d2t-real-geometry-diagnostic-20260908

permissions:
  contents: read

jobs:
  diagnose-real-kline-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact certified D2V stack
        uses: actions/checkout@v5
        with:
          ref: 3d76961e857469013f173c6c9f09f4d515923f24

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install AUTO-TRADE core
        run: python -m pip install -e .

      - name: Scan exact 108-descriptor provider family through certified D2T
        run: |
          python - <<'PY'
          from hashlib import sha256
          from io import BytesIO, StringIO
          import csv
          import re
          import urllib.request
          import zipfile

          from autotrade.research.oss3_market_collection import canonical_oss3d2u_collection_plan
          from autotrade.research.oss3_market_snapshot import build_binance_spot_archive_snapshot
          from autotrade.research.external_data import FIXED_INTERVAL_MS

          plan = canonical_oss3d2u_collection_plan()
          assert len(plan.descriptors) == 108
          failures = []
          passed = 0

          for ordinal, descriptor in enumerate(plan.descriptors, start=1):
              with urllib.request.urlopen(descriptor.checksum_url, timeout=30) as response:
                  checksum_raw = response.read()
              with urllib.request.urlopen(descriptor.archive_url, timeout=30) as response:
                  archive_raw = response.read()
              checksum_text = checksum_raw.decode('utf-8').strip()
              provider_sha = checksum_text.split()[0].lower()
              actual_sha = sha256(archive_raw).hexdigest()
              assert actual_sha == provider_sha, (descriptor.instrument.symbol, descriptor.period)

              try:
                  artifact = build_binance_spot_archive_snapshot(
                      descriptor=descriptor,
                      archive_bytes=archive_raw,
                      checksum_text=checksum_text,
                  )
              except Exception as exc:
                  detail = {
                      'ordinal': ordinal,
                      'symbol': descriptor.instrument.symbol,
                      'period': descriptor.period,
                      'interval': descriptor.interval,
                      'timestamp_unit_policy': descriptor.timestamp_unit_policy,
                      'archive_sha256': actual_sha,
                      'error_type': type(exc).__name__,
                      'error': str(exc),
                  }
                  match = re.search(r'row (\d+)', str(exc))
                  if match:
                      index = int(match.group(1))
                      with zipfile.ZipFile(BytesIO(archive_raw), 'r') as archive:
                          rows = list(csv.reader(StringIO(archive.read(descriptor.csv_filename).decode('utf-8'))))
                      if 0 <= index < len(rows):
                          row = rows[index]
                          unit_multiplier = descriptor.timestamp_unit_multiplier_per_millisecond
                          interval_units = FIXED_INTERVAL_MS[descriptor.interval] * unit_multiplier
                          expected_open = int(rows[0][0]) + index * interval_units
                          expected_close = expected_open + interval_units - 1
                          next_open = int(rows[index + 1][0]) if index + 1 < len(rows) else None
                          detail['provider_row'] = {
                              'index': index,
                              'open_time': int(row[0]),
                              'close_time': int(row[6]),
                              'expected_open': expected_open,
                              'expected_close': expected_close,
                              'open_delta': int(row[0]) - expected_open,
                              'close_delta': int(row[6]) - expected_close,
                              'next_open_time': next_open,
                              'next_open_minus_close': None if next_open is None else next_open - int(row[6]),
                              'open_digits': len(row[0]),
                              'close_digits': len(row[6]),
                              'ohlcv': row[1:6],
                          }
                          neighborhood = []
                          for neighbor_index in range(max(0, index - 2), min(len(rows), index + 3)):
                              neighbor = rows[neighbor_index]
                              neighborhood.append({
                                  'index': neighbor_index,
                                  'open_time': int(neighbor[0]),
                                  'close_time': int(neighbor[6]),
                                  'next_open_minus_close': (
                                      int(rows[neighbor_index + 1][0]) - int(neighbor[6])
                                      if neighbor_index + 1 < len(rows) else None
                                  ),
                              })
                          detail['neighborhood'] = neighborhood
                  failures.append(detail)
                  print('D2T_FAIL', detail, flush=True)
                  continue

              passed += 1
              print(
                  'D2T_PASS',
                  {
                      'ordinal': ordinal,
                      'symbol': descriptor.instrument.symbol,
                      'period': descriptor.period,
                      'artifact_hash': artifact.artifact_hash,
                      'dataset_hash': artifact.manifest.normalized_dataset_hash,
                  },
                  flush=True,
              )

          print('SCAN_SUMMARY', {
              'plan_fingerprint': plan.fingerprint,
              'descriptor_count': len(plan.descriptors),
              'passed': passed,
              'failed': len(failures),
          }, flush=True)
          for failure in failures:
              print('FAILURE_SUMMARY', failure, flush=True)
          assert passed + len(failures) == 108
          PY
