name: W86 PAPER Runtime Readiness Snapshot

on:
  pull_request:
    paths:
      - "src/autotrade/paper_runtime_readiness_source.py"
      - "src/autotrade/paper_runtime_readiness_source_snapshot.py"
      - "tests/test_w86_w85_durable_eligibility_source.py"
      - "tests/test_w86_w85_durable_eligibility_snapshot.py"
      - "scripts/check_w86_paper_runtime_readiness_boundary.py"
      - "scripts/check_w86_paper_runtime_readiness_snapshot_boundary.py"
      - ".github/workflows/w86-paper-runtime-readiness.yml"
      - ".github/workflows/w86-paper-runtime-readiness-snapshot.yml"
      - ".github/workflows/core-tests.yml"

permissions:
  contents: read

jobs:
  paper-runtime-readiness-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile W86 source snapshot surface
        run: >-
          python -m compileall -q
          src/autotrade/paper_runtime_readiness_source.py
          src/autotrade/paper_runtime_readiness_source_snapshot.py
          tests/test_w86_w85_durable_eligibility_source.py
          tests/test_w86_w85_durable_eligibility_snapshot.py
          scripts/check_w86_paper_runtime_readiness_boundary.py
          scripts/check_w86_paper_runtime_readiness_snapshot_boundary.py
      - name: W86 V1 source boundary
        run: python scripts/check_w86_paper_runtime_readiness_boundary.py
      - name: W86 V2 atomic snapshot boundary
        run: python scripts/check_w86_paper_runtime_readiness_snapshot_boundary.py
      - name: W86 V1 plus V2 source tests
        run: >-
          pytest -q
          tests/test_w86_w85_durable_eligibility_source.py
          tests/test_w86_w85_durable_eligibility_snapshot.py
      - name: Re-prove W85 candidate admission boundary
        run: python scripts/check_w85_paper_candidate_admission_boundary.py
      - name: Re-prove W84 shadow-forward final boundary
        run: python scripts/check_w84_shadow_forward_promotion_boundary.py
      - name: Re-prove W83 strategy-version binding boundary
        run: python scripts/check_w83_strategy_version_binding_boundary.py
      - name: Re-prove W82 fee accounting boundary
        run: python scripts/check_w82_fee_accounting_boundary.py
      - name: Re-prove W82 candidate fee resolution boundary
        run: python scripts/check_w82_promotion_fee_accounting_boundary.py
      - name: Re-prove W81 execution cost continuity
        run: python scripts/check_w81_execution_cost_continuity_boundary.py
      - name: Re-prove W81 candidate continuity resolution
        run: python scripts/check_w81_promotion_cost_continuity_boundary.py
      - name: Re-prove W80 assessment boundary
        run: python scripts/check_w80_promotion_assessment_boundary.py
      - name: Re-prove W79 promotion boundary
        run: python scripts/check_w79_strategy_promotion_boundary.py
      - name: Re-prove W78 execution boundary
        run: python scripts/check_w78_paper_execution_boundary.py
      - name: Re-prove research authority boundary
        run: python scripts/check_research_authority.py
