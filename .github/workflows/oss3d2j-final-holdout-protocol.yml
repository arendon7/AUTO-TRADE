name: OSS-3D2J FINAL_HOLDOUT Protocol

on:
  pull_request:
    branches:
      - research/oss3d2i-development-winner-selection-seal
    paths:
      - 'labs/oss3_qlib/final_holdout_protocol.py'
      - 'labs/oss3_qlib/tests/test_final_holdout_protocol.py'
      - 'scripts/check_oss3d2j_final_holdout_protocol_boundary.py'
      - 'knowledge/20_RESEARCH/OSS3D2J_FINAL_HOLDOUT_PROTOCOL.md'
      - '.github/workflows/oss3d2j-final-holdout-protocol.yml'
      - 'labs/oss3_qlib/development_winner_seal.py'
      - 'labs/oss3_qlib/family_evaluation_batch.py'
      - 'src/autotrade/research/oss3_development_model_tournament.py'
      - 'src/autotrade/research/oss3_development_evaluation.py'

permissions:
  contents: read

jobs:
  oss3d2j:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install AUTO-TRADE core only
        run: python -m pip install -e '.[dev]'
      - name: Compile D2J
        run: |
          python -m py_compile \
            labs/oss3_qlib/final_holdout_protocol.py \
            labs/oss3_qlib/tests/test_final_holdout_protocol.py \
            scripts/check_oss3d2j_final_holdout_protocol_boundary.py
      - name: D2J protocol-only authority boundary before Qlib install
        run: python scripts/check_oss3d2j_final_holdout_protocol_boundary.py
      - name: D2J deterministic and adversarial protocol tests before Qlib install
        run: python -m pytest -q labs/oss3_qlib/tests/test_final_holdout_protocol.py
      - name: Re-prove D2I immutable winner seal
        run: |
          python scripts/check_oss3d2i_development_winner_seal_boundary.py
          python -m pytest -q labs/oss3_qlib/tests/test_development_winner_seal.py
      - name: Re-prove D2H runtime-free orchestration
        run: |
          python scripts/check_oss3d2h_family_evaluation_batch_boundary.py
          python -m pytest -q \
            labs/oss3_qlib/tests/test_family_evaluation_batch.py \
            labs/oss3_qlib/tests/test_family_evaluation_batch_binding_immutability.py
      - name: D2E and D2D regressions
        run: |
          python -m pytest -q tests/test_research_oss3_development_model_tournament.py
          python scripts/check_oss3d2e_development_model_tournament_boundary.py
          python -m pytest -q tests/test_research_oss3_development_evaluation.py
          python scripts/check_oss3d2d_development_evaluation_boundary.py
      - name: Research authority
        run: python scripts/check_research_authority.py
      - name: FINAL_HOLDOUT one-shot governance regression
        run: |
          python -m pytest -q \
            tests/test_research_oss2_final_holdout_evaluation.py \
            tests/test_research_oss2_final_holdout_evaluation_adversarial.py \
            tests/test_research_oss2_final_holdout_evaluation_edges.py
          python scripts/check_oss2h_final_holdout_evaluation_boundary.py
      - name: Install pinned Qlib runtime for upstream D2G regression
        run: python -m pip install -r labs/oss3_qlib/requirements.txt
      - name: Assert exact pyqlib runtime
        run: |
          python - <<'PY'
          import importlib.metadata
          version = importlib.metadata.version('pyqlib')
          assert version == '0.9.7', version
          print(f'pyqlib=={version}')
          PY
      - name: Re-run six-candidate D2G real-runtime proof
        run: python -m pytest -q labs/oss3_qlib/tests/test_family_runner.py
