name: R6 Register Operator and Resume Debts

on:
  push:
    branches: ["reconstruction/r6-external-paper-protection"]

permissions:
  contents: write

jobs:
  register:
    if: github.event.head_commit.message == 'chore(r6) register operator and resume debts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Register debts
        run: python scripts/r6_register_operator_and_resume_debts.py
      - name: Validate canonical contracts
        run: |
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Publish debt registration
        run: |
          git config user.name arendon7
          git config user.email 102555888+arendon7@users.noreply.github.com
          git rm -f scripts/r6_register_operator_and_resume_debts.py knowledge/60_EVIDENCE/R6_OPERATOR_RESUME_REGISTRATION_TRIGGER.json
          git add knowledge/00_CANON/debt_register.json knowledge/00_CANON/DEBT_REGISTER.md knowledge/00_CANON/TAREA_ACTIVA.md
          git commit -m "docs(r6): register operator decision and resume debts"
          git push origin HEAD:reconstruction/r6-external-paper-protection
