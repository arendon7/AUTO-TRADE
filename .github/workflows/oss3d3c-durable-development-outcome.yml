name: OSS-3D3C Durable DEVELOPMENT Outcome

on:
  pull_request:
    branches:
      - research/oss3d3a-real-development-campaign
    paths:
      - 'labs/oss3_qlib/durable_development_outcome.py'
      - 'labs/oss3_qlib/durable_development_outcome_rehydration.py'
      - 'labs/oss3_qlib/tests/test_durable_development_outcome.py'
      - 'scripts/run_oss3d3c_durable_development_outcome.py'
      - 'scripts/check_oss3d3c_durable_development_outcome_boundary.py'
      - 'knowledge/20_RESEARCH/OSS3D3A_CERTIFIED_BASELINE_d6a66390.json'
      - 'knowledge/20_RESEARCH/OSS3D3C_DURABLE_DEVELOPMENT_OUTCOME.md'
      - '.github/workflows/oss3d3c-durable-development-outcome.yml'
  push:
    branches:
      - research/oss3d3c-durable-development-outcome
    paths:
      - 'labs/oss3_qlib/durable_development_outcome.py'
      - 'labs/oss3_qlib/durable_development_outcome_rehydration.py'
      - 'labs/oss3_qlib/tests/test_durable_development_outcome.py'
      - 'scripts/run_oss3d3c_durable_development_outcome.py'
      - 'scripts/check_oss3d3c_durable_development_outcome_boundary.py'
      - 'knowledge/20_RESEARCH/OSS3D3A_CERTIFIED_BASELINE_d6a66390.json'
      - 'knowledge/20_RESEARCH/OSS3D3C_DURABLE_DEVELOPMENT_OUTCOME.md'
      - '.github/workflows/oss3d3c-durable-development-outcome.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  oss3d3c:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      PYTHONPATH: ${{ github.workspace }}
      CERTIFIED_D3A_BASELINE: ${{ github.workspace }}/knowledge/20_RESEARCH/OSS3D3A_CERTIFIED_BASELINE_d6a66390.json
      D3A_ARTIFACT_DIR: /tmp/oss3d3c-source-artifact
      D3A_REHYDRATE_PARENT: /tmp/oss3d3c-rehydrate-parent
      D3A_EVIDENCE_ROOT: /tmp/oss3d3c-rehydrate-parent/oss3d3a-certified-d2y-evidence
      D3A_REHYDRATION_JSON: /tmp/oss3d3c-rehydration.json
      D3A_WORK_ROOT: /tmp/oss3d3c-d3a-work
      D3A_RESULT_JSON: /tmp/oss3d3c-d3a-result.json
      D3C_RESULT_JSON: /tmp/oss3d3c-durable-development-outcome.json
      EXPECTED_CERTIFIED_D3A_FINGERPRINT: ce703916e83161cc71e73e56e4a9ffab5c0989bf630cfbae260a90a5846ca9cc
      EXPECTED_SCIENTIFIC_OUTCOME: 5b4261b186e30cbdc30ec2c3025305fbb96650247a066cdf470ce53e80f86ea7
      EXPECTED_CERTIFIED_D2I_WINNER_SEAL: eacb62b1e506a4386b5f3fd71e0d4109f37a716d825473242fd3a94228386416
      EXPECTED_WINNER: linear-ridge-a10
    steps:
      - name: Checkout exact D3C source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install AUTO-TRADE core only
        run: python -m pip install -e '.[dev]'

      - name: Prove Qlib absent before D3C boundary tests
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('qlib') is None
          print('qlib runtime before D3C boundary tests: ABSENT')
          PY

      - name: Compile D3C sources
        run: |
          python -m py_compile \
            labs/oss3_qlib/durable_development_outcome.py \
            labs/oss3_qlib/durable_development_outcome_rehydration.py \
            labs/oss3_qlib/tests/test_durable_development_outcome.py \
            scripts/run_oss3d3c_durable_development_outcome.py \
            scripts/check_oss3d3c_durable_development_outcome_boundary.py

      - name: D3C evidence-only authority boundary
        run: python scripts/check_oss3d3c_durable_development_outcome_boundary.py

      - name: D3C deterministic and adversarial bundle tests
        run: python -m pytest -q labs/oss3_qlib/tests/test_durable_development_outcome.py

      - name: Verify immutable certified D3A baseline
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from labs.oss3_qlib.durable_development_outcome import d3a_scientific_outcome_fingerprint

          path = Path(os.environ['CERTIFIED_D3A_BASELINE'])
          raw = path.read_text(encoding='utf-8')
          d = json.loads(raw)
          assert raw == json.dumps(d, sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False) + '\n'
          fingerprint = d.pop('fingerprint')
          assert fingerprint == os.environ['EXPECTED_CERTIFIED_D3A_FINGERPRINT']
          assert d['status'] == 'COMPLETED'
          assert d['selected_trial_id'] == os.environ['EXPECTED_WINNER']
          assert d['d2i_winner_seal_fingerprint'] == os.environ['EXPECTED_CERTIFIED_D2I_WINNER_SEAL']
          science = d3a_scientific_outcome_fingerprint(d)
          assert science == os.environ['EXPECTED_SCIENTIFIC_OUTCOME']
          print('certified D3A baseline fingerprint:', fingerprint)
          print('certified stable scientific outcome:', science)
          PY

      - name: Re-prove D3A boundary before Qlib
        run: |
          python scripts/check_oss3d3a_real_development_campaign_boundary.py
          python scripts/check_oss3d2z_durable_descriptor_material_manifest_boundary.py
          python -m pytest -q tests/test_research_oss3_real_descriptor_identity.py

      - name: Download exact certified D2Y real campaign artifact
        uses: actions/download-artifact@v4
        with:
          name: oss3d2x-v2-real-campaign-20260908
          path: ${{ env.D3A_ARTIFACT_DIR }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34309982898

      - name: Rehydrate exact real campaign with Qlib absent
        run: |
          python scripts/run_oss3d3a_rehydration.py \
            --artifact-dir "$D3A_ARTIFACT_DIR" \
            --extraction-parent "$D3A_REHYDRATE_PARENT" \
            --repository-root "$GITHUB_WORKSPACE" \
            --output "$D3A_REHYDRATION_JSON"

      - name: Verify rehydration identity and authority
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads(Path(os.environ['D3A_REHYDRATION_JSON']).read_text())
          assert d['source_inventory_verified'] is True
          assert d['source_tar_verified'] is True
          assert d['exact_extracted_file_family_verified'] is True
          assert d['d2z_descriptor_identities_verified'] == 99
          assert d['d2w_offline_reverification_complete'] is True
          assert d['network_used_during_rehydration'] is False
          assert d['qlib_runtime_used'] is False
          assert d['development_labels_materialized'] is False
          assert d['development_metrics_computed'] is False
          assert d['final_holdout_observed'] is False
          assert d['capital_authority'] == 'NONE'
          assert d['live_trading'] == 'BLOCKED'
          print('D3C source real-data rehydration: PASS')
          PY

      - name: Re-prove Qlib-free upstream boundaries
        run: |
          python scripts/check_oss3d2y_durable_real_campaign_evidence_boundary.py
          python scripts/check_oss3d2x_post_outage_continuous_history_boundary.py
          python scripts/check_oss3d2w_sealed_raw_split_handoff_boundary.py
          python scripts/check_oss3d2r_raw_training_bundle_provenance_boundary.py
          python scripts/check_oss3d2s_raw_development_provenance_boundary.py
          python scripts/check_oss3d2h_family_evaluation_batch_boundary.py
          python scripts/check_oss3d2i_development_winner_seal_boundary.py

      - name: Prove Qlib still absent before scientific replay
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('qlib') is None
          print('qlib runtime before exact D3A replay: ABSENT')
          PY

      - name: Install exact frozen Qlib runtime
        run: python -m pip install 'pyqlib==0.9.7'

      - name: Prove exact Qlib version
        run: |
          python - <<'PY'
          from importlib.metadata import version
          assert version('pyqlib') == '0.9.7'
          print('pyqlib:', version('pyqlib'))
          PY

      - name: Replay exact certified D3A campaign unchanged
        run: |
          python scripts/run_oss3d3a_real_development_campaign.py \
            --evidence-root "$D3A_EVIDENCE_ROOT" \
            --work-root "$D3A_WORK_ROOT" \
            --rehydration-evidence "$D3A_REHYDRATION_JSON" \
            --repository-root "$GITHUB_WORKSPACE" \
            --output "$D3A_RESULT_JSON"

      - name: Require exact certified D3A scientific outcome
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from labs.oss3_qlib.durable_development_outcome import d3a_scientific_outcome_fingerprint

          d = json.loads(Path(os.environ['D3A_RESULT_JSON']).read_text())
          replay_fingerprint = d.pop('fingerprint')
          science = d3a_scientific_outcome_fingerprint(d)
          assert d['status'] == 'COMPLETED'
          assert science == os.environ['EXPECTED_SCIENTIFIC_OUTCOME']
          assert d['selected_trial_id'] == os.environ['EXPECTED_WINNER']
          assert d['winner_primary_metric'] == 0.02431784450279712
          assert d['winner_raw_p_value'] == 0.000903437382079215
          assert d['winner_holm_adjusted_p_value'] == 0.00542062429247529
          assert d['final_holdout_observed'] is False
          assert d['final_holdout_authorized'] is False
          assert d['holdout_permit_consumed'] is False
          assert d['promotion_authorized'] is False
          assert d['execution_authorized'] is False
          assert d['paper_execution_authorized'] is False
          assert d['capital_authority'] == 'NONE'
          assert d['live_trading'] == 'BLOCKED'
          print('current D3A provenance fingerprint:', replay_fingerprint)
          print('current D2I provenance seal:', d['d2i_winner_seal_fingerprint'])
          print('stable scientific outcome: PASS', science)
          PY

      - name: Build D3C solely from D3A durable outputs
        run: |
          python scripts/run_oss3d3c_durable_development_outcome.py \
            --certified-d3a-baseline "$CERTIFIED_D3A_BASELINE" \
            --d3a-result "$D3A_RESULT_JSON" \
            --work-root "$D3A_WORK_ROOT" \
            --output "$D3C_RESULT_JSON"

      - name: Verify portable D3C outcome
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from labs.oss3_qlib.durable_development_outcome import read_durable_development_outcome

          replay = json.loads(Path(os.environ['D3A_RESULT_JSON']).read_text())
          d = read_durable_development_outcome(os.environ['D3C_RESULT_JSON'])
          assert d.certified_d3a_baseline_fingerprint == os.environ['EXPECTED_CERTIFIED_D3A_FINGERPRINT']
          assert d.source_d3a_evidence_fingerprint == replay['fingerprint']
          assert d.scientific_outcome_fingerprint == os.environ['EXPECTED_SCIENTIFIC_OUTCOME']
          assert d.d2i_winner_seal_fingerprint == replay['d2i_winner_seal_fingerprint']
          assert d.selected_trial_id == os.environ['EXPECTED_WINNER']
          assert d.final_holdout_observed is False
          assert d.final_holdout_authorized is False
          assert d.holdout_permit_consumed is False
          assert d.profitability_claim_authorized is False
          assert d.promotion_authorized is False
          assert d.execution_authorized is False
          assert d.paper_execution_authorized is False
          assert d.capital_authority == 'NONE'
          assert d.live_trading == 'BLOCKED'
          print('D3C durable DEVELOPMENT outcome: PASS')
          print('D3C artifact:', d.fingerprint)
          print('D3C stable science:', d.scientific_outcome_fingerprint)
          PY

      - name: Research authority boundary
        run: python scripts/check_research_authority.py

      - name: Re-prove D3C boundary after Qlib installation
        run: python scripts/check_oss3d3c_durable_development_outcome_boundary.py

      - name: Upload D3C certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oss3d3c-durable-development-outcome-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ env.D3A_REHYDRATION_JSON }}
            ${{ env.D3A_RESULT_JSON }}
            ${{ env.D3C_RESULT_JSON }}
