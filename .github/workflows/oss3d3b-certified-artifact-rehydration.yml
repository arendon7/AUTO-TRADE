name: OSS-3D3B Certified Artifact Real Rehydration

on:
  pull_request:
    branches:
      - research/oss3d3a-stable-rehydrated-raw-split
    paths:
      - 'labs/oss3_qlib/certified_artifact_rehydration.py'
      - 'labs/oss3_qlib/tests/test_certified_artifact_rehydration.py'
      - 'scripts/run_oss3d3b_certified_artifact_rehydration.py'
      - 'scripts/check_oss3d3b_certified_artifact_rehydration_boundary.py'
      - 'knowledge/20_RESEARCH/OSS3D3B_CERTIFIED_ARTIFACT_REAL_REHYDRATION.md'
      - '.github/workflows/oss3d3b-certified-artifact-rehydration.yml'
      - 'labs/oss3_qlib/stable_rehydrated_raw_split.py'
      - 'src/autotrade/research/oss3_real_descriptor_identity.py'
      - 'src/autotrade/research/oss3_real_campaign_evidence.py'

permissions:
  contents: read

jobs:
  oss3d3b:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install AUTO-TRADE core only
        run: python -m pip install -e '.[dev]'

      - name: Prove Qlib absent before D3B
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('qlib') is None, 'D3B workflow must remain Qlib-free'
          print('qlib runtime: ABSENT')
          PY

      - name: Compile D3B sources
        run: |
          python -m py_compile \
            labs/oss3_qlib/certified_artifact_rehydration.py \
            labs/oss3_qlib/tests/test_certified_artifact_rehydration.py \
            scripts/run_oss3d3b_certified_artifact_rehydration.py \
            scripts/check_oss3d3b_certified_artifact_rehydration_boundary.py

      - name: D3B certified artifact boundary
        run: python scripts/check_oss3d3b_certified_artifact_rehydration_boundary.py

      - name: D3B deterministic and adversarial artifact suite
        run: python -m pytest -q labs/oss3_qlib/tests/test_certified_artifact_rehydration.py

      - name: Re-prove certified D3A stable raw split
        run: |
          python scripts/check_oss3d3a_stable_rehydrated_raw_split_boundary.py
          python -m pytest -q labs/oss3_qlib/tests/test_stable_rehydrated_raw_split.py

      - name: Re-prove certified D2Z material manifest
        run: |
          python scripts/check_oss3d2z_durable_descriptor_material_manifest_boundary.py
          python -m pytest -q tests/test_research_oss3_real_descriptor_identity.py

      - name: Re-prove D2Y durable real campaign seal
        run: python -m pytest -q tests/test_research_oss3_real_campaign_evidence.py

      - name: Research authority boundary
        run: python scripts/check_research_authority.py

      - name: Prove D3B has no network/download/provider runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          source = (
              Path('labs/oss3_qlib/certified_artifact_rehydration.py').read_text().lower()
              + '\n'
              + Path('scripts/run_oss3d3b_certified_artifact_rehydration.py').read_text().lower()
          )
          for marker in (
              'urlopen(', 'requests.', 'httpx.', 'socket.socket(', 'subprocess.',
              'download_workflow_artifact', 'acquire_preregistered_archive(',
              'build_real_archive_transport(', 'run_restart_safe_campaign(',
              '.extractall(',
          ):
              assert marker not in source, marker
          print('D3B network/download/provider/process runtime surface: ABSENT')
          PY

      - name: Re-prove Qlib was never installed
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('qlib') is None, 'D3B unexpectedly gained Qlib runtime authority'
          print('qlib runtime after D3B certification: ABSENT')
          PY
