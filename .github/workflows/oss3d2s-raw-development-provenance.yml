name: OSS-3D2S Raw DEVELOPMENT Provenance

on:
  pull_request:
    branches:
      - research/oss3d2r-raw-training-bundle-provenance
    paths:
      - 'labs/oss3_qlib/raw_development_provenance.py'
      - 'labs/oss3_qlib/tests/d2s_fixture.py'
      - 'labs/oss3_qlib/tests/test_raw_development_provenance.py'
      - 'scripts/check_oss3d2s_raw_development_provenance_boundary.py'
      - 'knowledge/20_RESEARCH/OSS3D2S_RAW_DEVELOPMENT_PROVENANCE.md'
      - '.github/workflows/oss3d2s-raw-development-provenance.yml'
      - 'labs/oss3_qlib/raw_training_bundle_provenance.py'
      - 'labs/oss3_qlib/economic_raw_market_feature_provenance.py'
      - 'labs/oss3_qlib/family_evaluation_batch.py'
      - 'labs/oss3_qlib/family_runner.py'
      - 'labs/oss3_qlib/family_model_contract.py'
      - 'labs/oss3_qlib/family_environment_attestation.py'
      - 'labs/oss3_qlib/network_guard.py'
      - 'labs/oss3_qlib/requirements.txt'
      - 'src/autotrade/research/market.py'
      - 'src/autotrade/research/universe.py'
      - 'src/autotrade/research/oss3_factor_matrix_artifact.py'
      - 'src/autotrade/research/oss3_supervised_label_artifact.py'
      - 'src/autotrade/research/oss3_training_bundle.py'
      - 'src/autotrade/research/oss3_development_inference.py'
      - 'src/autotrade/research/oss3_development_evaluation.py'
      - 'src/autotrade/research/oss3_development_model_tournament.py'
      - 'src/autotrade/research/oss3_concrete_model_family.py'

permissions:
  contents: read

jobs:
  oss3d2s:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install AUTO-TRADE core only
        run: python -m pip install -e '.[dev]'

      - name: Compile D2S sources before Qlib install
        run: |
          python -m py_compile \
            labs/oss3_qlib/raw_development_provenance.py \
            labs/oss3_qlib/tests/d2s_fixture.py \
            labs/oss3_qlib/tests/test_raw_development_provenance.py \
            scripts/check_oss3d2s_raw_development_provenance_boundary.py

      - name: D2S pre-label raw DEVELOPMENT boundary before Qlib
        run: python scripts/check_oss3d2s_raw_development_provenance_boundary.py

      - name: Re-prove D2R and D2Q raw provenance boundaries before Qlib
        run: |
          python scripts/check_oss3d2r_raw_training_bundle_provenance_boundary.py
          python scripts/check_oss3d2q_raw_market_feature_provenance_boundary.py

      - name: Re-prove D2H D2E D2D and model-family boundaries before Qlib
        run: |
          python scripts/check_oss3d2h_family_evaluation_batch_boundary.py
          python scripts/check_oss3d2e_development_model_tournament_boundary.py
          python scripts/check_oss3d2d_development_evaluation_boundary.py
          python scripts/check_oss3d2f_concrete_model_family_boundary.py
          python scripts/check_oss3d2g_isolated_family_runner_boundary.py
          python scripts/check_oss3d2i_development_winner_seal_boundary.py

      - name: Re-prove D2P D2O D2N D2M D2L D2J boundaries before Qlib
        run: |
          python scripts/check_oss3d2p_provenance_gated_economic_admission_boundary.py
          python scripts/check_oss3d2o_economic_prediction_provenance_boundary.py
          python scripts/check_oss3d2n_economic_holdout_evaluator_boundary.py
          python scripts/check_oss3d2n_economic_prediction_precommit_boundary.py
          python scripts/check_oss3d2m_predictive_economic_protocol_boundary.py
          python scripts/check_oss3d2l_predictive_strategy_contract_boundary.py
          python scripts/check_oss3d2j_final_holdout_protocol_boundary.py

      - name: Research authority before Qlib install
        run: python scripts/check_research_authority.py

      - name: Install pinned Qlib runtime
        run: python -m pip install -r labs/oss3_qlib/requirements.txt

      - name: Assert exact pyqlib runtime
        run: |
          python - <<'PY'
          import importlib.metadata
          version = importlib.metadata.version('pyqlib')
          assert version == '0.9.7', version
          print(f'pyqlib=={version}')
          PY

      - name: D2S six-model raw DEVELOPMENT sequencing and tournament
        run: python -m pytest -q labs/oss3_qlib/tests/test_raw_development_provenance.py

      - name: Re-prove D2R raw TRAIN six-model integration
        run: python -m pytest -q labs/oss3_qlib/tests/test_raw_training_bundle_provenance.py

      - name: Re-prove D2H preregistered family evaluation
        run: python -m pytest -q labs/oss3_qlib/tests/test_family_evaluation_batch.py

      - name: Re-prove D2Q D2P and D2O provenance chain
        run: |
          python -m pytest -q labs/oss3_qlib/tests/test_economic_raw_market_feature_provenance.py
          python -m pytest -q labs/oss3_qlib/tests/test_economic_prediction_provenance_admission.py
          python -m pytest -q labs/oss3_qlib/tests/test_economic_prediction_provenance.py

      - name: Re-prove six-candidate D2G canonical runtime
        run: python -m pytest -q labs/oss3_qlib/tests/test_family_runner.py

      - name: Re-prove D2K and D2N one-shot evaluators
        run: |
          python -m pytest -q labs/oss3_qlib/tests/test_final_holdout_evaluator.py
          python -m pytest -q labs/oss3_qlib/tests/test_economic_prediction_precommit.py
          python -m pytest -q labs/oss3_qlib/tests/test_economic_holdout_evaluator.py

      - name: D2E and D2D regressions
        run: |
          python -m pytest -q tests/test_research_oss3_development_model_tournament.py
          python -m pytest -q tests/test_research_oss3_development_evaluation.py

      - name: Research authority after Qlib install
        run: python scripts/check_research_authority.py

      - name: Existing one-shot FINAL_HOLDOUT governance regression
        run: |
          python -m pytest -q \
            tests/test_research_oss2_final_holdout_evaluation.py \
            tests/test_research_oss2_final_holdout_evaluation_adversarial.py \
            tests/test_research_oss2_final_holdout_evaluation_edges.py
          python scripts/check_oss2h_final_holdout_evaluation_boundary.py
