name: R6 Connectivity Execution Intent Boundary

on:
  push:
    branches: ["reconstruction/**", "work/**", "feature/**"]
    paths:
      - "src/autotrade/connectivity_execution_intent.py"
      - "scripts/r6_issue_connectivity_execution_intent.py"
      - "scripts/check_r6_connectivity_execution_intent_boundary.py"
      - "tests/test_r6_connectivity_execution_intent.py"
      - "tests/test_r6_connectivity_execution_intent_edges.py"
      - "tests/test_r6_connectivity_execution_intent_cli.py"
      - ".github/workflows/r6-connectivity-execution-intent.yml"
  pull_request:
    paths:
      - "src/autotrade/connectivity_execution_intent.py"
      - "scripts/r6_issue_connectivity_execution_intent.py"
      - "scripts/check_r6_connectivity_execution_intent_boundary.py"
      - "tests/test_r6_connectivity_execution_intent.py"
      - "tests/test_r6_connectivity_execution_intent_edges.py"
      - "tests/test_r6_connectivity_execution_intent_cli.py"
      - ".github/workflows/r6-connectivity-execution-intent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectivity-execution-intent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Second execution-intent authority boundary
        run: python scripts/check_r6_connectivity_execution_intent_boundary.py
      - name: Execution-intent functional and adversarial tests
        run: pytest -q tests/test_r6_connectivity_execution_intent.py tests/test_r6_connectivity_execution_intent_edges.py tests/test_r6_connectivity_execution_intent_cli.py
