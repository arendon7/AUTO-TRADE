name: R3 Hardening One-Shot Patch

on:
  push:
    branches: ["reconstruction/r3-real-data-governance"]
    paths: [".r3hardening/TRIGGER"]

permissions:
  contents: write

jobs:
  apply-reviewed-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          ref: reconstruction/r3-real-data-governance
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply reviewed patch
        run: python .r3hardening/apply.py

      - name: Compile patched tree
        run: python -m compileall -q src tests scripts

      - name: Commit self-cleaned result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(r3): harden public-data and HOLDOUT governance"
          git push origin HEAD:reconstruction/r3-real-data-governance
