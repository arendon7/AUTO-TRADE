name: R6 Crypto PAPER Cold-Start Execution Authority

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-start-execution-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Compile cold-start authority surface
        run: >-
          python -m compileall -q
          src/autotrade/cold_start_oms.py
          src/autotrade/brokers/alpaca_paper_crypto_cold_start_final_guard.py
          src/autotrade/brokers/alpaca_paper_crypto_cold_start_execution_attempt.py
          src/autotrade/brokers/alpaca_paper_crypto_cold_start_execution_bridge.py
          src/autotrade/brokers/alpaca_paper_crypto_cold_start_pre_io_authority.py
          scripts/check_r6_crypto_cold_start_execution_boundary.py
          scripts/check_r6_oms_handoff_boundary.py
          tests/test_r6_cold_start_oms_adversarial.py
          tests/test_r6_paper_crypto_cold_start_final_guard.py
          tests/test_r6_paper_crypto_cold_start_authority_adversarial.py
          tests/test_r6_paper_crypto_cold_start_execution_bridge.py
          tests/test_r6_paper_crypto_cold_start_pre_io_authority.py
          tests/test_r6_paper_crypto_cold_start_writer_simulation.py
      - name: Permanent isolated cold-start execution boundary
        run: python scripts/check_r6_crypto_cold_start_execution_boundary.py
      - name: Re-prove OMS owns every SUBMITTING transition
        run: python scripts/check_r6_oms_handoff_boundary.py
      - name: Cold-start authority + durable PRE_IO + simulated writer tests
        run: >-
          pytest -q
          tests/test_r6_cold_start_oms_adversarial.py
          tests/test_r6_paper_crypto_cold_start_final_guard.py
          tests/test_r6_paper_crypto_cold_start_authority_adversarial.py
          tests/test_r6_paper_crypto_cold_start_execution_bridge.py
          tests/test_r6_paper_crypto_cold_start_pre_io_authority.py
          tests/test_r6_paper_crypto_cold_start_writer_simulation.py
      - name: Re-prove normal crypto execution authority unchanged
        run: python scripts/check_r6_crypto_execution_boundary.py
      - name: Re-prove global R6 PAPER authority
        run: python scripts/check_r6_authority.py
      - name: Re-prove cold-start qualification attestation boundary
        run: python scripts/check_mac_crypto_cold_start_qualification_attestation.py
      - name: Re-prove cold-start Final Guard binding UAT boundary
        run: python scripts/check_mac_crypto_cold_start_final_guard_binding.py
