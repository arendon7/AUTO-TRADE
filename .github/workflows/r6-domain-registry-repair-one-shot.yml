name: R6 Verified Binding Read Repair

on:
  push:
    branches:
      - reconstruction/r6-external-paper-protection
    paths:
      - .github/workflows/r6-domain-registry-repair-one-shot.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Add tamper-checked binding read
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/autotrade/brokers/alpaca_paper_submission.py')
          text = path.read_text(encoding='utf-8')
          if '    def get_binding(self, order_id: str) -> PaperSubmissionBinding:\n' not in text:
              anchor = '''    def get_by_client_order_id(self, client_order_id: str) -> PaperSubmissionState:\n'''
              method = '''    def get_binding(self, order_id: str) -> PaperSubmissionBinding:\n        _validate_id(order_id, "order_id")\n        conn = self._runtime.connect()\n        try:\n            binding, _, _ = self._verify_locked(conn, order_id)\n            return binding\n        finally:\n            conn.close()\n\n'''
              if anchor not in text:
                  raise SystemExit('get_by_client_order_id anchor not found')
              text = text.replace(anchor, method + anchor, 1)
              path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_r6_submission_binding_read.py')
          test_path.write_text('''from __future__ import annotations\n\nfrom datetime import datetime, timezone\nfrom hashlib import sha256\nimport sqlite3\n\nimport pytest\n\nfrom autotrade.brokers.alpaca_paper_submission import (\n    PaperSubmissionBinding,\n    PaperSubmissionIntegrityError,\n    SQLitePaperSubmissionRegistry,\n)\nfrom autotrade.persistence import SQLiteRuntime\n\n\nNOW = datetime(2026, 8, 11, 14, 50, tzinfo=timezone.utc)\n\n\ndef h(value: str) -> str:\n    return sha256(value.encode()).hexdigest()\n\n\ndef binding() -> PaperSubmissionBinding:\n    return PaperSubmissionBinding(\n        order_id="binding-read-order-001",\n        client_order_id="autotrade-binding-read-001",\n        intent_id="binding-read-intent-001",\n        intent_fingerprint=h("intent"),\n        risk_decision_id="binding-read-risk-001",\n        account_attestation_fingerprint=h("account"),\n        order_payload_hash=h("payload"),\n        created_at=NOW,\n    )\n\n\ndef test_get_binding_is_durable_verified_read(tmp_path) -> None:\n    runtime = SQLiteRuntime(tmp_path / "binding-read.sqlite")\n    registry = SQLitePaperSubmissionRegistry(runtime)\n    frozen = binding()\n    registry.prepare(frozen)\n    assert registry.get_binding(frozen.order_id) == frozen\n    assert SQLitePaperSubmissionRegistry(runtime).get_binding(frozen.order_id) == frozen\n\n\ndef test_get_binding_detects_binding_tamper(tmp_path) -> None:\n    runtime = SQLiteRuntime(tmp_path / "binding-tamper.sqlite")\n    registry = SQLitePaperSubmissionRegistry(runtime)\n    frozen = binding()\n    registry.prepare(frozen)\n    with sqlite3.connect(runtime.path) as conn:\n        conn.execute(\n            "UPDATE alpaca_paper_submission_bindings SET binding_json=? WHERE order_id=?",\n            ('{}', frozen.order_id),\n        )\n        conn.commit()\n    with pytest.raises(PaperSubmissionIntegrityError):\n        registry.get_binding(frozen.order_id)\n''', encoding='utf-8')
          PY
      - name: Commit repair before certification
        run: |
          git config user.name arendon7
          git config user.email 102555888+arendon7@users.noreply.github.com
          git add src/autotrade/brokers/alpaca_paper_submission.py tests/test_r6_submission_binding_read.py
          git commit -m "fix(r6): expose verified durable submission binding read"
          git push origin HEAD:reconstruction/r6-external-paper-protection
      - name: Certify repaired tree
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q src tests scripts
          pytest --cov=autotrade --cov-report=term-missing
          python scripts/check_contract_registry.py
          python scripts/check_research_authority.py
          python scripts/check_r5_authority.py
          python scripts/check_r6_authority.py
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Self-clean on success
        run: |
          git rm .github/workflows/r6-domain-registry-repair-one-shot.yml
          git commit -m "chore(r6): remove verified binding repair one-shot"
          git push origin HEAD:reconstruction/r6-external-paper-protection
