name: OSS-3D2V Restart-Safe Real Acquisition

on:
  pull_request:
    branches:
      - research/oss3d2u-historical-collection-acquisition
    paths:
      - 'labs/oss3_market_data/real_acquisition_campaign.py'
      - 'labs/oss3_market_data/tests/test_real_acquisition_campaign.py'
      - 'scripts/run_oss3d2v_real_acquisition.py'
      - 'scripts/check_oss3d2v_restart_safe_real_acquisition_boundary.py'
      - 'knowledge/20_RESEARCH/OSS3D2V_RESTART_SAFE_REAL_ACQUISITION.md'
      - '.github/workflows/oss3d2v-restart-safe-real-acquisition.yml'
      - '.gitignore'
      - 'labs/oss3_market_data/archive_acquisition.py'
      - 'src/autotrade/research/oss3_market_collection.py'
      - 'src/autotrade/research/oss3_market_snapshot.py'
      - 'src/autotrade/research/external_data.py'

permissions:
  contents: read

jobs:
  oss3d2v:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install AUTO-TRADE core only
        run: python -m pip install -e '.[dev]'

      - name: Prove Qlib is absent from D2V runtime
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('qlib') is None, 'D2V workflow must remain Qlib-free'
          print('qlib runtime: ABSENT')
          PY

      - name: Compile D2V sources
        run: |
          python -m py_compile \
            labs/oss3_market_data/real_acquisition_campaign.py \
            labs/oss3_market_data/tests/test_real_acquisition_campaign.py \
            scripts/run_oss3d2v_real_acquisition.py \
            scripts/check_oss3d2v_restart_safe_real_acquisition_boundary.py

      - name: D2V restart-safe real acquisition boundary
        run: python scripts/check_oss3d2v_restart_safe_real_acquisition_boundary.py

      - name: D2V deterministic restart and corruption suite
        run: python -m pytest -q labs/oss3_market_data/tests/test_real_acquisition_campaign.py

      - name: D2V CLI defaults to offline status
        run: |
          EVIDENCE_ROOT="$(mktemp -d)/d2v-evidence"
          OUTPUT="$(python scripts/run_oss3d2v_real_acquisition.py --evidence-root "$EVIDENCE_ROOT")"
          python - "$OUTPUT" <<'PY'
          import json
          import sys
          payload = json.loads(sys.argv[1])
          assert payload['network_enabled'] is False
          assert payload['acquired_from_network'] == 0
          assert payload['descriptor_count'] == 99
          assert payload['complete'] is False
          assert payload['missing_without_network_authority'] == 99
          assert payload['final_holdout_values_loaded'] is False
          assert payload['capital_authority'] == 'NONE'
          assert payload['live_trading'] == 'BLOCKED'
          print('D2V CLI default network authority: ABSENT')
          PY

      - name: Re-prove D2U collection and acquisition contract
        run: |
          python scripts/check_oss3d2u_historical_collection_acquisition_boundary.py
          python -m pytest -q \
            tests/test_research_oss3_market_collection.py \
            labs/oss3_market_data/tests/test_archive_acquisition.py

      - name: Re-prove D2T immutable snapshot contract
        run: |
          python scripts/check_oss3d2t_immutable_market_snapshot_boundary.py
          python -m pytest -q \
            tests/test_research_oss3_market_snapshot.py \
            tests/test_research_oss3_market_snapshot_monthly.py

      - name: Re-prove R3 public GET-only transport contracts
        run: |
          python -m pytest -q \
            tests/test_r3_external_data.py \
            tests/test_r3_external_data_hardening.py

      - name: Research authority boundary
        run: python scripts/check_research_authority.py

      - name: Re-prove Qlib was never installed
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('qlib') is None, 'D2V unexpectedly gained Qlib runtime authority'
          print('qlib runtime after D2V certification: ABSENT')
          PY