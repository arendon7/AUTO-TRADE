name: OSS-3C Supervised Label Artifact Research

on:
  pull_request:
    branches:
      - research/oss3b-factor-matrix-artifact
    paths:
      - 'src/autotrade/research/oss3_supervised_label_artifact.py'
      - 'tests/test_research_oss3_supervised_label_artifact.py'
      - 'scripts/check_oss3c_supervised_label_boundary.py'
      - 'knowledge/20_RESEARCH/OSS3C_SUPERVISED_LABEL_ARTIFACT.md'
      - '.github/workflows/oss3c-supervised-label.yml'
      - 'src/autotrade/research/oss3_factor_matrix_artifact.py'
      - 'src/autotrade/research/oss3_qlib_artifact.py'
      - 'src/autotrade/research/oss2_final_holdout_evaluation.py'
      - 'src/autotrade/research/dsl.py'
      - 'src/autotrade/research/strategy.py'
      - 'src/autotrade/research/market.py'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  oss3c:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install AUTO-TRADE research core only
        run: python -m pip install -e '.[dev]'
      - name: Compile OSS-3B/3C
        run: |
          python -m py_compile \
            src/autotrade/research/oss3_factor_matrix_artifact.py \
            src/autotrade/research/oss3_supervised_label_artifact.py \
            tests/test_research_oss3_supervised_label_artifact.py \
            scripts/check_oss3c_supervised_label_boundary.py
      - name: Assert external ML runtimes remain outside core dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('pyproject.toml').read_text(encoding='utf-8').lower()
          assert 'pyqlib' not in text
          assert 'qlib==' not in text
          assert 'mlflow' not in text
          print('OSS-3C ML runtime dependency isolation: PASS')
          PY
      - name: OSS-3C deterministic and adversarial label tests
        run: pytest -q tests/test_research_oss3_supervised_label_artifact.py
      - name: OSS-3C authority and holdout boundary
        run: python scripts/check_oss3c_supervised_label_boundary.py
      - name: OSS-3B regression
        run: |
          pytest -q tests/test_research_oss3_factor_matrix_artifact.py
          python scripts/check_oss3b_factor_matrix_boundary.py
      - name: OSS-3A regression
        run: |
          pytest -q tests/test_research_oss3_qlib_artifact.py
          python scripts/check_oss3a_qlib_artifact_boundary.py
      - name: Research authority regression
        run: python scripts/check_research_authority.py
      - name: W83 canonical strategy runtime re-proof
        run: python scripts/check_w83_strategy_version_binding_boundary.py
      - name: OSS-2H single-use holdout regression
        run: |
          pytest -q \
            tests/test_research_oss2_final_holdout_evaluation.py \
            tests/test_research_oss2_final_holdout_evaluation_adversarial.py \
            tests/test_research_oss2_final_holdout_evaluation_edges.py
          python scripts/check_oss2h_final_holdout_evaluation_boundary.py
