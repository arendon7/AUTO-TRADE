name: R6 Close Unsupported Products Debt

on:
  push:
    branches:
      - reconstruction/r6-external-paper-protection
    paths:
      - .github/workflows/r6-close-unsupported-products-debt.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Close only TD-R6-007
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          register = Path('knowledge/00_CANON/debt_register.json')
          doc = json.loads(register.read_text(encoding='utf-8'))
          matches = [item for item in doc['items'] if item.get('id') == 'TD-R6-007']
          if len(matches) != 1:
              raise SystemExit('TD-R6-007 must exist exactly once')
          item = matches[0]
          if item.get('status') != 'OPEN':
              raise SystemExit(f'unexpected TD-R6-007 status: {item.get("status")}')
          item['status'] = 'CLOSED'
          item['evidence'] = [
              'src/autotrade/brokers/alpaca_paper_bracket.py',
              'src/autotrade/brokers/alpaca_paper_trade_updates.py',
              'scripts/check_r6_product_boundary.py',
              'scripts/check_r6_authority.py',
              'tests/test_r6_unsupported_products_boundary.py',
              'tests/test_r6_equity_bracket.py',
              '.github/workflows/r6-authority.yml',
              '.github/workflows/core-tests.yml',
              'knowledge/60_EVIDENCE/R6_UNSUPPORTED_PRODUCTS_EVIDENCE.json'
          ]
          item['resolution'] = (
              'Certified fail-closed product boundary for R6: exact us_equity BUY LIMIT DAY bracket only, '
              'self-validating immutable request, authoritative Instrument Master asset_class/fingerprint, '
              'strict TP+stop protection surface, unsupported asset classes/order classes/TIF/types and '
              'forged payload/serialization/hash rejected before I/O. Permanent AST boundary forbids direct '
              'AlpacaEquityBracketRequest construction outside the certified builder and Core Safety executes '
              'the product boundary. Official pre-closure exact-head CI on 081ab06415500c4a2786c347db5a93f3ceb8c21f: '
              'Core 31509844731, Knowledge 31509844728, R6 Authority 31509844735 PASS.'
          )
          register.write_text(json.dumps(doc, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          human = Path('knowledge/00_CANON/DEBT_REGISTER.md')
          text = human.read_text(encoding='utf-8')
          old_row = '| `TD-R6-007` | P1 | unsupported products | unknown/unsupported products/classes/TIF fail closed; crypto bracket protection explicitly unsupported |\n'
          new_row = '| `TD-R6-007` | P1 | unsupported products | **CLOSED** — self-validating us_equity-only bracket surface + permanent product-boundary CI; unsupported classes/modes fail closed before I/O |\n'
          if old_row not in text:
              raise SystemExit('human TD-R6-007 row missing')
          text = text.replace(old_row, new_row, 1)
          if 'R6 P0/P1/P2 OPEN: **8**.' not in text:
              raise SystemExit('R6 open-count marker missing')
          text = text.replace('R6 P0/P1/P2 OPEN: **8**.', 'R6 P0/P1/P2 OPEN: **7**.', 1)
          human.write_text(text, encoding='utf-8')

          evidence = Path('knowledge/60_EVIDENCE/R6_UNSUPPORTED_PRODUCTS_EVIDENCE.json')
          ev = json.loads(evidence.read_text(encoding='utf-8'))
          ev['status'] = 'CLOSED_AFTER_OFFICIAL_EXACT_HEAD_CI'
          ev['official_exact_head_ci'] = {
              'head_sha': '081ab06415500c4a2786c347db5a93f3ceb8c21f',
              'core_safety_run_id': 31509844731,
              'knowledge_contract_run_id': 31509844728,
              'r6_authority_run_id': 31509844735,
              'result': 'PASS'
          }
          ev['next_gate'] = 'Post-closure exact-head CI must remain green; TD-R6-001..006 and TD-R6-008 remain OPEN.'
          evidence.write_text(json.dumps(ev, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Re-certify closure working tree
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q src tests scripts
          pytest --cov=autotrade --cov-report=term-missing
          python scripts/check_contract_registry.py
          python scripts/check_research_authority.py
          python scripts/check_r5_authority.py
          python scripts/check_r6_authority.py
          python scripts/check_r6_product_boundary.py
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Commit closure and self-clean
        run: |
          git config user.name arendon7
          git config user.email 102555888+arendon7@users.noreply.github.com
          git add knowledge/00_CANON/debt_register.json \
                  knowledge/00_CANON/DEBT_REGISTER.md \
                  knowledge/60_EVIDENCE/R6_UNSUPPORTED_PRODUCTS_EVIDENCE.json
          git rm .github/workflows/r6-close-unsupported-products-debt.yml
          test -z "$(git ls-files '.github/workflows/r6-close-unsupported-products-debt.yml' '.github/workflows/r6-*-one-shot.yml')"
          git commit -m "docs(r6): close TD-R6-007 unsupported-product debt"
          git push origin HEAD:reconstruction/r6-external-paper-protection
