name: Core Safety Tests

on:
  push:
    branches: [main, stable, "foundation/**", "feature/**", "reconstruction/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Compile
        run: python -m compileall -q src tests scripts

      - name: Tests with branch coverage
        run: pytest --cov=autotrade --cov-report=term-missing

      - name: Machine-readable contract registry
        run: python scripts/check_contract_registry.py

      - name: Research authority boundary
        run: python scripts/check_research_authority.py

      - name: R5 stream shadow forward authority boundary
        run: python scripts/check_r5_authority.py

      - name: R6 PAPER-only authority boundary
        run: python scripts/check_r6_authority.py

      - name: R6 permanent LIVE-deny authority boundary
        run: python scripts/check_r6_live_deny_boundary.py

      - name: R6 OMS external-handoff boundary
        run: python scripts/check_r6_oms_handoff_boundary.py

      - name: R6 offline canary coordinator boundary
        run: python scripts/check_r6_canary_coordinator_boundary.py

      - name: R6 human operator decision boundary
        run: python scripts/check_r6_operator_decision_boundary.py

      - name: R6 unsupported-product boundary
        run: python scripts/check_r6_product_boundary.py

      - name: Debt register contract
        run: python scripts/check_debt_register.py

      - name: Canonical knowledge contract
        run: python scripts/check_knowledge_contract.py
