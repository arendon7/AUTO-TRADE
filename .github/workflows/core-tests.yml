      - name: R7 PAPER broker-truth portfolio boundary
        run: python scripts/check_r7_paper_portfolio_boundary.py
      - name: R7 PAPER risk-reducing close-plan boundary
        run: python scripts/check_r7_paper_close_plan_boundary.py
      - name: R7 PAPER durable close lifecycle boundary
        run: python scripts/check_r7_paper_close_lifecycle_boundary.py
