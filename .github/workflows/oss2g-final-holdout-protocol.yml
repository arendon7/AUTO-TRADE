name: OSS-2G FINAL_HOLDOUT Protocol Research

on:
  pull_request:
    paths:
      - "src/autotrade/research/oss2_final_holdout_protocol.py"
      - "src/autotrade/research/oss2_holdout_freeze.py"
      - "src/autotrade/research/oss2_holdout_eligibility.py"
      - "src/autotrade/research/oss2_robustness.py"
      - "src/autotrade/research/__init__.py"
      - "tests/test_research_oss2_final_holdout_protocol.py"
      - "tests/test_research_oss2_holdout_freeze.py"
      - "scripts/check_oss2g_final_holdout_protocol_boundary.py"
      - ".github/workflows/oss2g-final-holdout-protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oss2g:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Compile OSS-2D/2E/2F/2G research surfaces
        run: |
          python -m py_compile \
            src/autotrade/research/oss2_robustness.py \
            src/autotrade/research/oss2_holdout_eligibility.py \
            src/autotrade/research/oss2_holdout_freeze.py \
            src/autotrade/research/oss2_final_holdout_protocol.py \
            scripts/check_oss2g_final_holdout_protocol_boundary.py

      - name: OSS-2G protocol tests
        run: pytest -q tests/test_research_oss2_final_holdout_protocol.py

      - name: OSS-2G authority boundary
        run: python scripts/check_oss2g_final_holdout_protocol_boundary.py

      - name: OSS-2F regression tests
        run: pytest -q tests/test_research_oss2_holdout_freeze.py

      - name: OSS-2F authority boundary regression
        run: python scripts/check_oss2f_holdout_freeze_boundary.py

      - name: OSS-2E regression tests
        run: pytest -q tests/test_research_oss2_holdout_eligibility.py

      - name: OSS-2E authority boundary regression
        run: python scripts/check_oss2e_holdout_eligibility_boundary.py

      - name: OSS-2D regression tests
        run: |
          pytest -q \
            tests/test_r3_multiple_testing.py \
            tests/test_research_dsr_metric_scaling.py \
            tests/test_research_oss2_robustness.py \
            tests/test_research_oss2_robustness_adversarial.py

      - name: Research authority boundary
        run: python scripts/check_research_authority.py

      - name: W83 strategy-version boundary re-proof
        run: python scripts/check_w83_strategy_version_binding_boundary.py
