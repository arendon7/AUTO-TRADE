name: R6 Implement Same Attempt Resume

on:
  push:
    branches: ["reconstruction/r6-external-paper-protection"]

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message == 'chore(r6) implement same attempt resume'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply TD-R6-012 patch
        run: |
          python scripts/r6_implement_same_attempt_resume.py
          python scripts/r6_fix_same_attempt_resume_tests.py
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused certification
        run: |
          python -m compileall -q src tests scripts
          pytest -q tests/test_r6_writer_same_attempt_resume.py tests/test_r6_paper_writer.py tests/test_r6_paper_canary_permit.py
          python scripts/check_r6_authority.py
          python scripts/check_r6_live_deny_boundary.py
          python scripts/check_r6_oms_handoff_boundary.py
          python scripts/check_r6_product_boundary.py
      - name: Full certification
        run: |
          pytest --cov=autotrade --cov-report=term-missing
          python scripts/check_contract_registry.py
          python scripts/check_research_authority.py
          python scripts/check_r5_authority.py
          python scripts/check_r6_authority.py
          python scripts/check_r6_live_deny_boundary.py
          python scripts/check_r6_oms_handoff_boundary.py
          python scripts/check_r6_product_boundary.py
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Publish implementation
        run: |
          git config user.name arendon7
          git config user.email 102555888+arendon7@users.noreply.github.com
          git rm -f scripts/r6_implement_same_attempt_resume.py scripts/r6_fix_same_attempt_resume_tests.py knowledge/60_EVIDENCE/R6_SAME_ATTEMPT_RESUME_TRIGGER.json
          git add src/autotrade/brokers/alpaca_paper_writer.py tests/test_r6_writer_same_attempt_resume.py tests/test_r6_paper_writer.py
          git commit -m "fix(r6): make consumed-permit same-attempt restart safe"
          git push origin HEAD:reconstruction/r6-external-paper-protection
