name: OSS-3D2X Post-Outage Continuous History

on:
  pull_request:
    branches:
      - research/oss3d2w-sealed-raw-split-handoff
    paths:
      - 'src/autotrade/research/oss3_market_collection.py'
      - 'tests/test_research_oss3_market_collection.py'
      - 'scripts/check_oss3d2u_historical_collection_acquisition_boundary.py'
      - 'labs/oss3_market_data/real_acquisition_campaign.py'
      - 'labs/oss3_market_data/tests/test_real_acquisition_campaign.py'
      - 'scripts/run_oss3d2v_real_acquisition.py'
      - '.github/workflows/oss3d2v-restart-safe-real-acquisition.yml'
      - 'labs/oss3_qlib/sealed_raw_split_handoff.py'
      - 'labs/oss3_qlib/tests/test_sealed_raw_split_handoff.py'
      - 'scripts/check_oss3d2w_sealed_raw_split_handoff_boundary.py'
      - 'knowledge/20_RESEARCH/OSS3D2U_HISTORICAL_COLLECTION_ACQUISITION.md'
      - 'knowledge/20_RESEARCH/OSS3D2V_RESTART_SAFE_REAL_ACQUISITION.md'
      - 'knowledge/20_RESEARCH/OSS3D2W_SEALED_RAW_SPLIT_HANDOFF.md'
      - 'knowledge/20_RESEARCH/OSS3D2X_POST_OUTAGE_CONTINUOUS_HISTORY.md'
      - 'scripts/check_oss3d2x_post_outage_continuous_history_boundary.py'
      - '.github/workflows/oss3d2x-post-outage-continuous-history.yml'

permissions:
  contents: read

jobs:
  oss3d2x:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout full D2X history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install AUTO-TRADE core only
        run: python -m pip install -e '.[dev]'

      - name: Prove Qlib is absent from D2X runtime
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('qlib') is None, 'D2X workflow must remain Qlib-free'
          print('qlib runtime: ABSENT')
          PY

      - name: Compile D2X and inherited boundary sources
        run: |
          python -m py_compile \
            scripts/check_oss3d2x_post_outage_continuous_history_boundary.py \
            scripts/check_oss3d2u_historical_collection_acquisition_boundary.py \
            scripts/check_oss3d2v_restart_safe_real_acquisition_boundary.py \
            scripts/check_oss3d2w_sealed_raw_split_handoff_boundary.py \
            scripts/run_oss3d2v_real_acquisition.py

      - name: D2X post-outage continuous-history boundary
        run: python scripts/check_oss3d2x_post_outage_continuous_history_boundary.py

      - name: Prove D2T production implementation is byte-identical to certified D2W base
        run: |
          BASE=7d522e422137b87432e65d5b1ab7756a982483d5
          git cat-file -e "$BASE^{commit}"
          git diff --exit-code "$BASE" -- \
            src/autotrade/research/oss3_market_snapshot.py \
            scripts/check_oss3d2t_immutable_market_snapshot_boundary.py \
            tests/test_research_oss3_market_snapshot.py \
            tests/test_research_oss3_market_snapshot_monthly.py
          echo "D2T implementation and certification surface: BYTE-IDENTICAL TO D2W"

      - name: Re-prove D2U V2 collection and acquisition contract
        run: |
          python scripts/check_oss3d2u_historical_collection_acquisition_boundary.py
          python -m pytest -q \
            tests/test_research_oss3_market_collection.py \
            labs/oss3_market_data/tests/test_archive_acquisition.py

      - name: Re-prove D2V restart-safe campaign on 99-descriptor V2 plan
        run: |
          python scripts/check_oss3d2v_restart_safe_real_acquisition_boundary.py
          python -m pytest -q labs/oss3_market_data/tests/test_real_acquisition_campaign.py
          EVIDENCE_ROOT="$(mktemp -d)/d2v-evidence"
          OUTPUT="$(python scripts/run_oss3d2v_real_acquisition.py --evidence-root "$EVIDENCE_ROOT")"
          python - "$OUTPUT" <<'PY'
          import json
          import sys
          payload = json.loads(sys.argv[1])
          assert payload['network_enabled'] is False
          assert payload['acquired_from_network'] == 0
          assert payload['descriptor_count'] == 99
          assert payload['missing_without_network_authority'] == 99
          assert payload['complete'] is False
          assert payload['final_holdout_values_loaded'] is False
          assert payload['capital_authority'] == 'NONE'
          assert payload['live_trading'] == 'BLOCKED'
          print('D2V V2 offline default: 99 missing, 0 network GETs, authority NONE')
          PY

      - name: Re-prove D2W sealed raw split handoff
        run: |
          python scripts/check_oss3d2w_sealed_raw_split_handoff_boundary.py
          python -m pytest -q labs/oss3_qlib/tests/test_sealed_raw_split_handoff.py

      - name: Re-prove raw TRAIN and DEVELOPMENT provenance boundaries
        run: |
          python scripts/check_oss3d2r_raw_training_bundle_provenance_boundary.py
          python scripts/check_oss3d2s_raw_development_provenance_boundary.py

      - name: Research authority boundary
        run: python scripts/check_research_authority.py

      - name: Re-prove Qlib was never installed
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('qlib') is None, 'D2X unexpectedly gained Qlib runtime authority'
          print('qlib runtime after D2X certification: ABSENT')
          PY
