name: W87 PAPER Execution Admission

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-admission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile W87 admission surfaces
        run: python -m compileall -q src/autotrade/paper_execution_admission.py scripts/check_w87_paper_execution_admission_boundary.py tests/test_w87_paper_execution_admission.py
      - name: W87 PAPER execution admission boundary
        run: python scripts/check_w87_paper_execution_admission_boundary.py
      - name: W87 PAPER execution admission adversarial tests
        run: pytest -q tests/test_w87_paper_execution_admission.py
      - name: Re-prove W86 readiness seal
        run: python scripts/check_w86_paper_runtime_readiness_seal_boundary.py
      - name: Re-prove W86 read-only collection pipeline
        run: python scripts/check_w86_paper_runtime_read_only_pipeline_boundary.py
      - name: Re-prove W86 funding capacity
        run: python scripts/check_w86_paper_runtime_funding_capacity_boundary.py
      - name: Re-prove W85 PAPER candidate admission
        run: python scripts/check_w85_paper_candidate_admission_boundary.py
      - name: Re-prove R6 PAPER authority boundary
        run: python scripts/check_r6_authority.py
      - name: Re-prove permanent LIVE deny
        run: python scripts/check_r6_live_deny_boundary.py
