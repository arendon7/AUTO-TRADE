name: R2 Stable Snapshot Micro Patch

on:
  push:
    branches: ["reconstruction/r2-capital-oms"]
    paths: [".r2micro/TRIGGER"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconstruction/r2-capital-oms
          fetch-depth: 0
      - run: python .r2micro/apply.py
      - run: python -m compileall -q src tests scripts
      - name: Commit self-cleaned result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(r2): keep order snapshot events recovery-stable"
          git push origin HEAD:reconstruction/r2-capital-oms
