name: R6 Final Guard Chain

on:
  push:
    branches:
      - reconstruction/r6-external-paper-protection
    paths:
      - .github/workflows/r6-final-guard-chain.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: reconstruction/r6-external-paper-protection
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Link PRE_IO to PRE_CONSUME and move recheck adjacent to write
        run: |
          python - <<'PY'
          from pathlib import Path

          guard = Path('src/autotrade/brokers/alpaca_paper_final_guard.py')
          text = guard.read_text(encoding='utf-8')
          old = '''        phase: PaperFinalWritePhase,\n        expected_attempt_id: str | None = None,\n    ) -> PaperFinalWriteAttestation:\n'''
          new = '''        phase: PaperFinalWritePhase,\n        expected_attempt_id: str | None = None,\n        previous_attestation: PaperFinalWriteAttestation | None = None,\n    ) -> PaperFinalWriteAttestation:\n'''
          if old not in text:
              raise SystemExit('final guard signature marker missing')
          text = text.replace(old, new, 1)

          old = '''        if phase is PaperFinalWritePhase.PRE_CONSUME:\n            if expected_attempt_id is not None:\n                reasons.append("PRE_CONSUME must not carry expected_attempt_id")\n'''
          new = '''        if phase is PaperFinalWritePhase.PRE_CONSUME:\n            if expected_attempt_id is not None:\n                reasons.append("PRE_CONSUME must not carry expected_attempt_id")\n            if previous_attestation is not None:\n                reasons.append("PRE_CONSUME must not carry previous_attestation")\n'''
          if old not in text:
              raise SystemExit('PRE_CONSUME marker missing')
          text = text.replace(old, new, 1)

          old = '''        else:\n            if not expected_attempt_id:\n                reasons.append("PRE_IO requires expected_attempt_id")\n            if submission.status is not PaperSubmissionStatus.UNKNOWN:\n'''
          new = '''        else:\n            if not expected_attempt_id:\n                reasons.append("PRE_IO requires expected_attempt_id")\n            if previous_attestation is None:\n                reasons.append("PRE_IO requires the actual PRE_CONSUME attestation")\n            else:\n                if previous_attestation.phase is not PaperFinalWritePhase.PRE_CONSUME:\n                    reasons.append("PRE_IO predecessor must be PRE_CONSUME")\n                if previous_attestation.approval_hash != approval.approval_hash:\n                    reasons.append("PRE_IO predecessor approval hash mismatch")\n                if previous_attestation.order_id != approval.order_id:\n                    reasons.append("PRE_IO predecessor order_id mismatch")\n                if previous_attestation.client_order_id != approval.client_order_id:\n                    reasons.append("PRE_IO predecessor client_order_id mismatch")\n                if previous_attestation.binding_hash != binding.fingerprint:\n                    reasons.append("PRE_IO predecessor binding hash mismatch")\n                if previous_attestation.risk_decision_id != approval.risk_decision_id:\n                    reasons.append("PRE_IO predecessor risk_decision_id mismatch")\n                if previous_attestation.observed_at > observed_at:\n                    reasons.append("PRE_IO observation cannot precede PRE_CONSUME")\n                if previous_attestation.safety_state_version != safety.version:\n                    reasons.append("Safety state version changed between PRE_CONSUME and PRE_IO")\n                if previous_attestation.portfolio_version != versioned_portfolio.version:\n                    reasons.append("Portfolio State version changed between PRE_CONSUME and PRE_IO")\n                if previous_attestation.strategy_health_fingerprint != health.strategy_state_fingerprint:\n                    reasons.append("strategy Health evidence changed between PRE_CONSUME and PRE_IO")\n                if previous_attestation.portfolio_health_fingerprint != health.portfolio_state_fingerprint:\n                    reasons.append("portfolio Health evidence changed between PRE_CONSUME and PRE_IO")\n            if submission.status is not PaperSubmissionStatus.UNKNOWN:\n'''
          if old not in text:
              raise SystemExit('PRE_IO marker missing')
          text = text.replace(old, new, 1)
          guard.write_text(text, encoding='utf-8')

          writer = Path('src/autotrade/brokers/alpaca_paper_writer.py')
          text = writer.read_text(encoding='utf-8')
          old = '''        try:\n            pre_io_guard = final_guard.authorize(\n                approval=approval,\n                expected_bracket=expected_bracket,\n                submission_registry=submission_registry,\n                now=now,\n                phase=PaperFinalWritePhase.PRE_IO,\n                expected_attempt_id=attempt_id,\n            )\n        except PaperFinalWriteBlocked as exc:\n            # UNKNOWN is intentionally retained. No POST occurred; only reconciliation\n            # may resolve whether any external order exists.\n            raise PaperWriterBlocked(f"final PRE_IO guard rejected: {exc}") from exc\n\n        request = AlpacaPaperWriteRequest(\n'''
          new = '''        request = AlpacaPaperWriteRequest(\n'''
          if old not in text:
              raise SystemExit('writer PRE_IO-before-request block missing')
          text = text.replace(old, new, 1)

          marker = '''        self._policy.validate_request(request)\n\n        # Exactly one external write call exists in this module. No loop/retry.\n        response = self._transport.write(request)\n'''
          replacement = '''        self._policy.validate_request(request)\n\n        try:\n            pre_io_guard = final_guard.authorize(\n                approval=approval,\n                expected_bracket=expected_bracket,\n                submission_registry=submission_registry,\n                now=now,\n                phase=PaperFinalWritePhase.PRE_IO,\n                expected_attempt_id=attempt_id,\n                previous_attestation=pre_consume_guard,\n            )\n        except PaperFinalWriteBlocked as exc:\n            # UNKNOWN is intentionally retained. No POST occurred; only reconciliation\n            # may resolve whether any external order exists.\n            raise PaperWriterBlocked(f"final PRE_IO guard rejected: {exc}") from exc\n\n        # Exactly one external write call exists in this module. No loop/retry.\n        response = self._transport.write(request)\n'''
          if marker not in text:
              raise SystemExit('writer request validation/write marker missing')
          text = text.replace(marker, replacement, 1)
          writer.write_text(text, encoding='utf-8')

          checker = Path('scripts/check_r6_authority.py')
          text = checker.read_text(encoding='utf-8')
          old = '''        if "final_guard: PaperFinalWriteGuard" not in text:\n            errors.append("writer: authoritative PaperFinalWriteGuard parameter is required")\n'''
          new = old + '''        if "previous_attestation=pre_consume_guard" not in text:\n            errors.append("writer: PRE_IO must be chained to the actual PRE_CONSUME attestation")\n        request_validation = text.find("self._policy.validate_request(request)")\n        if not 0 <= request_validation < pre_io < transport_write:\n            errors.append("writer: PRE_IO must occur after request validation and immediately before transport write")\n'''
          if old not in text:
              raise SystemExit('authority final guard marker missing')
          text = text.replace(old, new, 1)
          checker.write_text(text, encoding='utf-8')

          tests = Path('tests/test_r6_final_write_guard.py')
          text = tests.read_text(encoding='utf-8')
          old = '''              attested = authorize(\n                  values,\n                  phase=PaperFinalWritePhase.PRE_IO,\n                  attempt_id="expected-attempt",\n              )\n'''
          new = '''              predecessor = authorize(values)\n              attested = values[8].authorize(\n                  approval=values[4],\n                  expected_bracket=values[1],\n                  submission_registry=values[2],\n                  now=NOW + timedelta(seconds=1),\n                  phase=PaperFinalWritePhase.PRE_IO,\n                  expected_attempt_id="expected-attempt",\n                  previous_attestation=predecessor,\n              )\n'''
          if old not in text:
              raise SystemExit('final guard PRE_IO success test marker missing')
          text = text.replace(old, new, 1)

          old = '''                  authorize(\n                      values,\n                      phase=PaperFinalWritePhase.PRE_IO,\n                      attempt_id="different-attempt",\n                  )\n'''
          new = '''                  values[8].authorize(\n                      approval=values[4],\n                      expected_bracket=values[1],\n                      submission_registry=values[2],\n                      now=NOW + timedelta(seconds=1),\n                      phase=PaperFinalWritePhase.PRE_IO,\n                      expected_attempt_id="different-attempt",\n                      previous_attestation=predecessor,\n                  )\n'''
          if old not in text:
              raise SystemExit('final guard PRE_IO mismatch test marker missing')
          text = text.replace(old, new, 1)
          text += '''\n\ndef test_pre_io_requires_preconsume_attestation_and_unchanged_safety_version(tmp_path):\n    values = setup(tmp_path)\n    predecessor = authorize(values)\n    values[2].mark_submit_attempt_unknown(\n        order_id=values[0].order_id,\n        attempt_id="version-attempt",\n        now=NOW + timedelta(milliseconds=100),\n    )\n    values[6].activate(reason="intervening-kill", now=NOW + timedelta(milliseconds=200))\n    values[6].reset(now=NOW + timedelta(milliseconds=300))\n    with pytest.raises(PaperFinalWriteBlocked, match="Safety state version changed"):\n        values[8].authorize(\n            approval=values[4],\n            expected_bracket=values[1],\n            submission_registry=values[2],\n            now=NOW + timedelta(seconds=1),\n            phase=PaperFinalWritePhase.PRE_IO,\n            expected_attempt_id="version-attempt",\n            previous_attestation=predecessor,\n        )\n\n\ndef test_pre_io_blocks_intervening_portfolio_version_even_if_snapshot_remains_safe(tmp_path):\n    values = setup(tmp_path)\n    predecessor = authorize(values)\n    values[2].mark_submit_attempt_unknown(\n        order_id=values[0].order_id,\n        attempt_id="portfolio-version-attempt",\n        now=NOW + timedelta(milliseconds=100),\n    )\n    versioned = values[7].get()\n    changed = replace(versioned.snapshot, snapshot_id="guard-portfolio-002")\n    values[7].compare_and_set(expected_version=versioned.version, snapshot=changed, now=NOW)\n    with pytest.raises(PaperFinalWriteBlocked, match="Portfolio State version changed"):\n        values[8].authorize(\n            approval=values[4],\n            expected_bracket=values[1],\n            submission_registry=values[2],\n            now=NOW + timedelta(seconds=1),\n            phase=PaperFinalWritePhase.PRE_IO,\n            expected_attempt_id="portfolio-version-attempt",\n            previous_attestation=predecessor,\n        )\n\n\ndef test_pre_io_without_predecessor_is_fail_closed(tmp_path):\n    values = setup(tmp_path)\n    values[2].mark_submit_attempt_unknown(\n        order_id=values[0].order_id,\n        attempt_id="missing-predecessor",\n        now=NOW + timedelta(milliseconds=100),\n    )\n    with pytest.raises(PaperFinalWriteBlocked, match="actual PRE_CONSUME"):\n        values[8].authorize(\n            approval=values[4],\n            expected_bracket=values[1],\n            submission_registry=values[2],\n            now=NOW + timedelta(seconds=1),\n            phase=PaperFinalWritePhase.PRE_IO,\n            expected_attempt_id="missing-predecessor",\n        )\n'''
          tests.write_text(text, encoding='utf-8')
          PY
      - name: Commit hardening before verification
        run: |
          git config user.name arendon7
          git config user.email 102555888+arendon7@users.noreply.github.com
          git add src/autotrade/brokers/alpaca_paper_final_guard.py \
                  src/autotrade/brokers/alpaca_paper_writer.py \
                  scripts/check_r6_authority.py \
                  tests/test_r6_final_write_guard.py
          git commit -m "fix(r6): chain final guard across the external write boundary"
          git push origin HEAD:reconstruction/r6-external-paper-protection
      - name: Verify focused and full safety suite
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_r6_final_write_guard.py tests/test_r6_paper_writer.py tests/test_r6_authority_checker.py
          python scripts/check_r6_authority.py
          pytest --cov=autotrade --cov-report=term-missing
          python scripts/check_contract_registry.py
          python scripts/check_research_authority.py
          python scripts/check_r5_authority.py
          python scripts/check_r6_authority.py
          python scripts/check_debt_register.py
          python scripts/check_knowledge_contract.py
      - name: Self-clean
        run: |
          git rm .github/workflows/r6-final-guard-chain.yml
          git commit -m "chore(r6): remove final guard chain helper"
          git push origin HEAD:reconstruction/r6-external-paper-protection
