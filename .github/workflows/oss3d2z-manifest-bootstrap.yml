name: OSS-3D2Z Manifest Bootstrap

on:
  push:
    branches:
      - research/oss3d2z-durable-descriptor-material-manifest
    paths:
      - '.github/workflows/oss3d2z-manifest-bootstrap.yml'

permissions:
  contents: write
  actions: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout D2Z branch
        uses: actions/checkout@v5
        with:
          ref: research/oss3d2z-durable-descriptor-material-manifest
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install AUTO-TRADE core only
        run: python -m pip install -e .

      - name: Download exact certified D2X/D2Y real campaign artifact
        uses: actions/download-artifact@v4
        with:
          name: oss3d2x-v2-real-campaign-20260908
          path: bootstrap-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34309982898

      - name: Derive timestamp-independent 99-descriptor material manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          import io
          import json
          from pathlib import Path
          import tarfile

          from autotrade.research.oss3_market_collection import canonical_oss3d2u_collection_plan

          ART = Path('bootstrap-artifact')
          INVENTORY = ART / 'd2x-v2-evidence-inventory.json'
          TAR = ART / 'oss3d2x-v2-real-evidence-20260908.tar.gz'
          OUT = Path('knowledge/20_RESEARCH/evidence/OSS3D2Z_REAL_DESCRIPTOR_MATERIAL_MANIFEST.json')

          SOURCE_INVENTORY_SHA = '94d47d9bfef334b590a0946fa0094b6534c542f1e5ef41d6a481b893f5a6ce57'
          SOURCE_TAR_SHA = 'c5d0f694a68f8bf7b67c35774900efaaaad7b425e95735f60660824e07446277'
          SOURCE_ARTIFACT_SHA = '23598e3bd2f42b645095291115451d115dae60455b813c5653f28ebd5a6b7dc7'
          D2Y_SEAL = '919009bf61a1a3512e99c3b8edb21017b8d0de4f97722dcc3849f5ba1b5f9beb'
          EXPECTED_ROOT = '8aef56ea8e96c2c880765440da86e31041d846324f7b9a3ebd79d0a1a470cdaf'
          EXPECTED_FILE_SHA = '0edaf50aadb7a56d106b38c398ba2f7e6a4b09a0b21cb0fdd38c9e18573f696b'
          POLICY = 'EXACT_PROVIDER_ARCHIVE_CHECKSUM_AND_D2T_OUTPUT_RECEIPT_TIMESTAMP_INDEPENDENT_V1'
          SCHEMA = [
              'descriptor_fingerprint',
              'archive_sha256',
              'checksum_payload_sha256',
              'snapshot_artifact_hash',
              'normalized_dataset_hash',
              'material_identity_hash',
          ]

          def h(raw: bytes) -> str:
              return sha256(raw).hexdigest()

          def canonical(value: object) -> bytes:
              return json.dumps(value, sort_keys=True, separators=(',', ':'), allow_nan=False).encode('utf-8')

          inventory_raw = INVENTORY.read_bytes()
          tar_raw = TAR.read_bytes()
          assert h(inventory_raw) == SOURCE_INVENTORY_SHA
          assert h(tar_raw) == SOURCE_TAR_SHA
          inventory = json.loads(inventory_raw)
          assert inventory['file_count'] == 398
          assert inventory['descriptor_count'] == 99
          by_path = {item['path']: item for item in inventory['files']}
          assert len(by_path) == 398

          plan = canonical_oss3d2u_collection_plan()
          assert len(plan.descriptors) == 99
          assert plan.fingerprint == 'f43abdcd532f07d37b54f93abafbd3b29a3c3ee07afeedbae95b7aa15153c59d'

          archive = tarfile.open(fileobj=io.BytesIO(tar_raw), mode='r:gz')
          prefix = 'oss3d2x-v2-evidence/'
          entries = []
          for descriptor in plan.descriptors:
              symbol = descriptor.instrument.symbol
              period = descriptor.period
              base = f'{symbol}/{period}'
              archive_rel = f'{base}/{descriptor.archive_filename}'
              checksum_rel = f'{base}/{descriptor.checksum_filename}'
              snapshot_rel = f'{base}/d2t-snapshot.json'
              receipt_rel = f'{base}/d2u-acquisition-receipt.json'
              for rel in (archive_rel, checksum_rel, snapshot_rel, receipt_rel):
                  assert rel in by_path, rel

              snapshot_raw = archive.extractfile(prefix + snapshot_rel).read()
              snapshot = json.loads(snapshot_raw)
              manifest = snapshot['manifest']
              assert manifest['descriptor_fingerprint'] == descriptor.fingerprint
              assert manifest['archive_sha256'] == by_path[archive_rel]['sha256']
              assert manifest['checksum_payload_sha256'] == by_path[checksum_rel]['sha256']
              assert h(snapshot_raw) == by_path[snapshot_rel]['sha256']
              assert manifest['received_rows'] == manifest['expected_rows'] == descriptor.expected_rows

              core = [
                  descriptor.fingerprint,
                  manifest['archive_sha256'],
                  manifest['checksum_payload_sha256'],
                  snapshot['artifact_hash'],
                  manifest['normalized_dataset_hash'],
              ]
              material_identity = h(json.dumps(core, separators=(',', ':'), allow_nan=False).encode('utf-8'))
              entries.append(core + [material_identity])

          stable_root = h(json.dumps([entry[-1] for entry in entries], separators=(',', ':'), allow_nan=False).encode('utf-8'))
          assert stable_root == EXPECTED_ROOT
          document = {
              'manifest_version': 'OSS3D2Z_REAL_DESCRIPTOR_MATERIAL_MANIFEST_V1',
              'identity_policy': POLICY,
              'entry_schema': SCHEMA,
              'd2y_seal_fingerprint': D2Y_SEAL,
              'source_inventory_sha256': SOURCE_INVENTORY_SHA,
              'source_evidence_tar_sha256': SOURCE_TAR_SHA,
              'source_artifact_zip_sha256': SOURCE_ARTIFACT_SHA,
              'collection_id': plan.collection_id,
              'plan_fingerprint': plan.fingerprint,
              'descriptor_count': 99,
              'stable_material_root': stable_root,
              'entries': entries,
          }
          payload = canonical(document) + b'\n'
          assert h(payload) == EXPECTED_FILE_SHA
          OUT.parent.mkdir(parents=True, exist_ok=True)
          OUT.write_bytes(payload)
          print('D2Z stable root:', stable_root)
          print('D2Z manifest SHA-256:', h(payload))
          print('D2Z entries:', len(entries))
          PY

      - name: Commit durable manifest and remove bootstrap workflow
        run: |
          set -euo pipefail
          test "$(sha256sum knowledge/20_RESEARCH/evidence/OSS3D2Z_REAL_DESCRIPTOR_MATERIAL_MANIFEST.json | cut -d' ' -f1)" = "0edaf50aadb7a56d106b38c398ba2f7e6a4b09a0b21cb0fdd38c9e18573f696b"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/20_RESEARCH/evidence/OSS3D2Z_REAL_DESCRIPTOR_MATERIAL_MANIFEST.json
          git rm .github/workflows/oss3d2z-manifest-bootstrap.yml
          git commit -m "research: freeze D2Z stable 99-descriptor material manifest"
          git push origin HEAD:research/oss3d2z-durable-descriptor-material-manifest
