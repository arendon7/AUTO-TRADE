name: OSS-3D2B Isolated Qlib Lab

on:
  pull_request:
    branches:
      - research/oss3d2a-development-inference-contract
    paths:
      - 'labs/oss3_qlib/**'
      - 'scripts/check_oss3d2b_qlib_lab_boundary.py'
      - 'knowledge/20_RESEARCH/OSS3D2B_ISOLATED_QLIB_LAB.md'
      - '.github/workflows/oss3d2b-qlib-lab.yml'
      - 'src/autotrade/research/oss3_development_inference.py'
      - 'src/autotrade/research/oss3_training_bundle.py'
      - 'src/autotrade/research/oss3_factor_matrix_artifact.py'
      - 'src/autotrade/research/oss3_supervised_label_artifact.py'
      - 'src/autotrade/research/oss3_qlib_artifact.py'
      - 'src/autotrade/research/dsl.py'
      - 'src/autotrade/research/strategy.py'
      - 'src/autotrade/research/market.py'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  oss3d2b:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install AUTO-TRADE core only
        run: python -m pip install -e '.[dev]'
      - name: Compile isolated lab and boundary
        run: |
          python -m py_compile \
            labs/oss3_qlib/model_contract.py \
            labs/oss3_qlib/dataset_adapter.py \
            labs/oss3_qlib/network_guard.py \
            labs/oss3_qlib/runner.py \
            labs/oss3_qlib/tests/test_runner.py \
            scripts/check_oss3d2b_qlib_lab_boundary.py
      - name: Prove Qlib remains outside AUTO-TRADE core
        run: python scripts/check_oss3d2b_qlib_lab_boundary.py
      - name: Install pinned isolated Qlib runtime
        run: python -m pip install -r labs/oss3_qlib/requirements.txt
      - name: Verify exact Qlib runtime version
        run: |
          python - <<'PY'
          import qlib
          assert qlib.__version__ == '0.9.7', qlib.__version__
          print('OSS-3D2B pyqlib runtime: 0.9.7 PASS')
          PY
      - name: Real Qlib ridge integration tests
        run: python -m pytest -q labs/oss3_qlib/tests/test_runner.py
      - name: Re-prove isolated lab boundary after external runtime install
        run: python scripts/check_oss3d2b_qlib_lab_boundary.py
      - name: OSS-3D2A regression
        run: |
          pytest -q tests/test_research_oss3_development_inference.py
          python scripts/check_oss3d2a_development_inference_boundary.py
      - name: OSS-3D1 regression
        run: |
          pytest -q \
            tests/test_research_oss3_training_bundle.py \
            tests/test_research_oss3_training_bundle_edges.py
          python scripts/check_oss3d1_training_bundle_boundary.py
      - name: OSS-3C regression
        run: |
          pytest -q tests/test_research_oss3_supervised_label_artifact.py
          python scripts/check_oss3c_supervised_label_boundary.py
      - name: OSS-3B regression
        run: |
          pytest -q tests/test_research_oss3_factor_matrix_artifact.py
          python scripts/check_oss3b_factor_matrix_boundary.py
      - name: OSS-3A regression
        run: |
          pytest -q tests/test_research_oss3_qlib_artifact.py
          python scripts/check_oss3a_qlib_artifact_boundary.py
      - name: Research authority regression
        run: python scripts/check_research_authority.py
      - name: W83 canonical strategy runtime re-proof
        run: python scripts/check_w83_strategy_version_binding_boundary.py
      - name: OSS-2H single-use holdout regression
        run: |
          pytest -q \
            tests/test_research_oss2_final_holdout_evaluation.py \
            tests/test_research_oss2_final_holdout_evaluation_adversarial.py \
            tests/test_research_oss2_final_holdout_evaluation_edges.py
          python scripts/check_oss2h_final_holdout_evaluation_boundary.py
